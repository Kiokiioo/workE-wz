/* ---- 惩罚抽取：列表 / 记录 ---- */
function lotPuns(){const cfg=S.lottery||(S.lottery={});if(!Array.isArray(cfg.puns))cfg.puns=DEFAULT_PUNS();return cfg.puns;}
function lotPunLogs(){const cfg=S.lottery||(S.lottery={});if(!Array.isArray(cfg.punLogs))cfg.punLogs=[];return cfg.punLogs;}
function punLogsHtml(){
  const logs=lotPunLogs(),puns=lotPuns();
  const recent=logs.slice().reverse().slice(0,40);

/* ============ SCHEDULE ============ */
const DAYS=[["1","周一"],["2","周二"],["3","周三"],["4","周四"],["5","周五"]];
/* 科目配色：常见科目固定一组按色相尽量分散的颜色（不再按出现顺序取色，避免相邻科撞色）。
   物理=橙、生物=青绿，二者明显区分；英语=绿、政治=黄、语文=红、数学=蓝、化学=紫、历史=棕、地理=粉、体育=青蓝。
   兜底调色板：未列入上表的科目按名称散列取色。 */
const SUBJ_COLOR_MAP={
  "语文":"#e15759","数学":"#4e79a7","英语":"#59a14f","物理":"#f28e2b",
  "化学":"#b07aa1","生物":"#16a085","政治":"#f1c40f","历史":"#9c755f",
  "地理":"#e84393","体育":"#0ea5e9","音乐":"#8e44ad","美术":"#7f8c8d"
};
const SUBJ_COLORS=["#4f6bed","#0ea5e9","#14b8a6","#22c55e","#84cc16","#f59e0b","#f97316","#ef4444","#ec4899","#8b5cf6"];
function subjColor(sub){
  const t=String(sub||"").trim();
  if(!t)return "var(--line)";
  if(SUBJ_COLOR_MAP[t])return SUBJ_COLOR_MAP[t];
  let h=0;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))>>>0;
  return SUBJ_COLORS[h%SUBJ_COLORS.length];
}
/* 上课时间 {s,e} → "08:00-08:45"；只有一端则只显示一端；都为空返回 "" */
function tRange(o){const s=(o&&o.s)||"",e=(o&&o.e)||"";if(s&&e)return s+"-"+e;return s||e||"";}
/* 时间输入对：起 / 止两个 type=time，值形如 "08:00"。
   排版与同弹窗的「星期 / 节次」完全相同：一行两个等宽列、底对齐、可收缩。 */
function timeFields(idS,idE,o){
  return `<div class="field row" style="align-items:flex-end"><div style="flex:1;min-width:0"><label class="lbl">开始时间</label><input class="fld" type="time" id="${idS}" value="${esc((o&&o.s)||"")}"></div>
    <div style="flex:1;min-width:0"><label class="lbl">结束时间</label><input class="fld" type="time" id="${idE}" value="${esc((o&&o.e)||"")}"></div></div>`;
}
function readTime(idS,idE){return {s:($("#"+idS).value||"").trim(),e:($("#"+idE).value||"").trim()};}
function viewSchedule(v){
  const per=effectivePeriods();
  const wk=schedWeek();
  const todayD=((new Date().getDay()+6)%7)+1; // 1..5 weekday
  const head=`<div class="p"></div>${DAYS.map(d=>`<div class="p ${d[0]==todayD?'today':''}" style="${d[0]==todayD?'color:var(--brand-ink)':''}">${d[1]}</div>`).join("")}`;
  const cellHtml=(d,p,today)=>{
    const c=S.schedule.cells[d+"-"+p];
    const add=`<button class="cell-add" title="${c?"修改这一格":"添加课程"}" onclick="W.editCell('${d}','${p}')">${c?"✎":"+"}</button>`;
    /* 单双周按当前教学周单独显示：每周课总显示；单/双周课只在与本周奇偶一致时显示。
       无法推算周次（无学期开始日期或今天早于学期开始）时退回全显示。 */
    const list=cellEntries(c).filter(([w2])=>!w2||!wk||w2===wk.parity);
    const first=list.length?list[0][1]:(c&&(c.o||c.e)?(c.o||c.e):c);
    const phone=first&&first.tel?`<a class="cell-phone" href="tel:${esc(first.tel)}" title="拨打 ${esc(first.tch||"任课老师")} ${esc(first.tel)}">☎</a>`:"";
    /* 单双周分列：每门课一行，带「单/双」小标，点课程名可直接编辑该侧 */
    const body=list.map(([w2,cc])=>{
      const tag=w2?`<i class="wtag">${w2==="o"?"单":"双"}</i>`:"";
      const tap=w2?` style="cursor:pointer" title="${wName(w2)}，点按编辑" onclick="W.editCell('${d}','${p}','${w2}')"`:"";
      return `<div class="sub"${tap}><span>${tag}${esc(cc.sub)}</span></div>${cc.tch?`<div class="tch">${esc(cc.tch)}</div>`:""}`;
    }).join("");
    return `<div class="cell ${today?'today':''}" style="border-left-color:${subjColor(first&&first.sub)}">${body}<div class="btns">${add}${phone}</div></div>`;
  };
  /* 节次行：行首「第N节」+ 该节次上课时间 */
  const pRow=(p,label,timeStr)=>{
    const labelHtml=`<span>${esc(label)}</span>`;
    let s=`<div class="p">${labelHtml}${timeStr?`<span class="p-t">${esc(timeStr)}</span>`:""}</div>`;
    s+=DAYS.map(d=>cellHtml(d[0],p,d[0]==todayD)).join("");
    return s;
  };
  let rows="";
  const hasM=Object.keys(S.schedule.cells).some(k=>k.endsWith("-m"));
  const evRows=["e1","e2","e3"].filter(ek=>Object.keys(S.schedule.cells).some(k=>k.endsWith("-"+ek)));
  /* 早自习（有课则显示在第一节之前）→ 第1..N节 → 晚自习一/二/三（有课则依次显示在最后一节之后） */
  if(hasM)rows+=pRow("m","早自习",tRange(S.schedule.times.m));
  for(let p=1;p<=per;p++)rows+=pRow(p,"第"+p+"节",tRange(S.schedule.times[p]));
  evRows.forEach(ek=>rows+=pRow(ek,periodLabel(ek),tRange((S.schedule.times||{})[ek])));
  v.innerHTML=`
  <div class="row wrap" style="justify-content:flex-end;margin-bottom:12px">
    ${wk?`<span class="chip brand" style="margin-right:auto" title="按学期开始日期推算：开始那一周为第 1 周（单周），依次类推">第 ${wk.n} 周 · ${wName(wk.parity)}</span>`:""}
    <div class="row">
      <button class="btn ghost sm h30" onclick="W.manageTerms()" title="学期管理（归档的学期不出现在时间范围选项里）">学期</button>
      <button class="btn ghost sm h30" onclick="W.saveSchedRecord()" title="把当前课表保存为一条课表记录，存进历史记录，可随时恢复">记录</button>
      <button class="btn ghost sm h30" onclick="W.importSchedule()">导入</button>
      <button class="btn ghost sm h30" onclick="W.exportSchedule()">导出</button>
      <button class="btn ghost sm h30" onclick="W.clearSchedule()">清空</button>
      <button class="btn sm h30" onclick="W.addSchedule()">+ 添加</button>
    </div>
  </div>
  <div class="card pad"><div class="sched-scroll"><div class="sched">${head}${rows}</div></div></div>`;
}

W.toggleTask=id=>{const t=el(id,S.todos);if(!t)return;
  t.done=!t.done;if(t.done)t.dropped=false;
  /* 完成一条重复事务 → 自动生成下一期（超过「重复至」截止日则不再生成） */
  if(t.done&&taskRepN(t)>0){
    const n=taskRepN(t),u=taskRepU(t);
    const next=repNextDate(taskDate(t)||todayStr(),n,u);
    const end=t.repeatEnd||"";
    if(end&&next>end)toast("已到重复截止日 "+end+"，不再生成下一期");
    else{
      const c={id:uid(),text:t.text,done:false,dropped:false,type:t.type,repN:n,repU:u,repeatEnd:end};
      if(t.type==="事件"){c.date=next;c.cat=t.cat||"班级";c.list="以后";c.priority="";c.due="";}
      else{c.due=next;c.date="";c.list=t.list||"今天";c.priority=t.priority||"";c.cat="";}
      S.todos.push(c);toast("已生成下一期："+next);
    }
  }
  save();refresh();};

/* 解析名册 CSV 文本并追加到名单；返回 {n,empty}（纯函数） */
function applyRosterText(txt){
  const lines=String(txt||"").replace(/^\ufeff/,"").split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length)return {n:0,empty:true};
  const cells=l=>l.split(/[,，]/).map(x=>x.trim());
  const HMAP={"学号":"no","姓名":"name","名字":"name","等级":"tier","家长电话":"phone","电话":"phone",
    "备注":"note","学习组":"g","组":"g","性别":"sex","身高":"height"};
  const head=cells(lines[0]);
  let map=null,start=0;
  if(head.filter(h=>HMAP[h]).length>=2){map={};head.forEach((h,i)=>{if(HMAP[h]&&map[HMAP[h]]===undefined)map[HMAP[h]]=i;});start=1;}
  /* 无表头时的位置顺序（与导出顺序去掉等级/备注后一致） */
  const POS=["no","name","phone","g","sex","height"];
  const get=(c,k,d)=>{
    let v;
    if(map)v=map[k]!==undefined?c[map[k]]:"";
    else{const i=POS.indexOf(k);v=i>=0?(c[i]||""):"";}
    return v===""?d:v;
  };
  let n=0;for(let i=start;i<lines.length;i++){
    const c=cells(lines[i]);
    const name=get(c,"name","");if(!name)continue;
    S.students.push({id:uid(),name,no:get(c,"no",""),sex:get(c,"sex","男")||"男",
      g:get(c,"g",""),tier:"",phone:get(c,"phone",""),height:+get(c,"height",0)||0,note:get(c,"note","")});n++;}
  return {n};
}

W.doEditBehavior=id=>{
  const b=el(id,S.behaviors);if(!b)return;
  const oldDelta=b.delta||0;
  const oldSid=b.studentId;
  b.studentId=$("#m_bs").value;
  const type=$("#m_bt").value.trim();
  b.type=type;
  b.reason=$("#m_br").value.trim();
  b.delta=parseInt($("#m_bp").value,10)||0;
  const rawT=$("#m_btime")?$("#m_btime").value:"";
  if(rawT)b.time=rawT.replace("T"," ");
  if(type && !(Array.isArray(S.behTypes)?S.behTypes:[]).some(t=>t.k===type)){
    (Array.isArray(S.behTypes)&&S.behTypes.length?S.behTypes:(S.behTypes=DEFAULT_BEH_TYPES())).push({k:type,c:b.delta<0?"bad":b.delta>0?"ok":"brand",pts:b.delta});
  }
  /* 成绩自动记录在「不计入总积分」时按 0 参与：编辑不写积分、删日志不留脏数据 */
  const counts=b.auto!==GRADE_TYPE||gradeOn();
  const diff=(counts?b.delta:0)-(counts?oldDelta:0);
  if(diff){
    if(oldSid!==b.studentId){S.points.scores[oldSid]=(S.points.scores[oldSid]||0)-oldDelta;S.points.scores[b.studentId]=(S.points.scores[b.studentId]||0)+b.delta;}
    else S.points.scores[b.studentId]=(S.points.scores[b.studentId]||0)+diff;
  }
  const lg=S.points.logs.find(l=>l.behId===id);
  if(lg){lg.studentId=b.studentId;lg.delta=b.delta;lg.reason="行为·"+b.type+(b.reason?"："+b.reason:"");}
  else if(b.delta&&counts){S.points.logs.push({id:uid(),studentId:b.studentId,delta:b.delta,reason:"行为·"+b.type+(b.reason?"："+b.reason:""),time:b.time,behId:id});}
  save();closeModal();refresh();toast("已修改");
};

};

W.renameBehType=(old,nv)=>{
  nv=nv.trim();if(!nv||nv===old){W.renderBehTypes();return;}
  if((Array.isArray(S.behTypes)?S.behTypes:[]).some(x=>x.k===nv)){toast("已有同名类别");W.renderBehTypes();return;}
  const t=(Array.isArray(S.behTypes)?S.behTypes:[]).find(x=>x.k===old);
  if(t)t.k=nv;
  S.behaviors.forEach(b=>{if(b.type===old)b.type=nv;});
  S.points.logs.forEach(l=>{if(l.behId&&l.reason&&l.reason.startsWith("行为·"+old))l.reason=l.reason.replace("行为·"+old,"行为·"+nv);});
  if(behFilter===old)behFilter=nv;
  save();W.renderBehTypes();
};

W.importBehTypes=()=>{
  /* 点击即弹出系统文件选择窗口 */
  pickFile(".json,application/json",f=>readFileAsText(f,(text,err)=>{
    if(err){toast(err);return;}

  }));

/* 解析行为类别配置 JSON 并覆盖写入；返回 true/false（纯函数） */
function applyBehTypesText(text){
  try{
    const cfg=JSON.parse(text);
    if(!cfg||!Array.isArray(cfg.behTypes)){toast("文件格式不正确");return false;}
    S.behTypes=cfg.behTypes.map(t=>({k:String(t.k||"").trim(),c:t.c||"brand",pts:Math.max(-99,Math.min(99,parseInt(t.pts,10)||0))})).filter(t=>t.k);
    if(cfg.gradeRules&&typeof cfg.gradeRules==="object"){const R=gradeRules();const on0=gradeOn();GRADE_RULE_LABELS.forEach(([k])=>{if(k in cfg.gradeRules)R[k]=Math.max(-99,Math.min(99,parseInt(cfg.gradeRules[k],10)||0));});if("gradeOn" in cfg.gradeRules)R.gradeOn=!!cfg.gradeRules.gradeOn;if(gradeOn()!==on0)syncGradePoints();}
    ensureGradeType();save();closeModal();W.renderBehTypes();toast("已导入 "+S.behTypes.length+" 个类别");
    return true;
  }catch(e){toast("解析失败：文件不是有效 JSON");return false;}
}

/* ============ 班级工作（职务 + 周期末自动加分） ============ */
/* 周期键：day=当天；week=本周一；month=本月。前缀区分类型，避免跨类型误判。
   同一职务 + 同一学生 + 同一周期只计一次（幂等）。 */
function jobPeriodKey(cycle,d){
  d=d||new Date();const p=n=>n.toString().padStart(2,"0");
  if(cycle==="week"){
    const off=(d.getDay()+6)%7;/* 周一=0 */
    const m=new Date(d);m.setDate(d.getDate()-off);
    return "W"+m.getFullYear()+"-"+p(m.getMonth()+1)+"-"+p(m.getDate());
  }
  if(cycle==="month")return "M"+d.getFullYear()+"-"+p(d.getMonth()+1);
  return "D"+d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
}
const jobCycleText=c=>c==="week"?"每周":c==="month"?"每月":"每天";
/* 自动记录时刻说明：每天 / 每周日 / 每月末 的最后一分钟 */
const jobCycleLabel=c=>c==="week"?"每周日 23:59 自动记录":c==="month"?"每月末 23:59 自动记录":"每天 23:59 自动记录";
function parseYMD(s){const a=String(s||"").split("-").map(Number);return new Date(a[0]||1970,(a[1]||1)-1,a[2]||1);}
/* 周期起止：返回 {start:Date(00:00), end:Date(23:59:59.999)} */
function jobPeriodSpan(cycle,key){
  const p=n=>n.toString().padStart(2,"0");const a=key.slice(1).split("-");const y=+a[0],m=+a[1],d=+a[2];
  if(cycle==="month"){const start=new Date(y,m-1,1);const end=new Date(y,m,0,23,59,59,999);return{start,end};}
  if(cycle==="week"){const start=new Date(y,m-1,d);const end=new Date(y,m-1,d+6,23,59,59,999);return{start,end};}
  const start=new Date(y,m-1,d);const end=new Date(y,m-1,d,23,59,59,999);return{start,end};
}
/* 周期平移 k 步：day 加 k 天；week 加 k 周；month 加 k 月。返回新 key */
function jobPeriodShift(cycle,key,k){
  const sp=jobPeriodSpan(cycle,key);const d=new Date(sp.start);
  if(cycle==="week")d.setDate(d.getDate()+7*k);else if(cycle==="month")d.setMonth(d.getMonth()+k);else d.setDate(d.getDate()+k);
  return jobPeriodKey(cycle,d);
}
/* 是否处于某周期最后 2 分钟内（命中「周期最后一分钟自动记录」） */
function jobInFinalMinute(cycle,now){
  now=now||new Date();const cur=jobPeriodKey(cycle,now);const end=jobPeriodSpan(cycle,cur).end;
  const ms=end.getTime()-now.getTime();return ms>=0&&ms<=120000;
}
/* 自动结算：周期最后一分钟（或周期已结束后页面再次打开时）按周期计入职务加分。
   不立即算分：只记「已结束的周期」；当前周期未结束不记；可补记中间漏掉的若干周期（gap）。
   返回本次新增条数。 */
function runJobAuto(){
  const jobs=Array.isArray(S.classJobs)?S.classJobs:[];
  if(!jobs.length)return 0;
  const logs=S.points.logs||(S.points.logs=[]);
  const now=new Date();
  let n=0;
  jobs.forEach(j=>{
    const pts=+j.pts||0;
    if(!pts)return;
    if(!j.created)j.created=nowStr().slice(0,10);/* 旧数据懒迁移：从今天起算，不回补历史 */
    const curKey=jobPeriodKey(j.cycle,now);
    const toKey=jobInFinalMinute(j.cycle,now)?curKey:jobPeriodShift(j.cycle,curKey,-1);/* 最晚可记：最后一分钟含当前，否则取上一（已结束）周期 */
    (j.studentIds||[]).forEach(sid=>{
      if(!(S.students||[]).some(s=>s.id===sid))return;
      const lastLog=logs.filter(l=>l.jobId===j.id&&l.studentId===sid).sort((a,b)=>a.period<b.period?-1:1).pop();
      const fromKey=lastLog?jobPeriodShift(j.cycle,lastLog.period,1):jobPeriodKey(j.cycle,parseYMD(j.created));
      let key=fromKey,guard=0;
      while(key<=toKey&&guard++<600){
        if(!logs.some(l=>l.jobId===j.id&&l.studentId===sid&&l.period===key)){
          S.points.scores[sid]=(S.points.scores[sid]||0)+pts;
          logs.push({id:uid(),studentId:sid,delta:pts,reason:"职务·"+j.name,time:nowStr(),jobId:j.id,period:key});
          n++;
        }
        key=jobPeriodShift(j.cycle,key,1);
      }
    });
  });
  if(n)save();
  return n;
}
/* ---- 科任老师：仅信息记录，不参与加分 ---- */
/* 给定科目，统计参考：考试次数 + 最近一次平均分（保留 1 位小数，无数据 → null） */
function teacherSubjectStats(subject){
  const subj=String(subject||"").trim();
  if(!subj)return{n:0,latestAvg:null};
  const exams=Array.isArray(S.exams)?S.exams:[];
  const hits=exams.filter(e=>Array.isArray(e.subjects)&&e.subjects.indexOf(subj)>=0);
  if(!hits.length)return{n:0,latestAvg:null};
  const sorted=[...hits].sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const latest=sorted[0];
  const scores=Object.values(latest.scores||{}).map(m=>m&&m[subj]).filter(v=>typeof v==="number");
  const latestAvg=scores.length?(scores.reduce((a,b)=>a+b,0)/scores.length):null;
  return{n:hits.length,latestAvg:latestAvg};
}

/* 任职起止（默认 from=创建时；to=归档时） */
function tenureRecord(kind,role,holderName,extras){
  const now=new Date();
  const p=n=>n.toString().padStart(2,"0");
  return{id:uid(),kind,role,holderName:String(holderName||""),from:now.getFullYear()+"-"+p(now.getMonth()+1)+"-"+p(now.getDate()),to:"",extras:extras||null};
}

/* 关闭当前任职（填上 to 日期） */
function closeTenure(rec){
  const now=new Date();
  const p=n=>n.toString().padStart(2,"0");
  rec.to=now.getFullYear()+"-"+p(now.getMonth()+1)+"-"+p(now.getDate());
}

W.saveJob=id=>{
  const jobs=Array.isArray(S.classJobs)?S.classJobs:(S.classJobs=[]);
  const name=$("#m_jn").value.trim();
  if(!name){toast("请填职务名称");return;}
  const cycle=$("#m_jc").value==="week"?"week":"day";
  const pts=Math.max(-99,Math.min(99,parseInt($("#m_jp").value,10)||0));
  const ids=Array.from(document.querySelectorAll(".jstu:checked")).map(x=>x.value);
  const j=id?el(id,jobs):null;
  if(j){j.name=name;j.cycle=cycle;j.pts=pts;j.studentIds=ids;}
  else jobs.push({id:uid(),name,cycle,pts,studentIds:ids,created:nowStr().slice(0,10)});
  save();
  closeModal();refresh();toast("已保存，将在"+jobCycleLabel(cycle)+"计入积分");
};
W.delJob=id=>{
  const jobs=Array.isArray(S.classJobs)?S.classJobs:[];
  const j=el(id,jobs);if(!j)return;
  if(!confirm("删除职务「"+j.name+"」？已计入的积分保留。"))return;
  S.classJobs=jobs.filter(x=>x.id!==id);
  save();refresh();toast("已删除");
};
W.runJobPoints=()=>{
  const jobs=Array.isArray(S.classJobs)?S.classJobs:[];
  const logs=S.points.logs||(S.points.logs=[]);
  const now=new Date();let n=0;
  jobs.forEach(j=>{
    const pts=+j.pts||0;if(!pts)return;
    const key=jobPeriodKey(j.cycle,now);
    (j.studentIds||[]).forEach(sid=>{
      if(!(S.students||[]).some(s=>s.id===sid))return;
      if(logs.some(l=>l.jobId===j.id&&l.studentId===sid&&l.period===key))return;
      S.points.scores[sid]=(S.points.scores[sid]||0)+pts;
      logs.push({id:uid(),studentId:sid,delta:pts,reason:"职务·"+j.name,time:nowStr(),jobId:j.id,period:key});
      n++;
    });

W.setSeatCfg=(k,val)=>{
  const cfg=S.seatCfg;
  /* 兼容：旧单值 bigGroup 已迁移为 bigGroups 数组（load() 处理） */
  if(!Array.isArray(cfg.bigGroups)||!cfg.bigGroups.length){
    cfg.bigGroups=[Math.min(3,cfg.cols)];
  }
  let needReset=false;
  if(k==="rows"){const n=Math.max(1,Math.min(12,parseInt(val,10)||1));cfg.rows=n;cfg.studyGroup=Math.min(cfg.studyGroup||n,n);cfg.studyMerges=[];cfg.row0Merge={};needReset=true;}
  else if(k==="cols"){
    const n=Math.max(1,Math.min(12,parseInt(val,10)||1));
    const oldCols=cfg.cols;cfg.cols=n;
    /* 大组列数按比例缩放到新 cols，不超 0 */
    const used=cfg.bigGroups.reduce((a,b)=>a+b,0);
    if(used>n){
      let acc=0;cfg.bigGroups=cfg.bigGroups.map(x=>{const remain=n-acc;const v=Math.min(x,Math.max(0,remain));acc+=v;return v;}).filter(x=>x>0);
      if(!cfg.bigGroups.length)cfg.bigGroups=[n];
    }else if(used<n){
      /* 末尾追加空列到 cols */
      cfg.bigGroups[cfg.bigGroups.length-1]=(cfg.bigGroups[cfg.bigGroups.length-1]||0)+(n-used);
    }
    /* 列数变化可能让旧合并 tag 名失效（无法找到对应段），清空合并 + 第0排归入 */
    if(oldCols!==n){cfg.studyMerges=[];cfg.row0Merge={};}
    needReset=true;
  }
  else if(k==="addBigGroup"){
    /* 新增一个大组：从最宽的大组对半拆出一组（列总和必须始终 = cols，每组至少 1 列） */
    if(cfg.bigGroups.length>=cfg.cols)return;
    let src=0;for(let i=1;i<cfg.bigGroups.length;i++){if(cfg.bigGroups[i]>=cfg.bigGroups[src])src=i;}
    if(cfg.bigGroups[src]<2)return; /* 没有可拆分的组（每组都是 1 列） */
    const w=cfg.bigGroups[src];
    cfg.bigGroups[src]=Math.floor(w/2);
    cfg.bigGroups.splice(src+1,0,Math.ceil(w/2));
    cfg.studyMerges=[];/* 大组数量变化 → 组名移位，合并记录失效 */
  }
  else if(k==="delBigGroup"){
    if(cfg.bigGroups.length<=1)return;
    const idx=parseInt(val,10);
    if(isNaN(idx)||idx<0||idx>=cfg.bigGroups.length)return;
    const removed=cfg.bigGroups[idx];
    cfg.bigGroups.splice(idx,1);
    /* 删除大组后，把空出来的列并入最后一组，保持总和 = cols */
    const last=cfg.bigGroups.length-1;
    cfg.bigGroups[last]=(cfg.bigGroups[last]||0)+removed;
    cfg.studyMerges=[];cfg.row0Merge={};/* 大组数量变化 → 组名移位，合并记录失效 */
  }
  else if(k==="setBigGroup"){
    const parts=String(val).split(",");
    const idx=parseInt(parts[0],10);
    if(isNaN(idx)||idx<0||idx>=cfg.bigGroups.length)return;
    /* 单个大组最多 cols-(其它组各 1 列) 列，最少 1 列 */
    const maxForOne=cfg.cols-(cfg.bigGroups.length-1);
    const n=Math.max(1,Math.min(maxForOne,parseInt(parts[1],10)||1));
    cfg.bigGroups[idx]=n;
    /* 自动再平衡：保证所有大组列数之和恒等于 cols，不再拒绝 */
    let sum=cfg.bigGroups.reduce((a,b)=>a+b,0);
    let diff=cfg.cols-sum;
    if(diff!==0){
      const order=cfg.bigGroups.map((x,i)=>i).filter(i=>i!==idx).sort((a,b)=>cfg.bigGroups[b]-cfg.bigGroups[a]);
      if(diff<0){
        /* 总和超了：从其它组（最大优先，每组至少留 1 列）扣回 */
        let take=-diff;
        for(const i of order){if(take<=0)break;const g=Math.min(take,cfg.bigGroups[i]-1);if(g>0){cfg.bigGroups[i]-=g;take-=g;}}
        if(take>0)cfg.bigGroups[idx]=Math.max(1,cfg.bigGroups[idx]-take); /* 其它组已无法再减，回退当前组 */
      }else{
        /* 总和少了：依次补给其它组（最大优先） */
        let give=diff;
        for(const i of order){if(give<=0)break;cfg.bigGroups[i]+=1;give--;}
      }
    }
  }
  else if(k==="studyGroup"){
    const n=Math.max(1,Math.min(cfg.rows,parseInt(val,10)||1));
    cfg.studyGroup=n;
    cfg.studyMerges=[];/* 学习组排数变化让旧合并段失效 */
  }
  else if(k==="tagSide"){
    /* 学习组名竖排标签位置：left ↔ right（不重置座位） */
    cfg.tagSide=cfg.tagSide==="right"?"left":"right";
  }
  else if(k==="row0"){
    /* 第0排开关：切换时保留现有座位数据（开启=前插一行空位，关闭=移除首行） */
    cfg.row0=!cfg.row0;
    const cols=cfg.cols;
    if(cfg.row0){
      ["seating","seatZones"].forEach(p=>{if(Array.isArray(S[p]))S[p]=new Array(cols).fill(null).concat(S[p]);});
      if(Array.isArray(S.seatFixed))S.seatFixed=new Array(cols).fill(false).concat(S.seatFixed);
    }else{
      ["seating","seatZones","seatFixed"].forEach(p=>{if(Array.isArray(S[p]))S[p]=S[p].slice(cols);});
    }
    cfg.row0Merge={};
  }
  if(needReset){
    const _n=(cfg.rows+(cfg.row0?1:0))*cfg.cols;
    S.seating=new Array(_n).fill(null);
    S.seatZones=new Array(_n).fill(null);
    S.seatFixed=new Array(_n).fill(false);
  }
  W.syncStudyGroups();
  save();viewSeating(document.getElementById("view"));
};
/* 同步学习组命名 → 学生 s.g：第一大组第一个学习组=一A组，第一大组第二个学习组=一B组... */
W.syncStudyGroups=()=>{
  const cfg=S.seatCfg;
  if(!Array.isArray(cfg.bigGroups)||!cfg.bigGroups.length||!cfg.studyGroup)return;
  /* 1) 清空所有学生 s.g（学习组命名由座位表统一管理） */
  S.students.forEach(s=>{s.g="";});
  /* 2) 当前学习组命名映射：bigIdx (0-based) × studyIdx (0-based) → 一A组 */
  const ABC="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  const buildName=(bigIdx,studyIdx)=>`${toCNum(bigIdx+1)}${ABC[studyIdx]||(studyIdx+1)}组`;
  /* 3) 由列索引推导大组索引（按 bigGroups 累加） */
  const bigIdxOf=(c)=>{let acc=0;for(let gi=0;gi<cfg.bigGroups.length;gi++){acc+=cfg.bigGroups[gi];if(c<acc)return gi;}return cfg.bigGroups.length-1;};
  /* 4) 计算每个座位所属学习组：原始行 idx0（第0排占 0），列 c=0..cols-1
       - 第 0 排：默认独立（命名 = 空），除非 row0Merge[bigIdx] 指定归入学习组
       - 非第 0 排：物理 studyIdx = Math.floor((idx0-?)/studyGroup)；
         合并段内统一用起点 tag 名命名（studyMerges 通过 tag 名匹配） */
  const studyMerges=Array.isArray(cfg.studyMerges)?cfg.studyMerges:[];
  const row0Merge=cfg.row0Merge||{};
  /* 给定 (gi, physicalIdx) 返回用于命名的 tag 名：合并段则用起点 sIdx 重建的 name */
  const resolveTag=(gi,physicalIdx)=>{
    const baseName=buildName(gi,physicalIdx);
    for(const m of studyMerges){
      if(!m||!m.tags)continue;
      if(m.tags.includes(baseName)){
        /* 自定义名优先（合并后可改名），否则按字母序取最小 sIdx 重建 name 作为该 merge 的统一名 */
        const nm=m.name&&String(m.name).trim();
        if(nm)return nm;
        const firstTag=m.tags.slice().sort()[0];
        return firstTag;
      }
    }
    return baseName;
  };
  const nameOf=i=>{
    const idx0=Math.floor(i/cfg.cols),c=i%cfg.cols;
    const bigIdx=bigIdxOf(c);
    if(cfg.row0&&idx0===0){
      /* 第 0 排：归入指定大组学习组（手动并入），否则独立（命名空） */
      const tgt=row0Merge[bigIdx];
      return tgt!==undefined?buildName(bigIdx,tgt):"";
    }
    const rowNum=cfg.row0?idx0:idx0+1; /* 物理行号（≥1） */
    const physicalIdx=Math.floor((rowNum-1)/cfg.studyGroup);
    return resolveTag(bigIdx,physicalIdx);
  };
  /* 5) 按学生当前所在座位填入学习组；不在座位上的学生 g 留空 */
  S.students.forEach(s=>{
    const idx=S.seating.findIndex(v=>v===s.id);
    if(idx>=0)s.g=nameOf(idx);
  });
};

W.toggleMergeMode=()=>{
  if(mergeMode&&mergeSel.size>=2){
    /* 已选 ≥2 个组名时点合 = 执行合并：选中集合即为新合并段（跨大组可合并） */
    const newTags=[...mergeSel];
    const cur=Array.isArray(S.seatCfg.studyMerges)?S.seatCfg.studyMerges:[];
    S.seatCfg.studyMerges=cur.filter(m=>!m.tags.some(t=>mergeSel.has(t)));
    S.seatCfg.studyMerges.push({id:'m'+Date.now(),tags:newTags});
    mergeSel.clear();
    W.syncStudyGroups();save();
    toast("已合并 "+newTags.length+" 个学习组");
    viewSeating(document.getElementById("view"));
    return;/* 保持合并模式，方便连续合并；空选时再点合退出 */
  }
  mergeMode=!mergeMode;
  if(!mergeMode)mergeSel.clear();
  viewSeating(document.getElementById("view"));
};
/* 合并模式点组名：仅切换选中（组名或已有合并段整体）；≥2 后再点「合」按钮执行 */
W.toggleMergeSel=(rawTags)=>{
  if(!mergeMode)return;
  const tags=String(rawTags).split('|');
  const hasAll=tags.every(t=>mergeSel.has(t));
  if(hasAll){tags.forEach(t=>mergeSel.delete(t));}
  else{tags.forEach(t=>mergeSel.add(t));}
  viewSeating(document.getElementById("view"));
};
/* 第0排归入循环：独立 → 一A组 → 一B组 → … → 独立（仅合并模式下点第0排标签触发） */
W.cycleRow0Merge=(gi)=>{
  const cfg=S.seatCfg;
  const totalS=Math.max(1,Math.ceil((cfg.rows||1)/Math.max(1,cfg.studyGroup||1)));
  if(!cfg.row0Merge||typeof cfg.row0Merge!=="object")cfg.row0Merge={};
  const cur=cfg.row0Merge[gi];
  if(cur===undefined||cur<0)cfg.row0Merge[gi]=0;
  else if(cur>=totalS-1)delete cfg.row0Merge[gi];
  else cfg.row0Merge[gi]=cur+1;
  W.syncStudyGroups();save();viewSeating(document.getElementById("view"));
  const v=cfg.row0Merge[gi];
  const _A="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  toast(v===undefined?("第0排已独立（大组"+toCNum(gi+1)+"）"):("第0排已并入 "+toCNum(gi+1)+(_A[v]||String(v+1))+"组"));
};

W.unmergeByName=(rawTags)=>{

/* ---- 组长（每个学习组 1 名大组长 + 1 名小组长，仅标记身份） ---- */
/* 当前配置下的学习组清单：与座位渲染一致——合并段算 1 个组，键取该合并段最左(gi,s) */
function studyGroupList(){
  const cfg=S.seatCfg;
  const cols=cfg.cols||1,rows=cfg.rows||1;
  const bigGroups=Array.isArray(cfg.bigGroups)&&cfg.bigGroups.length?cfg.bigGroups:[cols];
  const sg=Math.max(1,Math.min(rows,cfg.studyGroup|0||rows));
  const segCnt=Math.max(1,Math.ceil(rows/sg));
  const buildName=(gi,s)=>`${toCNum(gi+1)}${("ABCDEFGHIJKLMNOPQRSTUVWXYZ")[s]||(s+1)}组`;
  const bandOf=name=>{
    for(let gi=0;gi<bigGroups.length;gi++)for(let s=0;s<segCnt;s++)if(buildName(gi,s)===name)return [gi,s];
    return null;
  };
  const merges=(Array.isArray(cfg.studyMerges)?cfg.studyMerges:[]).filter(m=>m&&Array.isArray(m.tags)&&m.tags.length>=2);
  const used={};merges.forEach(m=>m.tags.forEach(t=>used[t]=1));
  const out=[];
  merges.forEach(m=>{
    const bands=m.tags.map(bandOf).filter(Boolean).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
    if(!bands.length)return;
    const sorted=[...m.tags].sort();
    const autoName=sorted.length<=3?sorted.join('+'):(sorted[0]+'+…');
    const disp=(m.name&&String(m.name).trim())?String(m.name).trim():autoName;
    out.push({key:bands[0][0]+":"+bands[0][1],name:disp,bands});
  });
  for(let gi=0;gi<bigGroups.length;gi++)for(let s=0;s<segCnt;s++){
    const n=buildName(gi,s);
    if(used[n])continue;
    out.push({key:gi+":"+s,name:n,bands:[[gi,s]]});
  }
  return out;
}
/* 某学习组（若干 gi:s 段）内已就座的学生 */
function membersOfBands(bands){
  ensureSeat();
  const cfg=S.seatCfg;
  const cols=cfg.cols||1,rows=cfg.rows||1,row0=!!cfg.row0;
  const sg=Math.max(1,Math.min(rows,cfg.studyGroup|0||rows));
  const bigGroups=Array.isArray(cfg.bigGroups)&&cfg.bigGroups.length?cfg.bigGroups:[cols];
  const spans=[];let acc=0;bigGroups.forEach(w=>{spans.push([acc+1,acc+w]);acc+=w;});
  const ids=[];
  (bands||[]).forEach(p=>{
    const gi=p[0],s=p[1];
    const sp=spans[gi]||[1,cols];
    const idxStart=(row0?s*sg+1:s*sg);
    const idxEnd=(row0?Math.min((s+1)*sg,rows):Math.min((s+1)*sg,rows)-1);
    for(let idx=idxStart;idx<=idxEnd;idx++){
      for(let c=sp[0];c<=sp[1];c++){
        const sid=S.seating[idx*cols+(c-1)];
        if(sid)ids.push(sid);
      }
    }
  });
  return ids;
}

function ensureSeat(){const n=(S.seatCfg.rows+(S.seatCfg.row0?1:0))*S.seatCfg.cols;
  if(!S.seating||S.seating.length!==n)S.seating=new Array(n).fill(null);
  if(!S.seatZones||S.seatZones.length!==n)S.seatZones=new Array(n).fill(null);
  if(!S.seatFixed||S.seatFixed.length!==n)S.seatFixed=new Array(n).fill(false);}
/* Fisher–Yates 洗牌（顶层可见，autoSeat / runTierSeat 共享） */
function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
W.runTierSeat=()=>{
  ensureSeat();const n=(S.seatCfg.rows+(S.seatCfg.row0?1:0))*S.seatCfg.cols;
  const assigned=new Array(n).fill(null);const rep=[];let overflow=0;
  const pool=new Set(S.students.map(s=>s.id));
  let fixedKept=0;
  for(let i=0;i<n;i++){
    if(S.seatFixed[i]){fixedKept++;const sid=S.seating[i];if(sid&&pool.has(sid)){assigned[i]=sid;pool.delete(sid);}}
  }
  ["A","B","C"].forEach(t=>{
    const seats=shuf(S.seatZones.map((z,i)=>z===t?i:-1).filter(i=>i>=0&&assigned[i]===null&&!S.seatFixed[i]));
    const stus=shuf([...pool].map(id=>el(id,S.students)).filter(s=>tierOf(s)===t).map(s=>s.id));
    const m=Math.min(seats.length,stus.length);
    for(let i=0;i<m;i++){assigned[seats[i]]=stus[i];pool.delete(stus[i]);}
    if(stus.length>seats.length)overflow+=stus.length-seats.length;
    rep.push(t+" "+stus.length+"人/"+seats.length+"座");
  });
  const free=shuf(S.seatZones.map((z,i)=>(!z&&!S.seatFixed[i]&&assigned[i]===null)?i:-1).filter(i=>i>=0));
  const rest=shuf([...pool]);
  rest.forEach((s,i)=>{if(i<free.length){assigned[free[i]]=s;pool.delete(s);}});
  S.seating=assigned;W.syncStudyGroups();save();
  if((location.hash||"#home")==="#seating")viewSeating(document.getElementById("view"));
  toast("已按等级排座（"+rep.join("，")+"）"+(fixedKept?"，固定 "+fixedKept+" 座未动":"")+(overflow?"；超出 "+overflow+" 人填入未标记区":""));
};

/* ---- 学期删除联动：删除学期时，连同学期时间范围内的带日期数据一起删除（归档不删） ----
   范围判定：日期字符串取前 10 位与 start/end 比较；两侧可空（空的一侧不设限）；起止都空则不删任何数据。 */
function termDateIn(t,x){
  const s=t.start||"",e=t.end||"";
  if(!s&&!e)return false;
  const d=String(x||"").slice(0,10);
  if(!d)return false;
  if(s&&d<s)return false;
  if(e&&d>e)return false;
  return true;
}
/* 统计将被删除的数据条数（纯函数，供确认弹窗展示） */
function termDelPlan(t){
  const exids=S.exams.filter(x=>termDateIn(t,x.date)).map(x=>x.id);
  const behIds=new Set(S.behaviors.filter(b=>termDateIn(t,b.time)||exids.includes(b.examId)).map(b=>b.id));
  return {
    beh:S.behaviors.filter(b=>behIds.has(b.id)).length,
    logs:S.points.logs.filter(l=>behIds.has(l.behId)||exids.includes(l.examId)||termDateIn(t,l.time)).length,
    exams:exids.length,
    todos:S.todos.filter(td=>termDateIn(t,td.date)||termDateIn(t,td.due)).length,
    pun:lotPunLogs().filter(l=>termDateIn(t,l.time)).length,
    rdm:((S.redeem&&S.redeem.logs)||[]).filter(l=>termDateIn(t,l.time)).length
  };
}
/* 执行删除：行为先扣回积分再删；积分日志按 behId / examId / 时间三路清除；考试连同成绩删除 */
function termDelApply(t){
  const exids=new Set(S.exams.filter(x=>termDateIn(t,x.date)).map(x=>x.id));
  const behDel=S.behaviors.filter(b=>termDateIn(t,b.time)||exids.has(b.examId));
  const behIds=new Set(behDel.map(b=>b.id));
  behDel.forEach(b=>{const d=b.delta||0;if(d)S.points.scores[b.studentId]=(S.points.scores[b.studentId]||0)-d;});
  S.behaviors=S.behaviors.filter(b=>!behIds.has(b.id));
  S.points.logs=S.points.logs.filter(l=>!behIds.has(l.behId)&&!exids.has(l.examId)&&!termDateIn(t,l.time));
  S.exams=S.exams.filter(x=>!exids.has(x.id));
  S.todos=S.todos.filter(td=>!termDateIn(t,td.date)&&!termDateIn(t,td.due));
  if(S.lottery&&Array.isArray(S.lottery.punLogs))S.lottery.punLogs=S.lottery.punLogs.filter(l=>!termDateIn(t,l.time));
  if(S.redeem&&Array.isArray(S.redeem.logs))S.redeem.logs=S.redeem.logs.filter(l=>!termDateIn(t,l.time));
}
W.delTerm=id=>{
  const t=el(id,S.terms||[]);if(!t)return;
  const p=termDelPlan(t);
  const items=[["行为记录",p.beh],["积分日志",p.logs],["考试(含成绩)",p.exams],["事务",p.todos],["惩罚记录",p.pun],["兑换/消除记录",p.rdm]].filter(x=>x[1]>0);
  const detail=items.length?items.map(x=>x[0]+" "+x[1]+" 条").join("、"):"该时间范围内没有数据";
  if(!confirm(`删除学期「${t.name}」（${t.start||"—"} 至 ${t.end||"—"}）？\n范围内的数据将一起删除：${detail}。\n此操作不可恢复，确定删除？`))return;

/* ---- 排座 导入/导出（合一） ----
   导出网格：首行 R排,C列；每座三格 —— 「姓名(!)/区域/等级」（空座姓名位写 -，无等级写 -）；! 为固定座。
   网格后附学习组结构行（大组/学习组/第0排/合并），导入整体还原到具体学习组。
   导入自动识别：有 R,C 头 → 网格（座次+区域+等级+学习组，兼容旧两格/单格格式）；无头 → 按「姓名,等级」名单只导等级。 */
const csvField=v=>/[",\n]/.test(v)?'"'+String(v).replace(/"/g,'""')+'"':String(v);
const seatText=()=>{
  const cfg=S.seatCfg;
  const zones=S.seatZones||[],fixed=S.seatFixed||[],seating=S.seating||[];
  const nRows=cfg.rows+(cfg.row0?1:0);
  const lines=["R"+nRows+",C"+cfg.cols];
  for(let r=0;r<nRows;r++){
    const row=[];
    for(let c=0;c<cfg.cols;c++){
      const i=r*cfg.cols+c;
      const sid=seating[i];const st=sid?el(sid,S.students):null;
      const z=zones[i];const zs=(z&&/^[ABC]$/.test(z))?z:"-";
      const fx=fixed[i]?"!":"";
      if(st){
        const t=tierOf(st);
        row.push(csvField(st.name)+fx+","+zs+","+(/^[ABC]$/.test(t)?t:"-"));
      }else{
        row.push("-"+fx+","+zs+",-");
      }
    }
    lines.push(row.join(","));
  }
  const bg=Array.isArray(cfg.bigGroups)&&cfg.bigGroups.length?cfg.bigGroups:[cfg.cols];
  lines.push("大组:"+bg.join("-"));
  lines.push("学习组:"+(cfg.studyGroup||cfg.rows));
  lines.push("第0排:"+(cfg.row0?1:0));
  const ms=(Array.isArray(cfg.studyMerges)?cfg.studyMerges:[]).filter(m=>m&&Array.isArray(m.tags)&&m.tags.length>=2);
  if(ms.length)lines.push("合并:"+ms.map(m=>m.tags.join("+")+((m.name&&String(m.name).trim())?"="+String(m.name).trim():"")).join(";"));
  return lines.join("\n");
};

function splitCsvLine(line){
  const out=[];let cur="",q=false;
  for(let i=0;i<line.length;i++){const ch=line[i];
    if(q){if(ch==='"'){if(line[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
    else if(ch==='"')q=true;
    else if(ch===","){out.push(cur);cur="";}
    else cur+=ch;}
  out.push(cur);return out;
}
/* 解析排座导出文本：返回 null=非网格（调用方按等级名单处理）；{ok,msg}=结果（除写入 s.tier 外不改学生数据）
   按字段数自动识别三种行格式：
   三格制（当前版）：每座「姓名!/区域/等级」——有人座位也带区域，导入完整还原排位色；
   两格制（旧合并版）：每座「姓名!/等级」，有人座位区域沿用现有数据；
   单格制（更旧）：每格「区域」。行尾字段被 Excel 丢掉的文件走贪心解析。 */
function applySeatText(txt){
  /* 每行去掉首尾空白与**末尾冗余逗号**（WPS/Excel 另存会把所有行补齐到同一列数，给行尾垫一串逗号，
     否则「第0排:1,,,,…」这类结构行无法按值匹配）。网格行中间的逗号不受影响。 */
  const all=String(txt||"").replace(/^\ufeff/g,"").replace(/\u0000/g,"").trim().split(/\r?\n/).map(l=>l.trim().replace(/[,，]+$/,"")).filter(Boolean);
  const head=all.length?all[0].replace(/[\s,，、]/g,"").match(/^R(\d+)C(\d+)$/i):null;
  if(!head)return null;
  let rows=+head[1];const cols=+head[2];
  /* 结构行（大组/学习组/第0排/合并）无论混在哪个位置都先剔出网格区，避免行错位把结构行当姓名 */
  const isStruct=L=>/^(?:大组|学习组|第0排|合并)\s*[:：]/.test(L);
  const lines=[all[0]].concat(all.slice(1).filter(L=>!isStruct(L)));
  const structLines=all.slice(1).filter(L=>isStruct(L));
  let rowNote="";
  if(cols<1||cols>12)return {ok:false,msg:"列数超出范围（C"+cols+"）"};
  const dataRows=lines.length-1;
  if(dataRows!==rows){
    if(dataRows<rows)rowNote="（文件声明 "+rows+" 排，实际网格 "+dataRows+" 排，缺的排按空位导入）";
    else rowNote="（文件声明 "+rows+" 排，实际网格 "+dataRows+" 排，已按实际排数导入）";
    rows=dataRows;
  }
  if(rows<1||rows>12)return {ok:false,msg:"排数超出范围（R"+rows+"）"};
  /* 第0排：文件结构行「第0排:1/0」显式声明优先；未声明时按行数推断（比当前排数多一行 → 视为含第0排） */
  const r0Lines=structLines.filter(L=>/^第0排\s*[:：]/.test(L));
  let r0;
  if(r0Lines.length){
    /* 容错全角数字/空格：如「第0排：１」 */
    const v=r0Lines[r0Lines.length-1].replace(/[０-９]/g,d=>String.fromCharCode(d.charCodeAt(0)-65296));
    r0=/:\s*1\s*$/.test(v);
  }
  else if(rows===S.seatCfg.rows+1)r0=true;
  else r0=false;
  if(r0&&rows<2)return {ok:false,msg:"排数无效（含第0排至少需 2 排）"};
  S.seatCfg.rows=r0?rows-1:rows;S.seatCfg.cols=cols;S.seatCfg.row0=r0;
  const total=rows*cols;
  const zones=new Array(total).fill(undefined),fixed=new Array(total).fill(false);
  const seat=new Array(total).fill(null);
  let seated=0,tierSet=0,missName=0;
  const missList=[];
  const place=(i,s)=>{for(let j=0;j<total;j++)if(seat[j]===s.id)seat[j]=null;seat[i]=s.id;};
  /* 姓名匹配去空白（含全角空格），容忍名册里带首尾空格的名字 */
  const norm=s=>String(s||"").replace(/[\s\u3000]+/g,"");
  const byName={};S.students.forEach(s=>{const k=norm(s.name);if(k&&!(k in byName))byName[k]=s;});
  const isZoneTok=t=>!t||t==="-"||/^[ABC]!?$/.test(t.toUpperCase());
  for(let r=0;r<rows;r++){
    const f=splitCsvLine(lines[r+1]).map(x=>x.trim());
    const m3=f.length===cols*3,m2=!m3&&f.length===cols*2;
    if(!m3&&!m2&&f.length<cols)return {ok:false,msg:"第 "+(r+1)+" 行列数不足"};
    let p=0;
    for(let c=0;c<cols;c++){
      const i=r*cols+c;
      let v1="",v2="",v3="";
      if(m3){v1=f[c*3]||"";v2=f[c*3+1]||"";v3=(f[c*3+2]||"").toUpperCase();}
      else if(m2){v1=f[c*2]||"";v2=(f[c*2+1]||"").toUpperCase();}
      else{
        /* 贪心：人名后紧跟的 A/B/C 视为其等级 */
        v1=f[p]||"";p++;
        if(!isZoneTok(v1)){
          const nx=(f[p]||"").toUpperCase();
          if(isZoneTok(nx)&&nx&&nx!=="-"){v2=nx;p++;}
        }
      }
      const fx=/!$/.test(v1)||/!$/.test(v2);
      const t1=v1.replace(/!+$/,""),t2=v2.replace(/!+$/,""),t3=v3.replace(/!+$/,"");
      const isName=t1&&t1!=="-"&&!/^[ABC]$/.test(t1.toUpperCase());
      if(isName){/* 有人格：座次 + 等级 */
        const s=byName[norm(t1)];
        if(s){
          place(i,s);seated++;
          const tier=[t3,t2].find(x=>/^[ABC]$/.test(x));
          if(tier){s.tier=tier;tierSet++;}
        }else{missName++;if(missList.length<5)missList.push(t1);}
      }
      /* 区域：三格制每座都带；两格制有人座不携带（undefined → 沿用现有）；单格/贪心写在首格 */
      if(m3)zones[i]=["A","B","C"].includes(t2)?t2:null;
      else if(m2)zones[i]=isName?undefined:(["A","B","C"].includes(t1)?t1:null);
      else zones[i]=["A","B","C"].includes(t1)?t1:null;
      fixed[i]=fx;
    }
  }
  /* 学习组结构行（可选，全部还原到具体学习组）；重复结构行以后者为准（第0排已在上方预扫描） */
  structLines.forEach(L=>{
    let m;
    if((m=L.match(/^大组[:：]\s*(.+)$/))){
      const arr=m[1].split(/[-,，\s]+/).map(x=>parseInt(x,10)).filter(x=>x>0);
      if(arr.length&&arr.reduce((a,b)=>a+b,0)===cols)S.seatCfg.bigGroups=arr;
    }else if((m=L.match(/^学习组[:：]\s*(\d+)$/))){
      S.seatCfg.studyGroup=Math.max(1,Math.min(S.seatCfg.rows,parseInt(m[1],10)||S.seatCfg.rows));
    }else if(/^第0排[:：]/.test(L)){
      /* 已在上方预扫描处理 */
    }else if((m=L.match(/^合并[:：]\s*(.+)$/))){
      const arr=[];
      m[1].split(/[;；]/).forEach(seg=>{
        seg=seg.trim();if(!seg)return;
        let name="";const mi=seg.search(/[=＝]/);
        if(mi>=0){name=seg.slice(mi+1).trim();seg=seg.slice(0,mi);}
        const tags=seg.split(/[+＋]/).map(x=>x.trim()).filter(Boolean);
        if(tags.length>=2)arr.push(name?{id:"m"+Date.now()+"_"+arr.length,tags,name}:{id:"m"+Date.now()+"_"+arr.length,tags});
      });
      S.seatCfg.studyMerges=arr;
    }
  });
  /* 列数变化时把大组列数缩放到新 cols（与 setSeatCfg('cols') 同规则；文件带了合法大组行则已按文件） */
  {const _bg=Array.isArray(S.seatCfg.bigGroups)&&S.seatCfg.bigGroups.length?S.seatCfg.bigGroups:[Math.min(3,cols)];
   const _used=_bg.reduce((a,b)=>a+b,0);
   if(_used>cols){let acc=0;S.seatCfg.bigGroups=_bg.map(x=>{const remain=cols-acc;const v=Math.min(x,Math.max(0,remain));acc+=v;return v;}).filter(x=>x>0);if(!S.seatCfg.bigGroups.length)S.seatCfg.bigGroups=[cols];}
   else if(_used<cols){_bg[_bg.length-1]=(_bg[_bg.length-1]||0)+(cols-_used);S.seatCfg.bigGroups=_bg;}}
  /* 未显式带区域的格子：尺寸一致时沿用现有区域，否则置空 */
  const oldZones=(Array.isArray(S.seatZones)&&S.seatZones.length===total)?S.seatZones:null;
  for(let i=0;i<total;i++){
    if(zones[i]===undefined)zones[i]=(oldZones&&seat[i])?(oldZones[i]||null):null;
  }
  /* 有人 → 座次按文件整表重建（文件里没有的学生不再就座）；纯区域网格 → 尺寸一致沿用原座次 */
  const hasAny=seat.some(Boolean);
  const keepSeating=!hasAny&&Array.isArray(S.seating)&&S.seating.length===total;
  S.seatZones=zones;S.seatFixed=fixed;
  S.seating=hasAny?seat:(keepSeating?S.seating:new Array(total).fill(null));
  W.syncStudyGroups();
  const missTxt=missName?("，"+missName+" 个姓名未匹配"+(missList.length?"："+missList.join("、")+(missName>missList.length?" 等":""):"")):"";
  const r0Txt=r0?"（含第0排）":"（不含第0排）";
  if(hasAny)return {ok:true,msg:"已导入座次+等级："+seated+" 人就座"+(tierSet?"，"+tierSet+" 人设等级":"")+r0Txt+rowNote+missTxt+(seated===0?"（请核对文件里姓名与名册是否一致，或页面是否为最新版本）":"")};
  return {ok:true,msg:"已导入座位区域（不含学生座次）"+r0Txt+rowNote+(keepSeating?"":"，尺寸变化原座位已清空")+missTxt+(missName?"（网格里没有匹配到的学生姓名）":"")};
}
/* 等级名单的独立导入/导出入口已并入 seatIO：导出=座次网格自带等级；导入自动识别无 R,C 头的「姓名,等级」名单 */
/* 解析「姓名,等级」文本并写入手动等级；返回 {done,miss}（纯函数） */
function applyTierText(txt){
  const lines=String(txt||"").replace(/^\ufeff/,"").replace(/\u0000/g,"").trim().split(/\r?\n/).map(l=>l.trim().replace(/[,，]+$/,"")).filter(Boolean);
  const norm=s=>String(s||"").replace(/[\s\u3000]+/g,"");
  let done=0,miss=0;
  lines.forEach(l=>{
    if(/^姓名\s*,/.test(l))return;
    const i=l.lastIndexOf(",");if(i<0){miss++;return;}
    const name=norm(l.slice(0,i)),t=l.slice(i+1).trim().toUpperCase();
    const s=S.students.find(x=>norm(x.name)===name);
    if(!s){miss++;return;}
    s.tier=["A","B","C"].includes(t)?t:"";done++;
  });
  return {done,miss};
}

/* ============ 拖动学习组名整体换座 ============ */
/* 拖起组名：携带该学习组（或合并段）的全部 (gi:s) 段；座位拖拽用 "text"=纯数字，组名用 "text"="SG:gi:s,..." 区分 */

};
/* 交换两个学习组区域内的全部成员：组名由位置推导（buildName），故组名原地不动，
   学生整体对调；两组人数/座位数不等时按行序循环错位，保证人人有座。 */
W.swapStudyGroups=(srcBands,dstBands)=>{
  ensureSeat();
  const key=b=>b.map(p=>p.join(":")).sort().join(",");
  if(key(srcBands)===key(dstBands))return;
  const cfg=S.seatCfg;
  const bigGroups=cfg.bigGroups;
  const sg=Math.max(1,Math.min(cfg.rows,cfg.studyGroup|0||cfg.rows));
  const colsOf=gi=>{let a=0;for(let k=0;k<gi;k++)a+=bigGroups[k];const out=[];for(let c=a+1;c<=a+bigGroups[gi];c++)out.push(c);return out;};
  const seatsOf=bands=>{
    const out=[];
    bands.forEach(p=>{
      const gi=p[0],s=p[1];
      const r1=s*sg+1,r2=Math.min((s+1)*sg,cfg.rows);
      for(let r=r1;r<=r2;r++){
        const idx=cfg.row0?r:r-1;/* 显示行 r → 座位数组行 idx（第0排占 idx=0） */
        colsOf(gi).forEach(c=>out.push(idx*cfg.cols+(c-1)));
      }
    });
    return out;
  };
  const A=seatsOf(srcBands),B=seatsOf(dstBands);
  if(!A.length||!B.length)return;
  if(A.some(i=>S.seatFixed[i])||B.some(i=>S.seatFixed[i])){toast("包含固定座位，不能整体换座");return;}
  const comb=A.map(i=>S.seating[i]).concat(B.map(i=>S.seating[i]));
  B.forEach((si,k)=>S.seating[si]=comb[k]);           /* 目标区 ← 源区成员 */
  A.forEach((si,k)=>S.seating[si]=comb[B.length+k]);  /* 源区 ← 目标区成员（不等长时循环错位） */
  W.syncStudyGroups();save();viewSeating(document.getElementById("view"));
};
W.autoSeat=mode=>{
  if(!S.students.length){toast("先添加学生");return;}
  ensureSeat();const n=(S.seatCfg.rows+(S.seatCfg.row0?1:0))*S.seatCfg.cols;
  const fixedIds=new Set();const freeSeats=[];
  for(let i=0;i<n;i++){if(S.seatFixed[i]){if(S.seating[i])fixedIds.add(S.seating[i]);}else freeSeats.push(i);}
  let arr=S.students.filter(s=>!fixedIds.has(s.id));
  /* 排序 */
  if(mode==="height")arr.sort((a,b)=>(b.height||0)-(a.height||0));
  else if(mode!=="random")arr.sort((a,b)=>(+a.no||0)-(+b.no||0));
  /* 性别感知：尽量同性别坐同一排；按行填座位，先把男/女分桶，按行优先填满同性 */
  const sexAware=S.seatCfg.sexAware;
  const cols=S.seatCfg.cols;
  const seating=new Array(n).fill(null);
  for(let i=0;i<n;i++){if(S.seatFixed[i])seating[i]=S.seating[i];}
  if(sexAware){
    /* 按排归类 free 座位 */
    const rows={};
    freeSeats.forEach(i=>{const r=Math.floor(i/cols);(rows[r]=rows[r]||[]).push(i);});
    const males=shuf(arr.filter(s=>s.sex==="男").map(s=>s.id));
    const females=shuf(arr.filter(s=>s.sex==="女").map(s=>s.id));
    const others=shuf(arr.filter(s=>s.sex!=="男"&&s.sex!=="女").map(s=>s.id));
    /* 大桶优先：先把男生排完各行，再排女生，最后其他 */
    const fillRow=row=>{const seats=row;let used=0;
      males.forEach(id=>{if(used>=seats.length)return;const idx=seats[used++];seating[idx]=id;});
      females.forEach(id=>{if(used>=seats.length)return;const idx=seats[used++];seating[idx]=id;});
      others.forEach(id=>{if(used>=seats.length)return;const idx=seats[used++];seating[idx]=id;});
      /* 收集剩下的 */
      const left=seats.slice(used);
      return left;
    };
    const rowKeys=Object.keys(rows).map(Number).sort((a,b)=>a-b);
    const leftSeats=[];
    rowKeys.forEach(r=>{leftSeats.push(...fillRow(rows[r]));});
    /* 若同性别填不满整行导致混合，剩下空位由剩余 males/females/others 任意填 */
    let p=0;
    const restArr=[...males,...females,...others].filter(id=>!seating.includes(id));
    leftSeats.forEach((idx,i)=>{if(i<restArr.length)seating[idx]=restArr[i];});
  } else {
    if(mode==="random")arr=shuf(arr);
    let p=0;freeSeats.forEach(idx=>{if(p<arr.length)seating[idx]=arr[p++].id;});
  }
  S.seating=seating;save();W.syncStudyGroups();save();viewSeating(document.getElementById("view"));
  toast(sexAware?(mode==="random"?"已随机排座（同性别优先同排，固定座未动）":mode==="height"?"已按身高排座（同性别优先同排，固定座未动）":"已按学号排座（同性别优先同排，固定座未动）"):(mode==="random"?"已随机排座（固定座未动）":mode==="height"?"已按身高排座（固定座未动）":"已按学号排座（固定座未动）"));
};

   w 参数："" = 每周（覆盖整格）；"o"/"e" = 只写单/双侧，另一侧原有课程保留。 */
function cellEntries(c){
  if(!c)return [];
  if(c.o||c.e){const a=[];if(c.o)a.push(["o",c.o]);if(c.e)a.push(["e",c.e]);return a;}
  return [["",c]];
}
function putCell(d,p,course,w){
  const key=d+"-"+p;
  if(!w){S.schedule.cells[key]=course;return;}
  const cur=S.schedule.cells[key];
  const split=cur&&(cur.o||cur.e);
  const o=w==="o"?course:(split?cur.o:null);
  const e=w==="e"?course:(split?cur.e:null);
  const nv={};if(o)nv.o=o;if(e)nv.e=e;
  if(nv.o||nv.e)S.schedule.cells[key]=nv;else delete S.schedule.cells[key];
}
/* 清除一格：w 为空删整格；w="o"/"e" 只删该侧（另一侧保留），两侧都空则删整格 */
function removeCell(d,p,w){
  const key=d+"-"+p,cur=S.schedule.cells[key];
  if(!cur)return;
  if(!w||!(cur.o||cur.e)){delete S.schedule.cells[key];return;}
  const nv={};if(w!=="o"&&cur.o)nv.o=cur.o;if(w!=="e"&&cur.e)nv.e=cur.e;
  if(nv.o||nv.e)S.schedule.cells[key]=nv;else delete S.schedule.cells[key];
}
const wName=w=>w==="o"?"单周":w==="e"?"双周":"每周";
/* 当前教学周：按学期设置的开始日期推算——学期开始所在的一周为第 1 周（单周），依次类推，第 2 周为双周…
   取「今天所在」的未归档学期（其次取开始日期不晚于今天的最近一个）。返回 {n,parity,name} 或 null（无法推算时不筛选）。 */
function schedWeek(){
  const t=todayStr();
  const terms=(S.terms||[]).filter(x=>x&&!x.archived&&x.start);
  if(!terms.length)return null;
  const term=terms.find(x=>x.start<=t&&(!x.end||x.end>=t))||terms.filter(x=>x.start<=t).sort((a,b)=>b.start.localeCompare(a.start))[0];
  if(!term)return null;
  const mon=s=>{const dt=new Date(s+"T00:00:00");dt.setDate(dt.getDate()-((dt.getDay()+6)%7));return dt;};
  const n=Math.floor((mon(t)-mon(term.start))/604800000)+1;
  if(n<1)return null;
  return {n,parity:n%2?"o":"e"};
}

/* 实际节次 = 已添加课程的最晚节次；没添加任何课程 = 8（默认），上限 12 */
function effectivePeriods(){
  let m=8;
  Object.keys(S.schedule.cells).forEach(k=>{const p=+k.split("-")[1];if(p>m)m=p;});
  return Math.min(12,Math.max(1,m));
}
/* ---- 课表：添加 / 导入 / 导出 ---- */
function dayKey(s){
  s=(s||"").trim();
  const m=s.match(/^[0-9]/);if(m)return /^[1-5]$/.test(s)?s:null;
  const map={"一":1,"二":2,"三":3,"四":4,"五":5};
  const c=s.replace(/^周/,"").replace(/^星期/,"")[0];
  return map[c]?String(map[c]):null;
}
/* 课表导出：星期,节次,上课时间,科目,班级,授课老师,联系方式,周次（早/晚自习的节次写作「早自习」「晚自习」；单双周分列格导出为两行） */
function schedText(){
  let t="星期,节次,上课时间,科目,班级,授课老师,联系方式,周次\n";
  const line=(d,pl,c,tm,w)=>{t+=[d,pl,tm,c.sub||"",c.cls||"",c.tch||"",c.tel||"",wName(w)].join(",")+"\n";};
  DAYS.forEach(d=>{
    const emit=(k,label,tm)=>{
      const c=S.schedule.cells[d[0]+"-"+k];if(!c)return;
      if(c.o||c.e){if(c.o)line(d[1],label,c.o,tm,"o");if(c.e)line(d[1],label,c.e,tm,"e");}
      else line(d[1],label,c,tm,"");
    };
    ["m","e1","e2","e3"].forEach(k=>emit(k,periodLabel(k),tRange((S.schedule.times||{})[k]||{})));
    for(let p=1;p<=effectivePeriods();p++)emit(p,p,tRange(S.schedule.times[p]));
  });
  return t;
}

/* 解析课表 CSV 文本并写入 S.schedule；返回 {n,bad,empty}（纯函数，便于复用与测试） */
function applySchedText(txt){
  const lines=String(txt||"").replace(/^\ufeff/,"").trim().split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(!lines.length)return {n:0,bad:0,empty:true};
  let n=0,bad=0;
  lines.forEach(l=>{
    if(/^星期\s*,/.test(l))return;
    const c=l.split(/[,，]/).map(x=>x.trim());
    const d=dayKey(c[0]);
    /* 节次：数字 1..12；早自习→m；晚自习一/二/三→e1/e2/e3（兼容旧「晚自习」→e1） */
    let p=c[1];
    if(/^早/.test(p))p="m";
    else if(/^晚自习一/.test(p))p="e1";
    else if(/^晚自习二/.test(p))p="e2";
    else if(/^晚自习三/.test(p))p="e3";
    else if(/^晚/.test(p))p="e1";
    else p=parseInt(p,10);
    if(!d||(typeof p==="number"&&(!p||p<1||p>12))){bad++;return;}
    /* 新格式含「上课时间」列（第3列）：一行有 ≥4 列时科目在第4列(c[3])、时间在第3列(c[2])；
       旧格式（3 列）科目在第3列(c[2])。空时间列也按新格式处理，避免把空时间当成科目而丢行。 */
    let tm="",sub="";
    if(c.length>=4){tm=c[2]||"";sub=c[3];}
    else{sub=c[2];}
    if(!sub){bad++;return;}
    /* 周次（第8列，可选）：单周→o / 双周→e / 空·每周→整格覆盖 */
    const wRaw=c[7]||"";
    const w=wRaw==="单周"?"o":wRaw==="双周"?"e":"";
    putCell(d,p,{sub,cls:c[4]||"",tch:c[5]||"",tel:c[6]||""},w);
    if(tm){const x=tm.split(/\s*[-–~至]\s*/);setPeriodTime(p,{s:x[0]||"",e:x[1]||""});}
    n++;
  });
  return {n,bad};
}

/* 读取 <input type=file> 选中的文本文件（UTF-8），回调 cb(text, errMsg) */
function readTextFile(inputId,cb){
  const inp=document.getElementById(inputId);
  const f=inp&&inp.files&&inp.files[0];
  if(!f){cb(null,"请选择文件");return;}

/* 读取 File 为文本：读原始字节探测 BOM —— UTF-8 / UTF-16LE(记事本"Unicode") / UTF-16BE 都能正确解码；
   无 BOM 且按 UTF-8 读出替换符（U+FFFD）说明多半是 Excel 另存的 ANSI/GBK，自动改按 GBK 重读 */
function readFileAsText(f,cb){
  const rd=new FileReader();
  rd.onload=()=>{
    const buf=rd.result;
    try{
      const u8=new Uint8Array(buf);
      if(u8.length>=2&&u8[0]===0xFF&&u8[1]===0xFE){cb(new TextDecoder("utf-16le").decode(buf),null);return;}
      if(u8.length>=2&&u8[0]===0xFE&&u8[1]===0xFF){cb(new TextDecoder("utf-16be").decode(buf),null);return;}
      const t=new TextDecoder("utf-8").decode(buf);
      if(t.indexOf("\uFFFD")>=0){
        try{cb(new TextDecoder("gbk").decode(buf),null);}catch(e){cb(t,null);}
        return;
      }
      cb(t,null);
    }catch(e){cb(null,"文件读取失败");}
  };
  rd.onerror=()=>cb(null,"文件读取失败");
  rd.readAsArrayBuffer(f);
}
/* 点击即弹出系统文件选择窗口（无需先开弹窗）：accept 形如 ".csv,text/csv"；选中后回调 cb(file) */

/* 解析成绩 CSV 文本并写入考试 ex；返回 {ok,msg,n,miss,subs,cnt}（纯函数）。
   表头按列名定位（兼容列顺序变化与中间空列）；「总分/平均/排名」等汇总列自动跳过，
   使本应用导出的成绩 CSV 可直接回导而不产生假科目。 */
function applyGradeText(ex,text){
  if(!ex)return {ok:false,msg:"考试不存在"};
  const lines=String(text||"").replace(/^\ufeff/,"").trim().split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(lines.length<2)return {ok:false,msg:"至少需要表头和一行数据"};
  const head=lines[0].split(/[,，]/).map(x=>x.trim());
  const SKIP={"总分":1,"平均":1,"平均分":1,"排名":1,"名次":1};
  const cols=[];
  head.forEach((h,i)=>{if(i>0&&h&&!SKIP[h])cols.push([h,i]);});
  if(!cols.length)return {ok:false,msg:"表头缺少科目"};
  cols.forEach(([s])=>{if(!ex.subjects.includes(s))ex.subjects.push(s);});
  let n=0,miss=0;
  for(let i=1;i<lines.length;i++){
    const c=lines[i].split(/[,，]/).map(x=>x.trim());
    const st=S.students.find(s=>s.name===c[0]);
    if(!st){miss++;continue;}
    if(!ex.scores[st.id])ex.scores[st.id]={};
    cols.forEach(([sub,idx])=>{const v=c[idx];if(v!==""&&v!==undefined)ex.scores[st.id][sub]=v;});
    n++;
  }
  const cnt=applyGradeRules(ex);/* 按成绩规则自动录入加减分记录（幂等，重复导入会覆盖） */
  return {ok:true,n,miss,subs:cols.length,cnt};
}

/* ============ 云端同步（程序公开 / 数据私有） ============
   程序（本文件）放公开仓库，供 GitHub Pages 免费托管、手机 Safari 直接打开；
   真实数据只写进你自己的「私有」仓库，令牌仅授权那一个仓库，别人看不到任何班级资料。
   冲突策略：整份数据按 _savedAt 时间戳「后保存的为准」（单人多设备错峰使用足够）。 */
const CLOUD_KEY="tw_cloud";
const GH_API="https://api.github.com";
let cloudBusy=false,cloudTimer=null,cloudReady=false;
/* 冲突判断基线说明：判断「本地数据新还是云端新」绝不能用 S._savedAt——
   任何一次本地 save()（含启动渲染、误触、离线编辑）都会把它刷成当前时间，
   旧设备的本地数据就会误判为「更新」而上传覆盖云端，另一台设备的新改动丢失。
   改用 cfg.baseAt：记录本设备数据所基于的云端版本号，只随成功的云端拉取/上传更新，
   本地 save() 永远碰不到它。baseAt < 云端 _savedAt ⇒ 云端有本机没见过的更新 ⇒ 采用云端。 */

function cloudCfg(){try{return JSON.parse(localStorage.getItem(CLOUD_KEY))||{};}catch(e){return {};}}
function cloudCfgSave(o){localStorage.setItem(CLOUD_KEY,JSON.stringify(o));}
function cloudCfgSet(k,v){
  const c=cloudCfg();
  if(k==="enabled")c.enabled=!!v;else c[k]=(v||"").trim();
  cloudCfgSave(c);
  if(k==="enabled"&&c.enabled)bootCloudSync();
}
function cloudReadyEnough(c){return !!(c&&c.enabled&&c.token&&c.owner&&c.repo);}
function cEnc(s){return encodeURIComponent(s);}
function cB64(s){const b=new TextEncoder().encode(s);let t="";for(const x of b)t+=String.fromCharCode(x);return btoa(t);}
function cUnB64(s){const bin=atob(s);const b=Uint8Array.from(bin,c=>c.charCodeAt(0));return new TextDecoder().decode(b);}
function ghUrl(c){const segs=(c.path||"data.json").split("/").map(cEnc).join("/");return GH_API+"/repos/"+cEnc(c.owner)+"/"+cEnc(c.repo)+"/contents/"+segs+"?ref="+cEnc(c.branch||"main");}
function ghHeaders(c){return {"Accept":"application/vnd.github+json","Authorization":"Bearer "+c.token,"Content-Type":"application/json","X-GitHub-Api-Version":"2022-11-28"};}
function ghFetch(url,opts,ms){
  const ctl=(typeof AbortController!=="undefined")?new AbortController():null;
  const t=ctl?setTimeout(()=>ctl.abort(),ms||12000):null;
  const o=Object.assign({},opts||{});if(ctl)o.signal=ctl.signal;
  return fetch(url,o).finally(()=>{if(t)clearTimeout(t);});
}
function cloudErr(e){return ((e&&e.name==="AbortError")||/abort/i.test((e&&e.message)||""))?"请求超时（网络慢或无连接），请重试":((e&&e.message)||"网络错误");}
function cloudStatus(st,msg){const el=document.getElementById("cloud_st");if(!el)return;el.textContent=msg||"";el.style.color=st==="ok"?"#2e7d32":st==="err"?"#c0392b":"var(--ink-2)";}

async function cloudPullRemote(c){
  const r=await ghFetch(ghUrl(c),{method:"GET",headers:ghHeaders(c)},12000);
  if(r.status===404)return {empty:true,sha:null};
  if(r.status===401)throw new Error("令牌无效或已过期");
  if(!r.ok)throw new Error("HTTP "+r.status);
  const j=await r.json();
  let data=null;
  try{data=JSON.parse(cUnB64((j.content||"").replace(/\s/g,"")));}
  catch(e){throw new Error("云端文件不是有效数据");}
  return {empty:false,sha:j.sha,data:data};
}
async function cloudPushNow(){
  const c=cloudCfg();
  if(!cloudReadyEnough(c))return false;
  if(S._demo){cloudStatus("ok","本地是示例数据，未上传");return false;}
  if(cloudBusy)return false;
  cloudBusy=true;cloudStatus("","同步中…");
  try{
    const r=await cloudPullRemote(c);
    /* 冲突防护：云端存在本机没见过的更新（如电脑端刚保存的新数据）→ 不上传，改采用云端，
       本机数据先备份到 KEY_bak，避免旧数据覆盖新数据 */
    const remoteAt=(r.data&&r.data._savedAt)||0;
    if(!r.empty&&remoteAt>(c.baseAt||0)){
      cloudStatus("","云端有更新，采用云端…");
      await adoptRemoteData(r);
      return "adopted";
    }
    S._savedAt=Date.now();
    localStorage.setItem(KEY,JSON.stringify(S));
    const body=JSON.stringify({message:"sync "+new Date().toISOString(),content:cB64(JSON.stringify(S)),branch:c.branch||"main",sha:r.sha||undefined});
    const up=await ghFetch(ghUrl(c),{method:"PUT",headers:ghHeaders(c),body:body},25000);
    if(up.status===401)throw new Error("令牌无效或已过期");
    if(up.status===403)throw new Error("令牌权限不足（需 Contents 读写）");
    if(up.status===409)throw new Error("写入冲突，请重试");
    if(!up.ok)throw new Error("HTTP "+up.status);
    const cfg=cloudCfg();cfg.lastSync=Date.now();cfg.baseAt=S._savedAt;cloudCfgSave(cfg);
    cloudStatus("ok","已同步 "+new Date().toLocaleTimeString());
    cloudReady=true;
    return true;
  }catch(e){cloudStatus("err","同步失败："+cloudErr(e));return false;}
  finally{cloudBusy=false;}
}
function schedulePush(){
  const c=cloudCfg();
  if(!cloudReadyEnough(c)||!cloudReady)return;
  if(cloudTimer)clearTimeout(cloudTimer);
  cloudTimer=setTimeout(()=>{cloudTimer=null;cloudPushNow();},700);
}
async function adoptRemoteData(r){
  const hasLocal=!!localStorage.getItem(KEY);
  if(hasLocal&&!S._demo){try{localStorage.setItem(KEY+"_bak",JSON.stringify(S));}catch(e){}}
  S=Object.assign(def(),r.data);
  fixGradeReason();/* 云端数据可能含旧格式事由 */
  fixExamRecordTime();/* 云端数据可能含旧格式时间 */
  localStorage.setItem(KEY,JSON.stringify(S));
  const cfg=cloudCfg();cfg.lastSync=Date.now();cfg.baseAt=(r.data&&r.data._savedAt)||0;cloudCfgSave(cfg);
  cloudReady=true;cloudStatus("ok","已从云端载入");route();
}
let bootRetryT=null;
async function bootCloudSync(){
  const c=cloudCfg();
  if(!cloudReadyEnough(c)){cloudReady=true;return;}
  cloudReady=false;cloudStatus("","连接云端…");
  if(bootRetryT){clearTimeout(bootRetryT);bootRetryT=null;}
  try{
    const r=await cloudPullRemote(c);
    if(r.empty){
      cloudReady=true;
      if(!!localStorage.getItem(KEY)&&!S._demo){cloudStatus("","首次上传…");await cloudPushNow();}
      else cloudStatus("ok","已连接（云端暂无数据）");
      return;
    }
    const remoteAt=(r.data&&r.data._savedAt)||0;
    /* 本地为空 / 是示例数据 / 云端比本地基线新 → 采用云端；否则上传本地。
       新旧判断用 cfg.baseAt（上次成功同步的云端版本），不用会被本地 save 刷新的 S._savedAt */
    if(!localStorage.getItem(KEY)||S._demo||remoteAt>(c.baseAt||0)){
      await adoptRemoteData(r);return;
    }
    if(remoteAt<(c.baseAt||0)){const cfg=cloudCfg();cfg.baseAt=remoteAt;cloudCfgSave(cfg);}
    cloudReady=true;cloudStatus("","上传本地…");await cloudPushNow();
  }catch(e){
    cloudStatus("err","连接失败："+cloudErr(e));
    /* 拉取失败时保持 cloudReady=false：本地改动只留在本地，绝不盲目上传覆盖云端；
       20 秒后自动重试，也可在数据页手动「立即同步」 */
    if(!bootRetryT)bootRetryT=setTimeout(()=>{bootRetryT=null;bootCloudSync();},20000);
  }
}
async function cloudSyncNow(){
  await bootCloudSync();
  const el=document.getElementById("cloud_st");
  const t=el?el.textContent:"";
  toast(t.indexOf("失败")>=0?"同步失败，请看状态提示":"已同步");
}
/* 运行期周期拉取：已启用同步且连上云端后，每 30 秒静默检查云端有无本机未见的更新（remoteAt>baseAt）。
   有则采用云端刷新；若本机恰有未上传改动（本地 _savedAt 比 baseAt 新），先 cloudPushNow（其内再判冲突），
   避免「后保存为准」下盲目覆盖本地未保存改动。用户正在编辑弹窗（#mask.show）时跳过本次。 */
async function cloudPoll(){
  const c=cloudCfg();
  if(!cloudReadyEnough(c)||!cloudReady||cloudBusy)return;
  const mask=document.getElementById("mask");
  if(mask&&mask.classList.contains("show"))return;/* 用户正在编辑，稍后同步 */
  cloudBusy=true;
  try{
    const r=await cloudPullRemote(c);
    if(r.empty)return;
    const remoteAt=(r.data&&r.data._savedAt)||0;
    if(remoteAt>(c.baseAt||0)){
      if((S._savedAt||0)>(c.baseAt||0)){
        await cloudPushNow();/* 本机有未上传改动：先尝试上传（云端仍新则该函会采用云端） */
      }else{
        await adoptRemoteData(r);
        toast("已从云端同步其他设备的更新");
      }
    }
  }catch(e){/* 轮询静默：不刷状态、不打扰 */}
  finally{cloudBusy=false;}
}
async function cloudTest(){
  const c=cloudCfg();
  if(!c.token||!c.owner||!c.repo){cloudStatus("err","请先填 Token、用户名、仓库名");return;}
  cloudStatus("","测试中…");
  try{
    const r=await ghFetch(GH_API+"/repos/"+cEnc(c.owner)+"/"+cEnc(c.repo),{headers:ghHeaders(c)},10000);
    if(r.ok)cloudStatus("ok","连接成功：仓库可访问");
    else if(r.status===401)throw new Error("令牌无效");
    else if(r.status===404)throw new Error("仓库不存在，或令牌没授权这个仓库");
    else throw new Error("HTTP "+r.status);
  }catch(e){cloudStatus("err","连接失败："+cloudErr(e));}
}
function cloudDisconnect(){
  localStorage.removeItem(CLOUD_KEY);cloudReady=false;
  openModal(dataModalHtml());toast("已断开云端同步");
}

W.importAll=()=>{
  openModal(`<h3>全部导入</h3>
    <div class="tiny muted" style="margin-bottom:10px">选择之前「全部导出」的 JSON 文件。导入将<b>覆盖当前全部数据</b>（名册、成绩、行为、积分、兑换、抽签、事务等）。</div>
    <div class="field"><label class="lbl">选择 JSON 文件</label><input type="file" id="m_allf" accept=".json,application/json" class="fld"></div>
    <div class="foot"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn danger" onclick="W.doImportAll()">覆盖导入</button></div>`);
};
W.doImportAll=()=>{
  const f=$("#m_allf").files[0];if(!f){toast("请选择文件");return;}
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const obj=JSON.parse(rd.result);
      if(!obj||typeof obj!=="object"||Array.isArray(obj)){toast("文件格式不正确");return;}
      S=Object.assign(def(),obj);
      if(!S.mig)S.mig={};
      save();closeModal();route();toast("已导入全部数据");
    }catch(e){toast("解析失败：文件不是有效 JSON");}
  };
  rd.readAsText(f);
};

/* ============ init ============ */
function applyTheme(){document.documentElement.setAttribute("data-theme",S.theme);$("#themeBtn").textContent=S.theme==="dark"?"☀️":"🌙";$("#themeTx").textContent=S.theme==="dark"?"浅色":"深色";}
function toggleTheme(){S.theme=S.theme==="dark"?"light":"dark";save();applyTheme();}
/* 迁移：旧版兑换直接扣了 S.points.scores 并写了一条负积分日志（带 rdmId）。
   新模型「积分」不可被兑换改动，故这里把旧兑换的消耗还给积分，并清掉那些负日志，
   兑换消耗改由 S.redeem.logs 统计为「可兑换积分」。一次执行。 */
function migrateRedeemV2(){
  if(!S.mig)S.mig={};
  if(S.mig.redeemV2)return;
  const R=ensureRedeem();
  let changed=false;
  if(R.logs&&R.logs.length){
    const spent={};
    R.logs.forEach(l=>{const c=(l.type==='eliminate'?((+l.qty||0)?(+l.cost||0)*(+l.qty||1):(+l.cost||0)):(+l.cost||0)*(+l.qty||1));if(c)spent[l.studentId]=(spent[l.studentId]||0)+c;});
    Object.keys(spent).forEach(sid=>{S.points.scores[sid]=(S.points.scores[sid]||0)+spent[sid];changed=true;});
    const before=(S.points.logs||[]).length;
    S.points.logs=(S.points.logs||[]).filter(l=>!l.rdmId);
    if((S.points.logs||[]).length!==before)changed=true;
  }
  S.mig.redeemV2=true;
  if(changed)save();
}
/* 迁移 V3：新模型把「消除扣分」从「消耗可兑换」改为「恢复可兑换」。
   旧模型迁移时曾把消除额度一并加回积分（消除本不动积分），这里对已迁移过的数据
   把那部分消除额度扣回，使积分回到原始行为分；新数据（未跑过 V2）不受影响。 */
function migrateRedeemV3(){
  if(!S.mig)S.mig={};
  if(S.mig.redeemV3)return;
  if(S.mig.redeemV2){
    const R=ensureRedeem();const el={};
    (R.logs||[]).forEach(l=>{ if(l.type==='eliminate'){ const c=((+l.qty||0)?(+l.cost||0)*(+l.qty||1):(+l.cost||0)); if(c)el[l.studentId]=(el[l.studentId]||0)+c; }});
    Object.keys(el).forEach(sid=>{ S.points.scores[sid]=(S.points.scores[sid]||0)-el[sid]; });
    save();
  }
  S.mig.redeemV3=true;
}
/* 一次性迁移：自动记分的事由里不再重复写分值（分值由标签/积分明细自身显示）。
   移除各科明细末尾的 " +N" / " -N"，并清理多余空格。 */
function fixGradeReason(){
  const re=/(^|[；\s])[+-]\d+/g;
  let dirty=false;
  S.behaviors.forEach(b=>{
    if(b.auto===GRADE_TYPE&&b.reason){
      const nv=b.reason.replace(/ ?[+-]\d+(?=$|；)/g,"");
      if(nv!==b.reason){b.reason=nv;dirty=true;}
    }
  });
  (S.points.logs||[]).forEach(l=>{
    if(l.auto===GRADE_TYPE&&l.reason){
      const nv=l.reason.replace(/ ?[+-]\d+(?=$|；)/g,"");
      if(nv!==l.reason){l.reason=nv;dirty=true;}
    }
  });
  if(dirty)save();
}
/* 一次性迁移：成绩规则自动记分的时间应为考试日期；只改时间不一致的记录，不动积分 */
function fixExamRecordTime(){
  let dirty=false;
  S.exams.forEach(ex=>{
    if(!ex.date)return;
    S.behaviors.forEach(b=>{
      if(b.auto===GRADE_TYPE&&b.examId===ex.id&&(b.time||"").slice(0,10)!==ex.date){b.time=ex.date;dirty=true;}
    });
    (S.points.logs||[]).forEach(l=>{
      if(l.auto===GRADE_TYPE&&l.examId===ex.id&&(l.time||"").slice(0,10)!==ex.date){l.time=ex.date;dirty=true;}
    });
  });
  if(dirty)save();
}
/* 一次性迁移：成绩范围默认值由「最近1次」改为「全部考试」；仅当仍为旧默认 1 时翻转，显式选过 2/3/all 的不动 */
function migrateGradeRangeDefault(){
  if(S.tierCfg&&S.tierCfg.gradeRange===1&&!S._gradeRangeMigrated){
    S.tierCfg.gradeRange="all";
    S._gradeRangeMigrated=true;
    save();
  }
}
function init(){
  /* 不再自动灌示例数据：空数据保持空白，需要示例时在「数据」页手动点「示例」 */
  migrateRedeemV2();
  migrateRedeemV3();
  fixGradeReason();/* 自动记分事由不再重复分值 */
  fixExamRecordTime();/* 成绩自动记分时间 = 考试日期：仅修正时间不一致的旧记录（幂等） */
  migrateGradeRangeDefault();/* 成绩范围默认值：最近1次 → 全部考试 */
  buildNav();applyTheme();
  runJobAuto();/* 班级工作：周期末自动计入职务加分（幂等，不立即算分） */
  setInterval(()=>{runJobAuto();},60000);/* 页面开着时每 60 秒检查，命中周期末即自动记 */
  $("#themeBtn").onclick=toggleTheme;
  $("#moreBtn")&&($("#moreBtn").onclick=e=>{e.preventDefault();$("#moreDrawer").classList.toggle("show");});
  $("#moreDrawer").onclick=e=>{if(e.target.id==="moreDrawer")$("#moreDrawer").classList.remove("show");};
  $("#mask").onclick=e=>{if(e.target.id==="mask")closeModal();};
  document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});
  /* 切后台/锁屏/关页前，把防抖中尚未上传的改动立即推上云端，避免「改完马上关页」丢同步 */
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"&&cloudTimer){clearTimeout(cloudTimer);cloudTimer=null;cloudPushNow();}});
  window.addEventListener("hashchange",route);
  /* 每次打开默认进入首页：清掉浏览器残留的 hash（replaceState 不产生历史记录、不触发多余渲染） */
  if(location.hash&&location.hash!=="#home")history.replaceState(null,"",location.pathname+location.search+"#home");
  route();
  bootCloudSync();/* 已启用云端同步时，启动即拉取云端最新数据 */
  setInterval(cloudPoll,30000);/* 页面开着时每 30 秒静默拉取云端，发现其他设备更新即采用 */
}
init();
