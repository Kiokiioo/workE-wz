<style>
:root{
  --bg:#f5f7fb; --surface:#ffffff; --surface-2:#f0f3f9; --text:#1f2733; --text-2:#5b6675; --text-3:#6f7989;
  --border:#e3e8f0; --primary:#4f6bed; --primary-soft:#eef1fe; --primary-text:#ffffff;
  --ok:#1faa6b; --warn:#e8a33d; --danger:#e0533d; --shadow:0 2px 10px rgba(31,39,51,.06),0 1px 3px rgba(31,39,51,.05);
  --radius:14px; --radius-sm:10px; --gap:16px; --maxw:1280px;
  --chip:#eef1fe;
}
html[data-theme="dark"]{
  --bg:#14171d; --surface:#1d2129; --surface-2:#262b35; --text:#e7ebf2; --text-2:#9aa6b6; --text-3:#aab4c4;
  --border:#2e3440; --primary:#6b82f5; --primary-soft:#222838; --primary-text:#fff;
  --ok:#34c98a; --warn:#f0b65a; --danger:#f0785f; --shadow:0 2px 12px rgba(0,0,0,.35);
  --chip:#222838;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
@media(display-mode:standalone){body{padding-top:env(safe-area-inset-top)}}
button{font-family:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}

/* ===== top nav ===== */
.topbar{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--border)}
.topbar-inner{max-width:var(--maxw);width:100%;min-width:0;margin:0 auto;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:0 18px;height:58px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;white-space:nowrap;padding-right:8px}
.brand .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--primary),#8a5cf6);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px}
.nav-scroll{display:flex;align-items:center;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
.nav-scroll::-webkit-scrollbar{display:none}
.nav-link{padding:8px 13px;border-radius:9px;color:var(--text-2);white-space:nowrap;font-size:14px;
  display:flex;align-items:center;gap:4px;transition:.15s}
.nav-link:hover{background:var(--surface-2);color:var(--text)}
.nav-link.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
.top-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface);
  color:var(--text);display:flex;align-items:center;justify-content:center;font-size:17px}
.icon-btn:hover{background:var(--surface-2)}
.home-add-btn{margin-left:auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--primary);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent;transition:background .12s ease,transform .08s ease}
.home-add-btn:hover{background:var(--primary-soft)}
.home-add-btn:active{transform:scale(.92)}
.home-add-btn.solid,.home-add-btn.solid:hover{background:var(--primary);border-color:var(--primary);color:#fff}
.home-add-btn.solid:hover{filter:brightness(.96)}
.hamburger{display:none}
/* ===== 手机版底部导航（≤767px 才显示；桌面隐藏） ===== */
.bottom-nav{display:none;position:fixed;left:0;right:0;bottom:0;height:83px;z-index:45;background:var(--surface);align-items:center;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom)}
.bottom-nav .bn-item{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text-2);font-size:9px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;text-decoration:none}
.bottom-nav .bn-item .bn-ic{width:26px;height:26px;display:flex;align-items:center;justify-content:center}
.bottom-nav .bn-item.bn-sz-24 .bn-ic{width:24px;height:24px}
.bottom-nav .bn-item.active{color:var(--primary);font-weight:600}
.bottom-nav .bn-item.active .bn-ic{filter:drop-shadow(0 1px 2px rgba(79,107,237,.3))}
/* 教学 hub：分段控件（学情跟进同款位置关系 — 白底胶囊 + tab 占满 + 滑动蓝 thumb 覆盖整段 active） */
.teach-hub .teach-hub-tabs{position:relative;display:flex;align-items:center;padding:4px;background:#fff;border-radius:99px;gap:2px;width:fit-content;max-width:100%;flex-wrap:wrap;box-shadow:0 4px 14px rgba(15,20,30,.07);margin:0 auto 16px}
.teach-hub .teach-hub-tabs .tab{position:relative;z-index:1;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;border-radius:99px;background:transparent;color:var(--text-2);font-size:13px;flex:1 1 auto;text-align:center;min-width:56px;padding:9px 14px;cursor:pointer;transition:color .2s ease;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.teach-hub .teach-hub-tabs .tab .ic{display:flex;align-items:center;justify-content:center;height:24px;line-height:1;color:inherit}
.teach-hub .teach-hub-tabs .tab .ic svg{width:24px;height:24px;display:block}
.teach-hub .teach-hub-tabs .tab .nm{display:block;font-size:9px;line-height:1.2;letter-spacing:0;color:inherit;white-space:nowrap;text-align:center}
.teach-hub .teach-hub-tabs .tab.active{color:#fff}
.teach-hub .teach-hub-tabs .tab.active .nm{color:#fff}
.teach-hub .teach-hub-tabs .tab:not(.active) .ic{color:var(--text-2)}
/* 教学 hub 多页容器：桌面单页切换（display 控制），手机版并排横滑（transform 控制） */
.teach-pages{display:block}
.teach-pages .tp{display:none}
.teach-pages .tp.active{display:block}
.teach-hub .teach-hub-tabs .tab-thumb{position:absolute;z-index:0;top:4px;bottom:4px;left:0;border-radius:99px;background:var(--primary);box-shadow:0 2px 8px rgba(79,107,237,.28);transform:translateX(0);width:0;transition:transform .26s cubic-bezier(.4,0,.2,1),width .26s cubic-bezier(.4,0,.2,1)}

/* 每周复盘-卡片标签圆点（2026-08-30：取代 emoji ✅🚧🔧⭐，按主题色给 4 个色圆点）
   注意：4 个变体类名（dot-ok/dot-warn/dot-pri/dot-gold）避开全局 .pri 等已存在的类 */
.rdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle;flex:none}
.rdot.dot-ok{background:var(--ok)}
.rdot.dot-warn{background:var(--warn)}
.rdot.dot-pri{background:var(--primary)}
.rdot.dot-gold{background:#f5b942}
.drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:none}
.drawer-backdrop.show{display:block}
.drawer{position:fixed;top:0;left:0;bottom:0;width:260px;background:var(--surface);z-index:51;
  transform:translateX(-100%);transition:.22s;padding:18px;overflow-y:auto;border-right:1px solid var(--border)}
.drawer.show{transform:translateX(0)}
.drawer .brand{margin-bottom:14px}
.drawer-link{display:flex;align-items:center;gap:4px;padding:12px 12px;border-radius:10px;color:var(--text-2);
  margin-bottom:4px;font-size:15px}
.drawer-link.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
.drawer-link .ic{font-size:18px;width:22px;text-align:center}

/* ===== layout ===== */
.wrap{max-width:var(--maxw);margin:0 auto;padding:22px 18px 60px}
.page-head{margin-bottom:18px}
.page-head h1{font-size:23px;margin:0 0 4px}
.page-head p{margin:0;color:var(--text-2);font-size:14px}
.section-title{font-size:15px;font-weight:700;margin:0 0 10px;display:flex;align-items:center;gap:8px;min-height:0}
/* 成绩分析页：所有标题与图标的间距统一为 4px（覆盖默认 gap:8px，不影响其他视图） */
#grade_body .section-title,#grade_row2 .section-title{gap:4px}
#hist_grades>.section-title,#hist_courses>.section-title,#hist_classes>.section-title{margin-bottom:0}
#hist_grades.open>.section-title,#hist_courses.open>.section-title,#hist_classes.open>.section-title{margin-bottom:16px}
.section-title .count{color:var(--text-2);font-weight:500;font-size:13px}

/* ===== cards / grid ===== */
.grid{display:grid;gap:var(--gap)}
.notes-grid{column-gap:12px}
/* 备课笔记卡片操作键常驻可见（避免被 .row-actions 默认 opacity:0 隐藏） */
.notes-grid .card .row-actions{opacity:1}
.stu-grid{column-gap:12px}
.stu-idx{margin-bottom:4px}
.stu-idx-h{font-size:12px;font-weight:600;color:var(--text-2);padding:2px 4px 2px 8px;margin-bottom:4px;position:sticky;top:0;z-index:1}
.review-grid{column-gap:12px}
.cols-2{grid-template-columns:repeat(2,1fr)}
.cols-3{grid-template-columns:repeat(3,1fr)}
.cols-4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;
  box-shadow:var(--shadow)}
/* 成绩分析：所有版本 成绩趋势标题距卡片上内边 = 16px（卡片上内边距保留 16） */
#grade_body>.card{padding-top:16px}
/* 教学设置页：所有卡片内容距四边统一 16px。标题不额外加 margin（落在卡片 16px 内边距上），
   10px 标题↔内容间距改放 collapse-body 的 padding-top（折叠态 display:none 不渲染，故折叠卡 16/16 对称） */
.view-settings .section-title{margin:0}
.view-settings .collapse-body{padding-top:10px}
.view-settings .card:not(.collapsible) > .section-title + *:not(.collapse-body){margin-top:10px}
.card h3{margin:0 0 4px;font-size:15px}
.card .sub{color:var(--text-2);font-size:13px}

.home-hero{background:linear-gradient(120deg,var(--primary),#7b5cf6);color:#fff;border-radius:var(--radius);
  padding:22px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.home-hero h2{margin:0 0 10px;font-size:20px}
.home-hero .date{opacity:.9;font-size:13px;margin-bottom:4px}
.home-hero .counts{margin:0;font-size:13px;font-weight:600;opacity:.95;line-height:1.5}
.home-hero .counts .count-link{cursor:pointer;color:#fff;border-bottom:1px solid transparent;transition:border-color .15s}
.home-hero .counts .count-link:hover{border-bottom-color:#fff}
/* 学情跟进：班级/学生 新增按钮点击旋转 45° 反馈 */
.add-spin svg{transition:transform .3s ease}
.add-spin.spin svg{animation:addSpin .45s ease}
@keyframes addSpin{0%{transform:rotate(0)}50%{transform:rotate(45deg)}100%{transform:rotate(0)}}
/* 学情跟进：页级导入/导出 模式响应态（按钮高亮 + 班级卡片选中） */
.stu-ie-btn.active{background:var(--primary)!important;border-color:var(--primary)!important;color:#fff!important;box-shadow:0 2px 6px rgba(79,107,237,.28)}
.stu-ie-btn.active:hover{filter:brightness(1.05)}
.card.pick{outline:2px solid var(--primary);outline-offset:-2px;background:var(--primary-soft);box-shadow:0 2px 8px rgba(79,107,237,.18)}
/* 学情跟进-班级卡片 N：左侧蓝色选择圈（radio 形态，选中时实心 + 勾选标记 + 卡片描边主色） */
.sel-circle{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--border);background:#fff;flex:none;margin-top:3px;position:relative;transition:.15s}
.card.pick .sel-circle{border-color:var(--primary);background:var(--primary)}
.card.pick .sel-circle::after{content:'';position:absolute;left:5px;top:1.5px;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.task.pick{outline:2px solid var(--primary);outline-offset:-2px;background:var(--primary-soft);box-shadow:0 2px 8px rgba(79,107,237,.18)}
.rec.pick{outline:2px solid var(--primary);outline-offset:-2px;background:var(--primary-soft);box-shadow:0 2px 8px rgba(79,107,237,.18)}
/* 成绩分析-趋势页：学期/考试/班级/科目/搜索框 38高 99圆角 */
#grade_head .bk-range-trigger{height:38px;border-radius:99px}
#grade_search{height:38px;border-radius:99px}
/* 成绩分析-成绩管理页：新增/导入/导出/归档 38高 99圆角（新增按钮为圆形图标，由自身内联覆盖） */
.grade-mgmt-actions .btn{height:38px;border-radius:99px}
.grade-mgmt-actions{width:fit-content;max-width:100%;margin-left:auto;margin-right:0}
.grade-mgmt-actions>.btn{flex:0 0 auto !important}
/* 抽屉内的「主题/重置」按钮：圆角 99（pill 化） */
.drawer .btn.sm{border-radius:99px}
.btn{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:9px 15px;border-radius:10px;
  font-size:14px;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-text)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.sm{padding:10px 11px;font-size:13px}
#stu_range_wrap .bk-range-trigger{border-radius:19px;height:36px}
#dr_type_wrap .bk-range-trigger{border-radius:99px}
#stu_cls_wrap .bk-range-trigger{border-radius:99px}
#rec_cls_wrap .bk-range-trigger{height:38px;border-radius:99px}
#rec_time_wrap .bk-range-trigger{height:38px;border-radius:99px}
/* 学情跟进-新建班级弹窗：学期/学段/年级 圆角99（高度沿用基础 38） */
#cls_sem_wrap .bk-range-trigger,#cls_stage_wrap .bk-range-trigger,#cls_grade_bk_wrap .bk-range-trigger{height:38px;border-radius:99px}
/* 学情跟进-登记记录弹窗：班级/学生/类型/加扣分 圆角99（高度沿用基础 38） */
#rec_modal_cls_wrap .bk-range-trigger,#rec_modal_stu_wrap .bk-range-trigger,#rec_modal_type_wrap .bk-range-trigger{height:38px;border-radius:99px}
#rec_modal_type_wrap{width:80px;flex:none}
#rec_modal_type_wrap .bk-trigger-text{text-overflow:ellipsis}
#qa_cls_wrap .bk-range-trigger{height:38px;border-radius:99px}
.rec-type-combo .bk-trigger-input{flex:1;min-width:0;border:none;background:transparent;outline:none;font:inherit;font-size:13px;color:var(--text);padding:0;cursor:text}
.rec-type-combo .bk-trigger-input::placeholder{color:var(--text-2)}
.view-draw .bk-range-trigger{height:38px;border-radius:99px}
.view-draw input[type="number"]{height:38px;border-radius:99px}
.view-draw input[type="date"]{height:38px;border-radius:99px}
/* 重复抽取开关：iOS 风格胶囊 25×14（高度 14 等比缩小），原 44×26 偏大，按用户要求按比例缩到 14 高度 */
.pill-toggle{position:relative;display:inline-flex;align-items:center;width:25px;height:14px;border-radius:99px;border:none;background:var(--border);cursor:pointer;font-family:inherit;padding:0;flex:none;transition:background .18s ease}
.pill-toggle::after{content:'';position:absolute;left:1px;top:1px;width:12px;height:12px;border-radius:50%;background:#fff;transition:transform .18s ease;box-shadow:0 1px 2px rgba(0,0,0,.18)}
.pill-toggle.on{background:#4F6BED}
.pill-toggle.on::after{transform:translateX(11px)}
.btn.danger{color:var(--danger);border-color:transparent;background:transparent}
.btn.danger:hover{background:rgba(224,83,61,.1)}
#stu_search{border-radius:99px}
#rec_add_btn svg{transition:transform .25s ease}
#rec_add_btn.spin svg{transform:rotate(45deg)}
.btn.ghost{background:transparent}
.btn.block{width:100%;justify-content:center}
.btn.mini{padding:3px 9px;font-size:13px;line-height:1.5}
.btn.link{background:none;border-color:transparent;color:var(--primary);padding:4px 2px;box-shadow:none}
.btn.link:hover{background:rgba(79,107,237,.08)}

.task{display:flex;align-items:stretch;gap:11px;padding:10px 12px;border-radius:11px;background:var(--surface);
  margin-bottom:8px;position:relative;overflow:hidden;cursor:pointer;transition:background .12s ease}
/* 点击整行时的按压响应（背景浅主色）；放弃态也保留响应反馈 */
.task:active{background:var(--primary-soft)}
.task .t-bar{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--cat,#8a5cf6)}
.task .t-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.task .t-line1{display:flex;align-items:center;gap:10px;padding-left:4px}
.task .t-line1 .closed-badge{margin-left:auto;flex:none}
.task .check{box-sizing:border-box;width:16px;height:16px;border-radius:5px;border:2px solid var(--border);background:var(--surface);flex:none;display:flex;
  align-items:center;justify-content:center;font-size:11px;color:#fff;cursor:pointer}
.task .check.ab{background:var(--danger);border-color:var(--danger)}
.task.done .check{background:var(--ok);border-color:var(--ok)}
/* 勾选完成瞬间：复选框自身带 done 类 → 弹入呈现 ✓（与首页 .ht-check.done 同机制，落点可见）。
   仅在 taskToggleTodo 单击时给复选框加 done 触发一次；todoRow 静态渲染不写 done 类，故列表加载/重渲染不会误触发 */
.task .check.done{animation:htpop .24s ease}
.task.done .t-title{text-decoration:line-through;color:var(--text-2)}
.t-title{flex:1;font-size:15px;line-height:1.4;font-weight:600}
.t-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding-left:34px}
/* 操作按钮移入 meta 行，靠右对齐（与类别/重复/优先级一行） */
.task .t-meta .row-actions{margin-left:auto}
.pri{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600;white-space:nowrap}
.pri.高{background:rgba(224,83,61,.13);color:var(--danger)}
.pri.中{background:rgba(232,163,61,.16);color:var(--warn)}
.pri.低{background:var(--surface);color:var(--text-2);border:1px solid var(--border)}
.row-actions{display:flex;gap:12px;opacity:0;transition:.15s;align-self:center;flex:none}
.task:hover .row-actions,.item:hover .row-actions{opacity:1}
/* 任务卡操作按钮：低调样式——透明无边框、淡灰图标；悬停才显眼 */
.task .row-actions .btn{width:30px;height:30px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;font-size:13px;line-height:1;background:transparent;border-color:transparent;color:var(--text-2);opacity:.55;transition:.15s}
.task .row-actions .btn:hover{opacity:1;background:var(--surface-2);color:var(--text)}
.task .row-actions .btn.danger{color:var(--danger);opacity:.55}
.task .row-actions .btn.danger:hover{opacity:1;background:rgba(224,83,61,.1)}
/* 任务卡内 类别/优先级/截止日 三个标签统一大小与上下内边距 */
.task .tag,.task .pri,.task .days{font-size:11px;padding:3px 8px;font-weight:600}

.bar{height:8px;border-radius:6px;background:var(--surface-2);overflow:hidden;margin-top:9px}
.bar>span{display:block;height:100%;background:var(--primary);border-radius:6px}

.dl{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;background:var(--surface-2);margin-bottom:8px}
.dl .dot{width:9px;height:9px;border-radius:50%;flex:none}
.dl .d-title{flex:1;font-size:14px}
.dl .d-when{font-size:12px;color:var(--text-2);white-space:nowrap}
.days{font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.days.soon{background:rgba(224,83,61,.13);color:var(--danger)}
.days.mid{background:rgba(232,163,61,.16);color:var(--warn)}
.days.ok{background:rgba(31,170,107,.14);color:var(--ok)}

.stu{display:flex;align-items:center;gap:6px;padding:11px 12px;border-radius:11px;background:var(--surface-2);margin-bottom:8px}
.avatar{width:36px;height:36px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:14px}
.avatar[data-action]{cursor:pointer}
.stu .s-name{flex:1;font-size:14px;font-weight:600}
.stu .s-name[data-action]{cursor:pointer}
.stu .s-name[data-action]:hover{color:var(--primary)}
.stu .s-meta{font-size:12px;color:var(--text-2)}
/* 首页-重点关注学生：每行三张（卡片内部仍为头像+姓名/班级横排） */
.stu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stu-grid .stu{margin-bottom:0;padding:6px}
.stu-grid .avatar{width:28px;height:28px}
/* 空态：在3列网格中跨满整行，让文字行宽放开、左右居中 */
.stu-grid>.empty{grid-column:1/-1;text-align:center}
.tag{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--chip);color:var(--text-2);margin-left:6px}
/* 教学待办「重复」行内图标容器：内联放同步图标的 svg，绕开 iconSvg 自带 display:block */
.tg-ic{display:inline-flex;align-items:center;vertical-align:-1px;margin-right:3px;line-height:0}
.tag.concern{background:rgba(224,83,61,.13);color:var(--danger)}
.tag.points{background:rgba(79,107,237,.12);color:var(--primary)}
/* 学情跟进-学生：名字后胶囊按钮（需关注）+ 待办/沟通条目 + 已处理列表 */
.stu-cap{flex:none;width:24px;height:14px;border-radius:99px;border:0;background:var(--border);cursor:pointer;margin-left:8px;padding:0;position:relative;transition:background .18s ease}
.stu-cap::after{content:'';position:absolute;left:2px;top:2px;width:10px;height:10px;border-radius:50%;background:#fff;transition:transform .18s ease;box-shadow:0 1px 2px rgba(0,0,0,.18)}
.stu-cap.on{background:var(--danger)}
.stu-cap.on::after{transform:translateX(10px)}
.stu-item{display:inline-block;padding:1px 8px;margin:0 6px 4px 0;border-radius:99px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);cursor:pointer;user-select:none;font-size:12px;line-height:1.4;white-space:normal}
.stu-item.strike{text-decoration:line-through;opacity:.45}
.proc-row{padding:8px 2px 8px 14px;border-bottom:1px solid var(--border)}
.proc-row:last-child{border-bottom:0}
.proc-main{display:flex;align-items:baseline;gap:8px;cursor:pointer}
.proc-badge{flex:none;width:18px;height:16px;display:inline-flex;align-items:center;justify-content:center;border-radius:5px;background:rgba(79,107,237,.12);color:var(--primary)}
.proc-badge.todo{background:rgba(31,170,107,.13);color:var(--ok)}
.proc-text{flex:1;font-size:14px;font-weight:600;min-width:0}
.proc-time{flex:none;font-size:12px;color:var(--text-2);white-space:nowrap}
.proc-notes{margin:6px 0 0 2px}
.proc-note{display:flex;align-items:baseline;gap:6px;font-size:13px;color:var(--text-2);margin-top:4px}
.pn-badge{flex:none;font-size:11px;padding:0 6px;border-radius:99px;background:var(--surface-2);color:var(--text-2)}
.pn-del{color:var(--danger);cursor:pointer;flex:none}
.proc-remark{margin-top:6px;display:flex;gap:6px}
.proc-remark input{flex:1;height:34px;border-radius:99px;border:1px solid var(--border);padding:0 12px;font-size:13px;background:#fff;color:var(--text)}
.proc-remark button{flex:none;height:34px;padding:0 14px;border-radius:99px;border:0;background:var(--primary);color:#fff;font-size:13px;cursor:pointer}
.tag.unfin{background:rgba(138,92,246,.16);color:#8a5cf6;font-weight:600}
.tag.cat{margin-left:0}
.tag.clickable{cursor:pointer;transition:background .15s}
.tag.clickable:hover{background:var(--primary-soft);color:var(--primary)}
.tag-input-wrap{display:flex;flex-wrap:wrap;gap:6px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:#fff;min-height:32px;box-sizing:border-box;align-items:center;transition:border-color .15s}
.tag-input-wrap:focus-within{border-color:var(--primary)}
.tag-input-wrap .tag-list{display:contents}
.tag-chip{display:inline-flex;align-items:center;gap:2px;background:var(--primary-soft);color:var(--primary);padding:2px 4px 2px 8px;border-radius:10px;font-size:12px;line-height:1.4}
.tag-chip .tag-x{cursor:pointer;padding:0 4px;opacity:.6;font-size:14px;line-height:1}
.tag-chip .tag-x:hover{opacity:1}
.tag-input-wrap input[type=text]{flex:1;min-width:80px;border:none;outline:none;background:transparent;padding:0;font-size:13px;color:var(--text);font-family:inherit}
.tag-filter-chip{display:inline-flex;align-items:center;gap:4px;background:var(--primary-soft);color:var(--primary);padding:3px 8px;border-radius:12px;font-size:12px;font-weight:500}
.tag-filter-chip .x{cursor:pointer;opacity:.7;font-size:14px;line-height:1;padding:0 2px}
.tag-filter-chip .x:hover{opacity:1}
.tag.cat.muted{background:var(--chip);color:var(--text-2)}
/* 关闭态时间徽章：完成（绿系）/ 放弃（红系），与优先级/截止日区分 */
.tag.t-done{background:rgba(31,170,107,.14);color:var(--ok);margin-left:6px}
.ov{display:inline-block;font-size:12px;line-height:1.4;padding:1px 8px;border-radius:99px;margin:2px 4px 0 0;border:1px solid var(--border);white-space:normal}
.ov-ok{background:rgba(31,170,107,.12);color:var(--ok);border-color:rgba(31,170,107,.3)}
.ov-new{background:var(--surface-2);color:var(--text-2);border-color:var(--border)}
.tag.t-ab{background:rgba(224,83,61,.13);color:var(--danger);margin-left:6px}
.cb-inline{display:inline-flex;align-items:center;gap:5px;margin-right:14px;font-size:13px;cursor:pointer}
.cb-inline input{width:auto;flex:none}
.btn.warn{color:#c97f12}
.btn.restart{background:var(--chip);color:var(--primary);border-color:transparent;font-weight:600;padding:3px 10px}
.task.abandoned .t-title{color:var(--text)}
/* 首页「教学待办」：方案 F 极简单行密集布局（与教学待办页方案 C 不同格式） */
.home-todo-list{padding:2px 0}
/* 首页教学待办卡片底部「全部」按钮：高度 16、圆角 99、小字号（覆盖 .btn.sm 的 padding/字号） */
.btn.sm.home-todo-more{height:16px;padding:0 10px;box-sizing:border-box;font-size:11px;line-height:1;border-radius:99px;gap:0}
/* 学期卡片「设为当前」按钮：高度 18、圆角 99（覆盖 .btn.sm 的 padding/字号） */
.btn.sm.set-cur-sem{height:18px;padding:0 10px;box-sizing:border-box;font-size:11px;line-height:1;border-radius:99px;gap:0}
.ht-row{display:flex;align-items:center;gap:7px;padding:7px 2px;border-bottom:1px dashed var(--border);font-size:13px;cursor:pointer;white-space:nowrap;overflow:hidden;transition:background .14s ease}
.ht-row:active{background:var(--primary-soft)}
.ht-row:last-child{border-bottom:none}
.ht-check{box-sizing:border-box;width:16px;height:16px;border-radius:5px;border:2px solid var(--border);background:var(--surface);flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;line-height:1;transition:background .15s,border-color .15s}
.ht-check.done{background:var(--ok);border-color:var(--ok);animation:htpop .24s ease}
@keyframes htpop{0%{transform:scale(.55)}55%{transform:scale(1.14)}100%{transform:scale(1)}}
/* 长按按钮的「按键响应」：按住下沉 + 底色变主色浅底，到时触发动作（无进度环） */
button[data-lp]{position:relative;overflow:visible;transition:transform .12s ease, background .12s ease}
button[data-lp].lp-hold{transform:scale(.92);background:var(--primary-soft) !important}
/* 短按实色蓝样式：模式蓝（~500ms 自动消失）与蓝闪（~400ms 同长按触发）共用此 .active 规则，无淡底按压态 */
button[data-action="imp-note"].active,
button[data-action="exp-note"].active,
button[data-action="imp-review"].active,
button[data-action="exp-review-all"].active,
button[data-action="todo-imp"].active,
button[data-action="grade-imp"].active,
button[data-action="imp-tt"].active,
button[data-action="exp-tt"].active,
button[data-action="imp-plan"].active,
button[data-action="exp-plan"].active,
button[data-action="do-arc-archive"].active,
button[data-action="do-manual-backup"].active,
button[data-action="do-restore-import"].active,
button[data-action="do-reset-scope"].active{background:var(--primary)!important;border-color:var(--primary)!important;color:#fff!important;box-shadow:0 2px 6px rgba(79,107,237,.28)}
button[data-action="imp-note"],
button[data-action="exp-note"],
button[data-action="imp-review"],
button[data-action="exp-review-all"],
button[data-action="todo-imp"],
button[data-action="grade-imp"],
button[data-action="imp-tt"],
button[data-action="exp-tt"],
button[data-action="imp-plan"],
button[data-action="exp-plan"]{transition:background .12s ease}
/* 归档备份区 4 个图标按钮：原生按压反馈（缩放+淡底），不依赖 JS 时机、不被重渲染冲掉，确保点击即时响应 */
.view-settings .bk-ops .btn:active{transform:scale(.92);background:var(--primary-soft)!important;color:var(--primary)}
.ht-check.ab{background:var(--danger);border-color:var(--danger)}
.ht-row .ht-dot{width:7px;height:7px;border-radius:50%;flex:none}
.ht-row .ht-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px;color:var(--text)}
.ht-row.done .ht-title{text-decoration:line-through;color:var(--text-2)}
.ht-row .ht-rep,.ht-row .ht-due,.ht-row .ht-pri,.ht-row .ht-closed{flex:none;font-size:11.5px;color:var(--text-2);white-space:nowrap}
.ht-row .ht-due.soon{color:var(--warn)}
.ht-row .ht-due.over,.ht-row .ht-closed.ab{color:var(--danger)}
.ht-row .ht-due.mid{color:var(--text-2)}
.ht-row .ht-pri.pri高{color:var(--danger);font-weight:600}
.ht-row .ht-pri.pri中{color:var(--warn)}
.ht-row .ht-pri.pri低{color:var(--text-2)}
.ht-row .ht-closed{color:var(--ok);font-weight:600}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;color:var(--text-2);padding:36px 16px;font-size:14px;background:transparent;border:none}
.empty .em-ic{display:flex;align-items:center;justify-content:center;font-size:32px;line-height:1;margin:0;opacity:.45}
.focus-empty{font-size:13px}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tab{padding:8px 15px;border-radius:10px;background:var(--surface-2);color:var(--text-2);font-size:14px;border:none}
.tab.active{background:var(--primary);color:#fff}
/* 成绩分析：分段控件（单一圆角容器，激活态为滑动蓝 pill） */
.grade-tabs{position:relative;display:flex;align-items:center;padding:4px;background:#fff;border-radius:99px;gap:2px;width:fit-content;max-width:100%;flex-wrap:wrap;box-shadow:var(--shadow);margin:0 auto 16px}
.grade-tabs .tab{position:relative;z-index:1;height:38px;padding:0 18px;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;border:none;border-radius:99px;background:transparent;color:var(--text-2);font-size:13px;flex:1 1 auto;text-align:center;min-width:62px;cursor:pointer;transition:color .2s ease}
.grade-tabs .tab:hover:not(.active){background:var(--primary-soft);color:var(--primary)}
.grade-tabs .tab.active{color:#fff}
.grade-tabs .tab-thumb{position:absolute;z-index:0;top:4px;bottom:4px;left:0;border-radius:99px;background:var(--primary);box-shadow:0 2px 8px rgba(79,107,237,.28);transform:translateX(0);width:0;transition:transform .26s cubic-bezier(.4,0,.2,1),width .26s cubic-bezier(.4,0,.2,1)}
.grade-tabs.has-icon-tabs .tab{height:auto;flex-direction:column;gap:3px;padding:9px 14px;min-width:56px;font-size:13px}
.grade-tabs.has-icon-tabs .tab .ic{display:flex;align-items:center;justify-content:center;height:24px;color:inherit}
.grade-tabs.has-icon-tabs .tab .ic svg{width:24px;height:24px}
.grade-tabs.has-icon-tabs .tab .nm{display:block;font-size:9px;line-height:1.2;letter-spacing:.02em;color:inherit;white-space:nowrap}
.grade-tabs.has-icon-tabs .tab.active .nm{color:#fff}
.grade-tabs.has-icon-tabs .tab:not(.active) .ic{color:var(--text-2)}
/* 学情跟进 .view-students .tab{height:38px !important}（L554）会盖掉上方 height:auto，
   在 .view-students 内对 icon-tabs 用更高优先级的 !important 收回，保持两行自适应高度 */
.view-students .grade-tabs.has-icon-tabs .tab{height:auto !important}
/* 教学待办：统计卡筛选条（8 张：全部/教学/学生/工作/活动/任务/其他/完成） */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 14px}
.stat-card{flex:1 1 0;min-width:72px;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--border);display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:all .15s;font:inherit;text-align:left;color:var(--text);font-family:inherit}
.stat-card:hover{border-color:var(--primary)}
.stat-card.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.stat-card .stat-top{display:flex;justify-content:space-between;align-items:center}
.stat-card .stat-icon{width:24px;height:24px;border-radius:7px;background:var(--surface-2);color:var(--text-3);display:flex;align-items:center;justify-content:center;font-size:13px;line-height:1}
.stat-card.active .stat-icon{background:rgba(255,255,255,.22);color:#fff}
.stat-card .stat-count{font-size:20px;font-weight:700;line-height:1}
.stat-card .stat-label{font-size:12px;color:var(--text-2)}
/* 教学待办：搜索 + 添加待办 同一行（等高 38px） */
.todo-toolbar{display:flex;align-items:stretch;gap:8px;margin:0 0 12px}
.todo-toolbar .todo-search{position:relative;flex:1;margin:0}
.todo-toolbar .btn{flex:none;align-self:stretch}
/* 搜索框白底、高 38px 与按钮等高（2026-08-30 通用化：todo/stu_search/grade_search 共用 .srch-box） */
.srch-box,.todo-search{position:relative;flex:1;margin:0;min-width:140px}
.srch-box input,.todo-search input{width:100%;height:38px;padding:8px 14px 8px 34px;border-radius:99px;border:1px solid var(--border);background:#fff;font:inherit;font-size:14px;color:var(--text);box-sizing:border-box;outline:none}
.srch-box input::placeholder,.todo-search input::placeholder{color:var(--text-2)}
.srch-box input:focus,.todo-search input:focus{border-color:var(--primary);background:#fff}
.srch-box .ic,.todo-search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-2);pointer-events:none;display:inline-flex;align-items:center;justify-content:center}
.srch-box .ic svg,.todo-search .ic svg{width:16px;height:16px;display:block}
/* 教学进度-全部课程 / 备课笔记-课程 下拉触发 38高 99圆角 */
#course_cls_wrap .bk-range-trigger,#note_cls_wrap .bk-range-trigger{height:38px;border-radius:99px}
.stat-card.active .stat-label{color:rgba(255,255,255,.82)}

table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
th{color:var(--text-2);font-weight:600;font-size:13px}
/* 各科成绩汇总：固定列宽，不随屏幕缩放而伸缩（窄屏容器 overflow:auto 横向滚动） */
.score-fixed{table-layout:fixed;width:max-content!important}
.score-fixed th,.score-fixed td{padding:10px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score-fixed.score-center th,.score-fixed.score-center td{text-align:center}
.score-fixed col.c-cls{width:70px}
.score-fixed col.c-name{width:50px}
.score-fixed col.c-sub{width:64px}
.score-fixed col.c-rk{width:32px}
.score-fixed col.c-total{width:80px}
.score-fixed col.c-trk{width:60px}
/* 科目视图（历次考试）：考试名 / 进退步 / 均分 列宽 */
/* 考试名列宽跟随考试名称自适应（不再固定 96px）：
   - table-layout:fixed 模式下，单纯改 col 宽度在跨浏览器下不稳定；
   - 用 min-width:max-content 锁住 th 最小宽度，浏览器会被迫撑开整列。 */
.score-fixed col.c-ex{width:max-content}
.score-fixed th.c-ex{min-width:max-content}
.score-fixed col.c-jb{width:50px}
.score-fixed col.c-avg{width:40px}
.score-fixed col.c-ark{width:32px}
/* 成绩分析-科目 表头排序方向指示器（2026-08-30：图标已按用户要求删除，仅保留 ▲/▼） */
.score-fixed .h-lb{font-weight:inherit}
.score-fixed .h-ord{font-size:10px;color:var(--primary);margin-left:3px;font-weight:600}
/* 成绩分析-科目 表头：其余列恢复默认 13px/600；仅"排名"类别（c-rk 每场 / c-ark 末位）保持 12px */
.score-fixed th.c-rk,.score-fixed th.c-ark{font-size:12px;font-weight:400}
.score-fixed th.h-flex{cursor:pointer;user-select:none}
.score-fixed th.h-flex.active{color:var(--primary);font-weight:700}
.score-fixed th.h-flex:hover:not(.active){background:var(--primary-soft)}
/* 成绩分析-科目 学生名（点击弹窗历次成绩） */
.subj-link{cursor:pointer;color:inherit}
.subj-link:hover{color:var(--primary)}
.tt-table{min-width:520px}
.tt-table th,.tt-table td{white-space:nowrap}
/* 课表行分隔线改虚线 */
.tt-table th,.tt-table td{border-bottom:1px dashed var(--border)}
tbody tr:hover{background:var(--surface-2)}
/* 手机端（≤640px）：积分流水表列宽固定（table-layout:fixed 保证不被内容撑开） */
@media(max-width:640px){
  .rec-table{table-layout:fixed}
  .rec-card{border-top:none;border-bottom:none}
  .rec-table th,.rec-table td{padding:10px 4px}
  .rec-table col.rec-c1{width:46px}
  .rec-table col.rec-c2{width:70px}
  .rec-table col.rec-c5{width:48px}
  .rec-table col.rec-c6{width:32px}
  .rec-table th.rec-c1,.rec-table td.rec-c1{width:46px;font-size:12px;font-weight:600;line-height:1.15;white-space:normal;word-break:break-all;text-align:center}
  .rec-table td.rec-c1{font-size:15px}
  .rec-table th.rec-c2,.rec-table td.rec-c2{width:70px;font-size:13px}
  .rec-table th.rec-c4,.rec-table td.rec-c4{width:70px;font-size:13px;text-align:right}
  .rec-table th.rec-c5,.rec-table td.rec-c5{width:48px;font-weight:600;white-space:normal;text-align:right}
  .rec-table th.rec-c6,.rec-table td.rec-c6{width:32px;text-align:center}
  .rec-table td.rec-c4{font-size:13px}
  .rec-table th:not(.rec-c1):not(.rec-c5):not(.rec-c6),.rec-table td:not(.rec-c1):not(.rec-c5):not(.rec-c6){white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
}

/* 手机端（≤640px）：消除 7 个页面（教学待办/教学进度/备课笔记/学情跟进/每周复盘/成绩分析/教学设置）的 page-head 描述性文字（标题+副文整块隐藏） */
@media(max-width:640px){
  .page-head{display:none}
}

/* 手机端（≤640px）：「新增/编辑代办」弹窗保持桌面两列布局（全显示不裁切）
   - 桌面布局：类别+优先级 / 截止日期□+重复□ / 日期+每 数字单位 各两列一行
   - 手机策略：减内边距给两列腾空间；日期与「每」保持同行（与桌面一致） */
@media(max-width:640px){
  .modal-back{padding:20px 8px}
  .modal-body:has(form[data-form="todo"]){padding:12px 16px}
  form[data-form="todo"] .tf-grid{gap:8px}
  form[data-form="todo"] .tf-cell{min-width:0}
  form[data-form="todo"] .tf-cell input[type="date"]{min-width:0;width:auto}
}
/* 手机端（≤640px）：隐藏所有原生滚动条（仅视觉隐藏，不影响上下/左右滚动交互） */
@media(max-width:640px){
  ::-webkit-scrollbar{width:0!important;height:0!important;background:transparent!important;display:none!important}
  *{scrollbar-width:none!important;-ms-overflow-style:none!important}
}
/* 手机端（≤640px）：教学 hub 4 个 tab 切换 + iOS 式横滑转场 */
@media(max-width:640px){
  .teach-hub{overflow:hidden;position:relative}
  .teach-pages{position:relative;width:100%;min-height:calc(100vh - 120px)}
  /* 4 个 panel 默认 absolute inset:0 叠在同一可视区，靠 visibility 切换显示；
     active 改 position:relative → 撑开 .teach-pages 高度到内容高度，避免内容被 min-height 截断。
     display:block 必须显式写：桌面端 line70 有 `.teach-pages .tp{display:none}`（桌面靠 display 切换 tab），
     若 mobile 不覆盖，拖动时相邻 panel 仍是 display:none → 教学退化成「单页橡皮筋」(A 款)，
     与学情/成绩「并排跟随」(B 款) 不一致。此处统一为 B 款。 */
  .teach-pages .tp{display:block;position:absolute;inset:0;width:100%;box-sizing:border-box;visibility:hidden;overflow-y:auto}
  .teach-pages .tp.active{position:relative;visibility:visible;z-index:1}
  /* 拖动期间：active 保持 relative 撑开 .teach-pages 高度（否则容器塌成 0 → 面板变空白）；
     仅被显出的相邻 panel（.tp-shown）转 absolute 叠到屏边，靠 transform 做并排转场；
     松手 selectTeachTab 移除 .dragging，active 重归 relative、相邻 panel 复位隐藏 */
  .teach-pages.dragging .tp.tp-shown{position:absolute !important;visibility:visible}
  /* 成绩/学情 横向滑动容器（与教学 hub 同架构；桌面端不生效，面板为普通块） */
  .grade-pages,.stu-pages{position:relative;width:100%;min-height:calc(100vh - 120px)}
  .grade-pages .tp,.stu-pages .tp{position:absolute;inset:0;width:100%;box-sizing:border-box;visibility:hidden;overflow-y:auto}
  .grade-pages .tp.active,.stu-pages .tp.active{position:relative;visibility:visible}
  .grade-pages.dragging .tp.tp-shown,.stu-pages.dragging .tp.tp-shown{position:absolute !important;visibility:visible}
  /* 手机版三 hub 共用容器 overflow:hidden —— 仅阻挡相邻 panel 在拖动期间超出屏边的部分。 */
  .teach-pages,.grade-pages,.stu-pages{overflow:hidden}
  /* 内容屏边安全距 (iOS UIPageViewController 风格) — 关键模型：
     项目里 main#app.wrap 在 mobile 有 padding:16px 16px 99px（line 989），
     pages 容器 width:100% 在 main 内容区里只有 358px；
     panel transform 平移时整 panel（含 padding 一起）移动。
     需求天然冲突：静止态 16 + 拖动缝 32。
     —— box-shadow inset 方案（r31）被内容白背景覆盖失败；
     —— panel padding 16（r30）跟 main padding 16 叠加静止态变 32px 失败。
     正确解法：给 pages 容器负 margin 把宽度撑到 100vw = 390px，让 panel padding 16 独占：
       .pages { margin-left:-16; margin-right:-16; width:calc(100% + 32px); }  →  容器 390px
       .tp { padding-left:16; padding-right:16; }                                →  内容区 358px
     内容区宽度 358px 跟原来一样 → panel 内 button 坐标不变 → 不 reflow → 不破坏 inter() 命中坐标。
     静止态：panel 在 [0..390]，内容在 [16..374]，距屏边 16px ✓
     拖动态：左 panel translateX(-N) 时整 panel（含 padding）平移；左 panel 内容右缘 = 左 panel 右缘 - 16，
             右 panel 内容左缘 = 右 panel 左缘 + 16；
             两 panel 边缘相接处 = (左 panel 右 padding 16) + (右 panel 左 padding 16) = 32px 缝 ✓ */
  .teach-pages,.grade-pages,.stu-pages{margin-left:-16px;margin-right:-16px;width:calc(100% + 32px)}
  .teach-pages .tp,.grade-pages .tp,.stu-pages .tp{padding-left:16px;padding-right:16px}
  /* r43 铁律：非当前 panel 除 visibility:hidden 外，还必须被推到「屏外」——用 class 级 !important，
     这样任何 inline style 清理（selectTeachTab/reset/syncTeachPages 都会清 transform/opacity/visibility）
     都不会把它拉回屏内。
     为什么必须屏外：iOS Safari 上 .tp 是 overflow-y:auto 的滚动容器 → 会被提升为独立合成层，
     visibility:hidden 对合成层的传播可能晚一帧 → 用户看到「松手瞬间上一个界面残留一帧」。
     屏外 transform 是几何位移：即使 visibility 晚一帧，视口内也没有它的任何像素（容器 overflow:hidden 也裁剪）。
     !important 是必须的：end()/update() 会在 inline 上写 transform，不加 !important 会被 inline 覆盖。
     因此 update()/down() 在开始位移前必须先 remove('tp-off')。 */
  .teach-pages .tp.tp-off,.grade-pages .tp.tp-off,.stu-pages .tp.tp-off{
    transform:translateX(-200%) !important;pointer-events:none
  }
}

.bk-range-trigger{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:10px;padding:0 32px 0 12px;height:38px;font-size:13px;cursor:pointer;font-family:inherit;width:100%;box-sizing:border-box;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:6px;white-space:nowrap;overflow:hidden;min-width:0;position:relative}
/* 折叠态箭头指右（▶），展开（下拉）时旋转 90° 指下（▼），带旋转特效 */
.bk-range-trigger::after{content:'';position:absolute;right:10px;top:50%;width:10px;height:10px;margin-top:-5px;background:url("data:image/svg+xml;charset=utf-8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M2 1 L8 5 L2 9' stroke='%23999' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>") center/contain no-repeat;transition:transform .2s ease;flex:none}
.bk-range-trigger.open::after{transform:rotate(90deg)}
.bk-trigger-text{display:block;white-space:nowrap;overflow:hidden;min-width:0;flex:1}
.bk-trigger-chev{flex:none}
.chev{display:inline-block;width:10px;height:10px;background:url("data:image/svg+xml;charset=utf-8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M3.5 1.5l4 3.5-4 3.5' stroke='%23999' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>") center/contain no-repeat;flex:none;transition:transform .2s}
.chev.open{transform:rotate(90deg)}
.bk-range-trigger:hover{border-color:var(--primary)}
.bk-range-trigger:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.bk-range-pop{position:absolute;z-index:30;top:42px;left:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.12);max-height:230px;overflow:auto;width:max-content;min-width:140px}
.bk-range-wrap.up .bk-range-pop{top:auto;bottom:calc(100% + 4px)}
.bk-range-opt{padding:6px 6px;font-size:13px;cursor:pointer;border-radius:6px;line-height:1.6;white-space:nowrap}
.bk-range-opt:hover{background:var(--surface-2)}
.bk-range-opt input{vertical-align:middle;margin:0 8px 0 0;width:16px;height:16px;flex:none;vertical-align:middle}
.bk-range-opt:hover{background:var(--surface-2)}
.view-students .tab{height:38px !important;box-sizing:border-box;display:inline-flex;align-items:center}
.view-students .field select{height:38px !important;box-sizing:border-box;padding:0 12px !important}
.view-students .stu-act .btn{height:38px !important;box-sizing:border-box;display:inline-flex;align-items:center}
.view-students .stu-act input{height:38px !important;box-sizing:border-box}
.view-draw .field select,.view-draw .field input{height:38px !important;box-sizing:border-box;padding:0 12px !important}
.view-draw .btn.block{height:38px !important;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center}
.prog-ta{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);font-size:14px;line-height:1.5;font-family:inherit;min-height:48px;resize:vertical;box-sizing:border-box}
.prog-ta:focus{outline:none;border-color:var(--primary)}
.ed-done-title{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);font:inherit;font-size:14px;box-sizing:border-box}
.ed-done-title:focus{outline:none;border-color:var(--primary)}
.field textarea.prog-ta{min-height:48px}
/* 记录进度-今日任务：复选框与内容垂直齐平（用 .ex-chk-wrap 自定义 18×18 勾选框，flex 布局确保与文案中心对齐，与文字清晰错开） */
/* 选择器 .field .prog-cb 特异性 (0,2,0) > .field label (0,1,1)，用来覆盖全局 .field label 的 display:block + font-size:13px，否则 flex 失效、文字变 13px；align-items:center 让 19px 框与 14px 中文方块字（line-height:1.4 → 19.6px 文本行 box）盒模型自动居中，偏差 ~0.8px，肉眼齐平（原 margin-top:3 / padding-top:1 是按英文 x-height 算的，对中文不适用，文字中点高于框中点 2.2px） */
.field .prog-cb{display:flex;align-items:center;gap:2px;cursor:pointer;padding:7px 0;border-bottom:1px solid var(--border);font-size:14px;line-height:1.4;width:100%;box-sizing:border-box}
.field .prog-cb:last-child{border-bottom:none}
.field .prog-cb .ex-chk-wrap{flex:none;width:19px;height:19px;display:inline-flex;align-items:center;justify-content:center;margin-top:0}
.field .prog-cb .ex-chk-wrap input[type=checkbox]{appearance:none;-webkit-appearance:none;width:19px;height:19px;padding:0;box-sizing:border-box;border:2.5px solid var(--border);border-radius:4px;background:var(--surface);cursor:pointer;position:relative;flex:none;margin:0;transition:all .15s;outline:none}
.field .prog-cb .ex-chk-wrap input[type=checkbox]:hover{border-color:var(--primary)}
.field .prog-cb .ex-chk-wrap input[type=checkbox]:checked{background:var(--primary);border-color:var(--primary)}
.field .prog-cb .ex-chk-wrap input[type=checkbox]:checked::after{content:'';position:absolute;left:3px;top:1px;width:5px;height:9px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.field .prog-cb .prog-cb-txt{flex:1;min-width:0;padding-top:0;font-size:14px;color:var(--text);font-weight:normal}
.field.row{display:flex;gap:10px}
.field.row>*{flex:1}
.field.row>.field{margin-bottom:0}
  .tf-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px 0;align-items:center}
  .tf-grid .tf-cell{display:flex;align-items:center;gap:8px}
  .tf-grid .tf-cell.full{grid-column:1/-1}
  .tf-grid .tf-cell input:not([type=checkbox]),.tf-grid .tf-cell select,.tf-grid .tf-cell .bk-range-wrap{flex:1;min-width:0}
  .tf-l{flex:none;color:var(--text-2);font-size:14px;white-space:nowrap}
  .tf-grid .cb{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
  form[data-form="todo"] input:not([type=checkbox]),form[data-form="todo"] select{border:1px solid var(--border);border-radius:10px;height:38px;box-sizing:border-box;padding:0 12px;font-size:13px;background:var(--surface);color:var(--text)}
  .combo{position:relative;display:flex;align-items:center;flex:1;min-width:0}
  .combo-in{padding-right:30px !important}
  .combo-arrow{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-2);font-size:12px;padding:2px 4px;line-height:1}
  .combo-pop{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:80;background:var(--bg);border:1px solid var(--border);border-radius:8px;max-height:230px;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.18)}
  .combo-opt{padding:9px 12px;cursor:pointer;font-size:14px;color:var(--text)}
  .combo-opt:hover{background:var(--surface-2)}

.modal-back{position:fixed;inset:0;background:rgba(15,20,30,.45);z-index:60;display:none;
  justify-content:center;padding:24px 16px;overflow-y:auto}
.modal-back.show{display:flex}
.modal{margin:auto;background:var(--surface);border-radius:var(--radius);width:100%;max-width:540px;box-shadow:var(--shadow);
  border:1px solid var(--border);overflow:hidden}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 8px;border-bottom:none}
.modal-head h3{margin:0;font-size:16px}
.modal-body{padding:16px}

.modal-body:has(form[data-form="todo"]){padding:16px}

/* 待办弹窗的 bk-range 弹层（与学期弹层同款）防极端窄屏溢出 */
.modal-body:has(form[data-form="todo"]) .bk-range-pop{max-width:calc(100vw - 24px)}

/* 学生详情弹窗（曹颖·高三(2)班等）手机端：行内 flex 项允许收缩，避免 select/button 撑爆 modal */
@media(max-width:640px){
  .modal-body .field.row{gap:6px}
  .modal-body .field.row>.field,.modal-body .field.row>select,.modal-body .field.row>input,.modal-body .field.row>button{min-width:0}

  .modal-body .field.row>.field>select{min-width:0}
}
.modal-foot{padding:0;margin-top:0;border-top:none;display:flex;justify-content:flex-end;gap:8px}
.modal-body:has(form[data-form="imp-grade"]) .modal-foot{margin-top:16px}
/* 弹窗统一：输入框/选择框 38；底部按钮 36 + 99 圆角（pill） */
.modal-body input:not([type=checkbox]),.modal-body select{height:38px;box-sizing:border-box;padding:0 12px}
.modal-foot .btn{height:36px;box-sizing:border-box;padding:0 18px;border-radius:99px}
/* 成绩管理-添加考试弹窗：学期/班级/科目/考试名称/考试时间 统一 高38 + 圆角99（textarea 除外） */
form[data-form="exam-add"] .bk-range-trigger{height:38px;border-radius:99px}
form[data-form="exam-add"] input:not([type=hidden]):not([type=checkbox]){height:38px;box-sizing:border-box;border-radius:99px;padding:0 14px}
/* 教学进度-添加课程弹窗：课程名称/颜色/学期/班级/科目 统一 高38 + 圆角99 */
form[data-form="course"] .bk-range-trigger{height:38px;border-radius:99px}
form[data-form="course"] input:not([type=hidden]):not([type=checkbox]):not(.bk-trigger-input){height:38px;box-sizing:border-box;border-radius:99px;padding:0 14px}
/* 教学进度-添加课程：颜色弹层紧凑（覆盖全局 min-width:140） */
#crsadd_color_pop{min-width:85px !important;max-width:85px;width:85px}
/* 备课笔记-添加弹窗：课程下拉/标题/标签 统一 高38 + 圆角99；课程框固定80宽，标题填充 */
form[data-form="note"] .bk-range-trigger{height:38px;border-radius:99px}
form[data-form="note"] input[name="title"]{height:38px;box-sizing:border-box;border-radius:99px;padding:0 14px}
form[data-form="note"] .tag-input-wrap{height:auto;min-height:38px;box-sizing:border-box;border-radius:99px;padding:0 14px}
/* 每周复盘-写本周复盘：周次/高光时刻 高38 + 圆角99 */
form[data-form="review"] input[name="week"]:not([type=hidden]):not([type=checkbox]),
form[data-form="review"] input[name="highlight"]:not([type=hidden]):not([type=checkbox]){height:38px;box-sizing:border-box;border-radius:99px;padding:0 14px}
/* 学期设置-设置新学期：学期名称/开始/结束 高38 + 圆角99 */
form[data-form="semester"] input:not([type=hidden]):not([type=checkbox]){height:38px;box-sizing:border-box;border-radius:99px;padding:0 14px}
/* 课表设置-添加课节：学期/班级/星期/节次(×2) 弹层同课表设置-学期；学期/班级/科目/星期/时间/节次 高38+圆角99 */
form[data-form="tt"] .bk-range-trigger{height:38px;border-radius:99px}
form[data-form="tt"] input:not([type=hidden]):not([type=checkbox]):not(.bk-trigger-input){height:38px;box-sizing:border-box;border-radius:99px;padding:0 14px}
/* 教学任务安排-添加教学任务：班级/学期/科目 弹层同课表设置-学期；班级/学期/科目/任务 高38+圆角99 */
form[data-form="plan-add"] .bk-range-trigger{height:38px;border-radius:99px}
form[data-form="plan-add"] input:not([type=hidden]):not([type=checkbox]):not(.bk-trigger-input){height:38px;box-sizing:border-box;border-radius:99px;padding:0 14px}
/* 导入成绩弹窗：bk-range 弹层 + 名称/学期/班级/科目 高 38 + 圆角 99（与教学任务安排-学期同款） */
form[data-form="imp-grade"] .bk-range-trigger{height:38px;border-radius:99px}
form[data-form="imp-grade"] input:not([type=hidden]):not([type=checkbox]):not(.bk-trigger-input){height:38px;box-sizing:border-box;border-radius:99px;padding:0 14px}
/* 教学进度-记录进度：完成时间的日期框 + 时间下拉（bk-range 弹层，与课表设置-学期同款）统一 高38 + 圆角99 */
form[data-form="progress"] .bk-range-wrap{flex:1;min-width:0}
form[data-form="progress"] .bk-range-trigger{height:38px;border-radius:99px}
form[data-form="progress"] input:not([type=hidden]):not([type=checkbox]){height:38px;box-sizing:border-box;border-radius:99px;padding:0 14px}
/* 学情跟进-登记记录：班级/学生/日期/类型/内容 圆角99（高度沿用基础 38）；
   用 form 选择器兜底，避免 id 选择器（#rec_modal_*_wrap）在 mobile 媒体查询下被覆盖 */
form[data-form="rec"] .bk-range-trigger{height:38px;border-radius:99px}
form[data-form="rec"] input:not([type=hidden]):not([type=checkbox]):not(.bk-trigger-input){height:38px;box-sizing:border-box;border-radius:99px;padding:0 14px}
form[data-form="rec"] input[type="date"]{min-height:38px;font-size:13px}

/* 胶囊组合：输入框 + 右侧确认按钮视觉合成一个 pill（学生详情「违纪-输入-确认」用） */
.combo-pill{display:flex;align-items:stretch;border:1px solid var(--border);border-radius:99px;overflow:hidden;background:var(--surface);height:36px;box-sizing:border-box}
.combo-pill>input{flex:1;border:0;background:transparent;padding:0 14px;outline:0;font-size:14px;font-family:inherit;color:var(--text);min-width:0;height:100%}
.combo-pill>input::placeholder{color:var(--text-2)}
.combo-pill>input:focus{outline:0}
.combo-pill>button{flex:none;border:0;border-left:1px solid var(--border);background:rgba(0,0,0,.05);color:var(--text);padding:0 18px;font-size:14px;font-family:inherit;cursor:pointer;min-width:50px;height:100%}
.combo-pill>button:hover{background:rgba(0,0,0,.09)}
.combo-pill>button:focus-visible{outline:2px solid var(--primary);outline-offset:-2px}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .wd{text-align:center;font-size:12px;color:var(--text-2);padding:4px 0}
.cal .day{aspect-ratio:1;border-radius:9px;background:var(--surface-2);display:flex;flex-direction:column;
  align-items:center;justify-content:flex-start;padding-top:7px;font-size:13px;position:relative;cursor:pointer;border:none;color:var(--text);overflow:hidden}
.cal .day.muted{opacity:.35}
.cal .day.today{outline:2px solid var(--primary)}
.cal .day .day-dots{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;margin-top:5px;line-height:1}
.cal .day .day-dot{width:7px;height:7px;border-radius:50%;background:var(--primary)}
.cal .day .day-dot.due{background:var(--danger)}
.cal .day .day-dot.more{width:auto;height:auto;background:transparent;color:var(--text-2);font-size:9px;padding:0 1px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head .btn.sm{height:26px;padding:0 11px;font-size:10px;line-height:1;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box}
.cal-head .btn.sm svg{width:10px;height:10px;display:block}

.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.stat .num{font-size:26px;font-weight:700}
.stat .lab{color:var(--text-2);font-size:13px}
.stat .num.warn{color:var(--warn)} .stat .num.danger{color:var(--danger)} .stat .num.ok{color:var(--ok)}

/* small square stats —— 桌面：固定宽度小方块横排（非均分） */
.statsq{display:flex;flex-wrap:wrap;gap:10px}
.sq{border-radius:14px;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:6px;border:none;aspect-ratio:1/1;flex:0 0 auto;width:88px;overflow:hidden}
.sq .n{font-size:22px;font-weight:700;line-height:1.1;width:100%;text-align:center}
.sq .n[data-t10]{font-size:16px}
.sq .n.warn{color:var(--warn)} .sq .n.danger{color:var(--danger)} .sq .n.ok{color:var(--ok)}
.sq .l{font-size:12px;color:var(--text-2);line-height:1;margin-top:4px;width:100%;text-align:center}
/* 学生·科目·历次成绩 弹窗 statsq：三个统一 60×60 小方（去掉横向加宽与尺寸不一致） */
.statsq.history .sq{width:60px;height:60px;aspect-ratio:1/1;padding:6px;overflow:hidden}
.statsq.history .sq.big{width:60px;aspect-ratio:1/1}
.statsq.history .sq .n{font-size:18px;font-weight:700;line-height:1.1}
.statsq.history .sq .l{font-size:11px;line-height:1.2;margin-top:2px;width:100%;text-align:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.statsq.history .sq .l.exn{white-space:nowrap}
/* 学生·科目·历次成绩 表格：列间距 4（覆盖全局 th,td 的 padding 12 → 4） */
.stu-history-table th,.stu-history-table td{padding:10px 4px}
.stu-history-table th[data-action="history-sort"]{cursor:pointer;user-select:none;transition:background .12s}
.stu-history-table th[data-action="history-sort"]:hover{background:var(--primary-soft)}
.stu-history-table th[data-action="history-sort"].active{color:var(--primary)}
.stu-history-table th .h-ord{font-size:10px;color:var(--primary);margin-left:3px;font-weight:600}
/* 成绩分析-趋势/科目 概览数字统一 24（含 TOP10 文本与小方块计数） */
.statsq.event .sq .n,.statsq.subject .sq .n{font-size:24px}
.statsq.event .sq.big .n,.statsq.subject .sq.big .n{font-size:24px !important}
.statsq.event .sq .n[data-t10],.statsq.subject .sq .n[data-t10]{font-size:18px}
/* 成绩分析-趋势：平均分/参考人数、科目页 平均分/最高分 数字均放大到 28——已被上方 24 !important 覆盖，规则保留以备回退 */
.statsq.event .sq.big.avg .n,.statsq.event .sq.big.ref .n,
.statsq.subject .sq.big .n{font-size:28px}
/* 大块数字与副标签（考试名/学生名）间距 6px */
.statsq.subject .sq.big .l+.l,.statsq.event .sq.big.avg .l+.l{margin-top:6px}
/* 学情跟进-学生：当前积分/考试均分 数字放大到 28 */
.statsq.detail .sq.big .n{font-size:28px}
.statsq.event .sq .l,.statsq.subject .sq .l{font-size:13px;margin-top:5px}
.statsq.event .sq .n[data-t10],.statsq.subject .sq .n[data-t10]{font-size:18px}
/* 桌面默认隐藏手机专用块 */
.only-mobile{display:none}
/* 手机（<=640px）：成绩分析-趋势等通用 statsq → 左 1 大 2×2 方块 + 右 2×2 共 4 小块 */
@media(max-width:640px){
  /* 手机：考试事件维度 6 块 → 6 列 × 2 行
     左 2 大块各占 2 列 × 2 行 = 2X×2X 正方形
     右 4 小块各占 1 列 × 1 行 = X×X 正方形
     ★ 尺寸锁死（v70 校验，勿改比例）：
         aspect-ratio 必须等于 cols/rows = 6/2 = 3/1
         推导：容器 H=W/ratio，col=(W-gap*(cols-1))/cols，row=(H-gap*(rows-1))/rows
               col:row ≈ 1（偏差<6% @360/414px）→ 全正方形
         反向防护：禁止 3/2（会让 event 变 1:2 瘦长） */
  .statsq.event{aspect-ratio:3/1;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(2,1fr);gap:6px}
  /* 考试事件维度：左 2 大块（平均分/参考人数）各占 2 列 × 2 行 */
  .statsq.event .sq.big.avg{grid-column:1/span 2;grid-row:1/span 2}
  .statsq.event .sq.big.ref{grid-column:3/span 2;grid-row:1/span 2}
  /* 手机：科目维度 6 块 → 与趋势页一致 6 列 × 2 行
     左 2 大块（平均分/最高分）各占 2 列 × 2 行 = 2X×2X 正方形
     右 4 小块（进步/退步/优秀/未及格）各占 1 列 × 1 行 = X×X 正方形
     ★ 尺寸锁死（v70 校验，勿改比例）：
         aspect-ratio 必须等于 cols/rows = 6/2 = 3/1 → col:row ≈ 1（全正方形）
         反向防护：禁止 2/1（会让 subject 变 2×1 扁块，与 event 不一致） */
  .statsq.subject{aspect-ratio:3/1;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(2,1fr);gap:6px}
  .sq{flex:none;width:auto;min-width:0;aspect-ratio:1/1;padding:8px 6px;border-radius:12px;justify-content:center}
  .sq.big{aspect-ratio:1/1}
  .sq.big .n{font-size:20px;font-weight:700;line-height:1.15}
  .sq.big .l{font-size:11px;margin-top:2px}
  .sq .n{font-size:18px;font-weight:700;line-height:1.15}
  .sq:not(.big) .n{font-size:14px}
  .sq .n[data-t10]{font-size:12px}
  .sq .l{font-size:10px;margin-top:4px}
  .sq.avg .n,.sq.ref .n{font-size:18px}
  /* 成绩分析：趋势/科目页概览（手机）数字与标签放大 */
  .statsq.event .sq .n,.statsq.subject .sq .n{font-size:23px}
  .statsq.subject .sq.big .n{font-size:28px}
  .statsq.event .sq.big.avg .n,.statsq.event .sq.big.ref .n{font-size:28px}
  .statsq.subject .sq.big .l+.l,.statsq.event .sq.big.avg .l+.l{margin-top:6px}
  .statsq.event .sq .l,.statsq.subject .sq .l{font-size:11px;margin-top:3px}
  .statsq.event .sq .n[data-t10],.statsq.subject .sq .n[data-t10]{font-size:15px}
  .sq.hide-mobile{display:none}
  /* 科目页：手机 only-mobile 大块（平均分 col1-2 / 最高分 col3-4，均 row1-2）
     精确位置改在 HTML inline style 写死；此处仅作兜底 display:flex */
  .statsq.subject .sq.only-mobile{grid-column:1/span 2;grid-row:1/span 2;display:flex}
  /* 学生详情方块：与趋势/科目页一致 6 列 × 2 行
     左 2 大块（当前积分/考试均分）各占 2 列 × 2 行 = 2X×2X 正方形
     右 4 小块（答题/作业/违纪/其他）各占 1 列 × 1 行 = X×X 正方形
     ★ 尺寸锁死（v70 校验，勿改比例）：
         aspect-ratio 必须等于 cols/rows = 6/2 = 3/1 → col:row ≈ 1（全正方形） */
  .statsq.detail{aspect-ratio:3/1;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(2,1fr);gap:6px}
  .statsq.detail .sq{flex:none;width:auto;min-width:0;aspect-ratio:1/1;padding:8px 6px;border-radius:12px;justify-content:center}
  .statsq.detail .sq.big .n{font-size:28px;font-weight:700;line-height:1.15}
  .statsq.detail .sq.big .l{font-size:11px;margin-top:2px}
  .statsq.detail .sq:not(.big) .n{font-size:16px;font-weight:700;line-height:1.15}
  .statsq.detail .sq:not(.big) .l{font-size:10px;line-height:1.2;margin-top:2px}
  #grade_head>div.field{min-width:0}
  #grade_head select{min-width:0}
  #grade_head .bk-range-trigger{padding:0 20px 0 12px}
}

<script>


/* ============ store ============ */
const PREFIX='tw_';
const HAS_XLSX = typeof XLSX !== 'undefined';
const store={
  get(k,d){try{const v=localStorage.getItem(PREFIX+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){localStorage.setItem(PREFIX+k,JSON.stringify(v));}
};
const DEFAULTS={
  todos:[],courses:[],notes:[],classes:[],students:[],violations:[],homeworks:[],answers:[],
  reviews:[],subjects:[],exams:[],timetable:[],plan:[],archives:[],examPoints:[],
  gradeArchives:[],ttArchives:[],planArchives:[],semArchives:[],fullArchives:[],backups:[],todoArchives:[],noteArchives:[],reviewArchives:[],
  draw:{mode:'name',classId:'',count:1,repeat:false,groupCount:2,cond:{type:'none',subjectId:'',min:'',max:''},drawn:[]},
  rules:{violation:-2,hwDone:1,hwLate:-1,hwMiss:-2,hwExcellent:3,hwPoor:-1,drawCorrect:1,drawWrong:-1,drawNone:0},
  examRules:{topCount:10,topBase:10,failPts:-2,belowAvgPts:-1,progCount:10,progBase:5,dropCount:10,dropBase:5},
  customRules:[],
  ruleEnabled:true,examRuleEnabled:true,
  settings:{semStart:'',semEnd:'',ttCal:true,autoArchive:true,autoCats:{sem:true,teach:true,class:true,grade:true}},
  semesters:[],planRange:{mode:'sem',from:'',to:''},
  theme:'light',seeded:false,seedVer:0,_drawDrawn:[],_drawHistory:[],_drawFold:{week:true,older:true},_savedAt:0,
  _tomb:{},_syncIds:{},_syncVer:0
};
const SEED_VER=3;
/* ============ 多端「按条目合并」同步（r93 方案 B） ============
 * 核心：不再整体 last-write-wins 覆盖，而是按集合 id 取并集；同 id 冲突取保存时间较新的一方；
 *       删除通过墓碑(_tomb)跨端传播，避免「A 删了 B 又复活」。
 * 仅对带稳定 id 的实体集合做合并；_drawDrawn/_drawHistory 为 {name,time} 无 id 数组，排除（按较新端整体覆盖）。 */
const DATA_COLLS=['todos','courses','notes','classes','students','violations','homeworks','answers','reviews','subjects','exams','timetable','plan','archives','examPoints','gradeArchives','ttArchives','planArchives','semArchives','fullArchives','backups','todoArchives','noteArchives','reviewArchives','semesters'];
function clone(o){return JSON.parse(JSON.stringify(o));}
function syncIdsSnapshot(st){const m={};DATA_COLLS.forEach(k=>{m[k]=(st[k]||[]).filter(x=>x&&x.id).map(x=>x.id);});return m;}
function refreshSyncIds(){S._syncIds=syncIdsSnapshot(S);}
function refreshLocalTomb(){const cur=syncIdsSnapshot(S);for(const a in S._tomb){if(!S._tomb[a]||!S._tomb[a].length){delete S._tomb[a];continue;}S._tomb[a]=S._tomb[a].filter(id=>(cur[a]||[]).indexOf(id)<0);if(!S._tomb[a].length)delete S._tomb[a];}}
function tombUnion(a,b){const m={};[a,b].forEach(t=>{if(!t)return;for(const k in t){const arr=t[k]||[];m[k]=(m[k]||[]).concat(arr);}});for(const k in m)m[k]=[...new Set(m[k])];return m;}
function mergeState(local,remote){
  const out=clone(remote);
  const lw=(local._savedAt||0)>=(remote._savedAt||0);
  const tomb=tombUnion(local._tomb,remote._tomb);
  const SKIP=new Set(['_tomb','_syncIds','_syncVer','_savedAt']);
  // 非集合字段：取较新一侧；若较新侧缺该字段（如某端版本新增键），回退到另一侧，避免被 undefined 覆盖
  for(const k in DEFAULTS){if(DATA_COLLS.indexOf(k)>=0||SKIP.has(k))continue;const wv=(lw?local:remote)[k],ov=(lw?remote:local)[k];out[k]=wv!==undefined?wv:ov;}
  // 集合：按 id 并集 + 同 id 较新者 + 墓碑项移除
  DATA_COLLS.forEach(k=>{
    const L=local[k]||[],R=remote[k]||[],tb=tomb[k]||[],map={},noId=[];
    R.forEach(x=>{if(x&&x.id){if(tb.indexOf(x.id)<0&&!map[x.id])map[x.id]=x;}else if(x)noId.push(x);});
    L.forEach(x=>{if(x&&x.id){if(tb.indexOf(x.id)<0){if(!map[x.id])map[x.id]=x;else map[x.id]=lw?x:map[x.id];}}else if(x)noId.push(x);});
    out[k]=Object.keys(map).map(id=>map[id]).concat(noId);
  });
  out._tomb=tomb;
  out._syncIds=local._syncIds||remote._syncIds||{};
  out._syncVer=1;
  out._savedAt=Math.max(local._savedAt||0,remote._savedAt||0);
  out.examPoints=out.examPoints||[];
  return out;
}
/* 把远端合并进全局 S（就地），落盘并刷新同步基线/墓碑；返回合并后的状态 */
function applyMerge(remote){
  const m=mergeState(S,remote);
  Object.assign(S,m);
  for(const k in DEFAULTS)store.set(k,S[k]);
  refreshSyncIds();refreshLocalTomb();
  return m;
}
const S={};
function load(){for(const k in DEFAULTS)S[k]=store.get(k,DEFAULTS[k]);
  S._drawFold=S._drawFold||{};if(S._drawFold.week!==false)S._drawFold.week=true;if(S._drawFold.older!==false)S._drawFold.older=true;
  // 迁移：为历史教学任务补上所属学期，便于按学期筛选
  const cs=curSem();if(cs&&S.plan)S.plan.forEach(p=>{if(!p.sem)p.sem=cs.id;});
  /* r73 迁移：为历史考试记录补上 sem（r66 旧版归组不依赖 sem，但 r73 起按 (标题+学期+时间) 归组，
   *       未设 sem 的旧记录会被误分到 '' 这一组，与新记录分开。统一回填为当前学期 id，
   *       让同堂考试（无论新旧导入）合并为同一事件）。 */
  if(cs&&S.exams)S.exams.forEach(e=>{if(!e.sem)e.sem=cs.id;});
  /* r74 迁移：dayNum('周日') 由 7 改为 0（与 modalTt/ttMatrixHtml 的 0 索引对齐），
   *       之前导入的周日记录 day=7 会被 ttMatrixHtml 当作 "周八" 忽略。
   *       只在确有残留时写盘以免触发云同步。 */
  if(S.timetable&&S.timetable.some(t=>t&&t.day===7)){S.timetable.forEach(t=>{if(t&&t.day===7)t.day=0;});save();}
  migrateTodos();normalizeTodos();normalizeStudentItems();
  // r93：首次启动把当前各集合 id 快照作为合并基线，避免把已有数据误判为「被删除」而清空其他端的同名条目
  if(!S._syncVer){S._syncIds=syncIdsSnapshot(S);S._syncVer=1;}
}
// 将历史 S.tasks / S.deadlines 合并进统一的 S.todos（带 type 字段）
function migrateTodos(){
  const lt=store.get('tasks',null),ld=store.get('deadlines',null);
  if(Array.isArray(lt)||Array.isArray(ld)){
    const out=[];
    (lt||[]).forEach(t=>out.push({id:t.id||uid(),type:'task',title:t.title,pri:t.pri||'中',status:t.done?'done':'active',note:t.note||'',repeat:null}));
    (ld||[]).forEach(d=>out.push({id:d.id||uid(),type:'deadline',title:d.title,due:d.due,cat:d.cat||'其他',pri:d.pri||'中',status:d.done?'done':'active',repeat:null}));
    S.todos=out;
    save();
    try{localStorage.removeItem(PREFIX+'tasks');localStorage.removeItem(PREFIX+'deadlines');}catch(e){}
  }
}
// 学情跟进：把历史 followUp/contact 单字符串迁移为 todoItems/contactItems 多条目数组（每学生仅迁移一次）
function normalizeStudentItems(){
  if(!Array.isArray(S.students))return;
  S.students.forEach(s=>{
    if(!Array.isArray(s.todoItems))s.todoItems=[];
    if(!Array.isArray(s.contactItems))s.contactItems=[];
    if(s.followUp && !s._migFu){
      const txt=String(s.followUp).trim();
      if(txt)s.todoItems.push({id:uid(),text:txt,createdAt:todayISO(),processed:false,processedAt:null,notes:[]});
      s._migFu=true;
    }
    if(s.contact && !s._migCt){
      const txt=String(s.contact).trim();
      if(txt)s.contactItems.push({id:uid(),text:txt,createdAt:todayISO(),processed:false,processedAt:null,notes:[]});
      s._migCt=true;
    }
    if(s._migFu||s._migCt){s.followUp='';s.contact='';}
  });
}
// 关闭态（完成/放弃）距今天数：无 closedAt 的旧数据视为已归档（返回足够大的过去值）
function daysSinceClosed(t){if(!t.closedAt)return 9999;const d=daysLeft(t.closedAt);return d<=0?(-d):0;}
const ARCHIVE_DAYS=30; // 关闭满 30 天自动归入折叠归档
// 规范化：补齐 status / type / repeat / closedAt / doneDate；并把逾期的活跃截止日自动归类为「未完成」
function normalizeTodos(){
  if(!Array.isArray(S.todos))S.todos=[];
  S.todos.forEach(t=>{
    if(t.status===undefined)t.status=(t.done?'done':'active');
    delete t.done;
    if(t.type!=='deadline'&&t.type!=='task')t.type='task';
    if(t.repeat===undefined)t.repeat=null;
    // 关闭态（done/abandoned）补齐 closedAt + 完成时间 doneDate，确保折叠里也能显示「完成于/放弃于」
    if(t.status==='done'||t.status==='abandoned'){
      // closedAt 兜底：升级前已有 doneDate 的旧数据，用 doneDate 作为关闭时间
      if(!t.closedAt&&t.doneDate)t.closedAt=t.doneDate;
      // doneDate 兜底：升级前完成的旧数据（无 doneDate 字段），用 closedAt 或 30 天前作为完成日期，确保折叠里能显示
      if(t.status==='done'&&!t.doneDate)t.doneDate=t.closedAt||shiftDays(-ARCHIVE_DAYS);
      // abandoned 旧数据无任何时间字段的，给一个早期日期让它合理归档
      if(t.status==='abandoned'&&!t.closedAt&&!t.doneDate)t.closedAt=shiftDays(-ARCHIVE_DAYS);
    }
  });
  classifyTodos();
}
function classifyTodos(){
  S.todos.forEach(t=>{
    if(t.status==='active'&&t.type==='deadline'&&t.due&&daysLeft(t.due)<0)t.status='abandoned';
  });
}
function isOtherCat(c){return c==='其他'||!['任务','教学','工作','学生','活动','生活','其他'].includes(c);}
function save(){
  S._savedAt=Date.now();
  // r93：比对当前 id 与上次同步基线，把被删除的条目写入墓碑(_tomb)，用于跨端删除同步
  if(S._syncIds){
    DATA_COLLS.forEach(k=>{
      const cur=(S[k]||[]).filter(x=>x&&x.id).map(x=>x.id);
      const removed=(S._syncIds[k]||[]).filter(id=>cur.indexOf(id)<0);
      if(removed.length){S._tomb[k]=(S._tomb[k]||[]).concat(removed);S._tomb[k]=[...new Set(S._tomb[k])];}
    });
  }
  S._syncIds=syncIdsSnapshot(S);
  refreshLocalTomb();
  for(const k in DEFAULTS)store.set(k,S[k]);
  cloudDirty=true;setCloudDirtyFlag(true);scheduleCloudPush();
}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const shiftDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
/* 归档/备份的范围维度；教学待办/备课笔记/每周复盘 不受班级限制（选中后班级自动空白） */
const BK_RANGES=[{k:'all',label:'全部内容'},{k:'progress',label:'教学进度'},{k:'follow',label:'学情跟进'},{k:'grades',label:'成绩统计'},{k:'sem',label:'学期设置'},{k:'todo',label:'教学待办'},{k:'note',label:'备课笔记'},{k:'review',label:'每周复盘'}];

const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function daysLeft(iso){if(!iso)return null;const a=new Date(todayISO()),b=new Date(iso);return Math.round((b-a)/86400000);}
const cls=id=>S.classes.find(c=>c.id===id);
const stu=id=>S.students.find(s=>s.id===id);

/* ============ seed ============ */
function seed(){

    mk('冯雪',c2.id,19,false),mk('蒋琳',c2.id,14,false),mk('韩磊',c2.id,8,false),mk('沈悦',c2.id,21,true),
    mk('许阳',c3.id,13,false),mk('何静',c3.id,25,false),mk('吕强',c3.id,4,true),mk('施敏',c3.id,16,false),
    mk('孔杰',c3.id,11,false),mk('曹颖',c3.id,20,false),mk('严斌',c3.id,7,false),mk('华雯',c3.id,18,false)
  ];
  S.courses=[
    {id:uid(),name:'高一数学',cls:c1.name,progress:62,next:'完成函数单调性习题讲评',color:'#4f6bed',nextTask:'',unfinished:[],progressLog:[{date:'2026-07-20',pct:30,note:'新授课'},{date:'2026-08-05',pct:62,note:'习题课'}]},
    {id:uid(),name:'高一英语',cls:c1.name,progress:45,next:'准备阅读课分组材料',color:'#1faa6b',nextTask:'',unfinished:[],progressLog:[{date:'2026-07-22',pct:20,note:'词汇'},{date:'2026-08-06',pct:45,note:'阅读'}]},

  ];
  S.todos=[
    {id:uid(),type:'task',title:'批改第3章课后习题',cat:'任务',pri:'高',status:'active',note:'共42本',repeat:null},
    {id:uid(),type:'task',title:'备课：函数单调性教案',cat:'任务',pri:'中',status:'active',note:'',repeat:null},

    {id:uid(),type:'task',title:'编写单元测试卷',cat:'教学',pri:'高',status:'active',note:'覆盖前三章',repeat:null},
    {id:uid(),type:'task',title:'录制微课视频',cat:'教学',pri:'中',status:'active',note:'10分钟内',repeat:null},

function setActive(r){

}

/* 自定义 combobox：复用 bk-range 弹层（与 班级/学期 等下拉同款）。下拉始终展示全部选项，可键入自定义值。 */
function comboHTML(name,value,opts,ph){
  const id=name;
  const v=value||'';
  /* 选项 onClick: 通过 bkSelPick('comboPick', val) 回填到对应 input；val 不做 HTML 转义（受控于 opts 来自 subject 列表） */
  const optHtml=opts.map(o=>{
    const safe=String(o).replace(/'/g,"\\'");
    const sel=(o===v)?'background:var(--primary-soft);color:var(--primary);font-weight:600':'';
    return `<div class="bk-range-opt" data-v="${esc(o)}" onclick="comboPick('${id}','${safe}')" style="${sel}">${esc(o)}</div>`;
  }).join('');
  return `<div class="bk-range-wrap" id="${id}_wrap"><div class="bk-range-trigger rec-type-combo" onclick="bkSelOpen('${id}_pop',event)"><input name="${name}" class="bk-trigger-input" autocomplete="off" placeholder="${esc(ph||'')}" value="${esc(v)}" onclick="event.stopPropagation()" onfocus="comboFocus('${id}_pop')"></div><div class="bk-range-pop" id="${id}_pop" style="display:none">${optHtml}</div></div>`;
}
function comboFocus(pid){const p=document.getElementById(pid);if(p&&p.style.display!=='block'){bkSelOpen(pid,{stopPropagation:function(){},target:null});}}
function comboPick(id,v){const wrap=document.getElementById(id+'_wrap');if(!wrap)return;const inp=wrap.querySelector('input[name="'+id+'"]');if(inp)inp.value=v;closeAllBkPops();const inModal=wrap.closest('.modal');}

function hexA(h,a){h=(h||'#000').replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);return `rgba(${r},${g},${b},${a})`;}
function startOfWeek(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const dow=(x.getDay()+6)%7;x.setDate(x.getDate()-dow);return x;}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
/* 条件1：最近一次考试（同科目）退步最多的前 k 位学生 */
function topDeclineStudentIds(k){
  const bySubj={};
  S.exams.forEach(e=>{if(!e||!e.subjectId||!e.scores)return;(bySubj[e.subjectId]=bySubj[e.subjectId]||[]).push(e);});
  Object.values(bySubj).forEach(arr=>arr.sort((a,b)=>a.date.localeCompare(b.date)));
  const cand=[];
  S.students.forEach(s=>{
    let last=null;
    S.exams.forEach(e=>{if(e.scores&&e.scores[s.name]!=null){if(!last||e.date>last.date)last=e;}});
    if(!last)return;
    const arr=bySubj[last.subjectId]||[];let prev=null;
    for(const e of arr){if(e===last)break;if(e.scores&&e.scores[s.name]!=null)prev=e;}
    if(!prev)return;
    const decline=prev.scores[s.name]-last.scores[s.name];
    if(decline>0)cand.push({id:s.id,decline});
  });
  cand.sort((a,b)=>b.decline-a.decline);
  return cand.slice(0,k).map(c=>c.id);
}
/* 条件2：本周积分较上周差值最大的前 k 位学生（积分事件含违纪/作业/答题/考试积分，自然周·周一为界） */
function topWeeklyDiffStudentIds(k){
  const now=new Date();const thisMonday=startOfWeek(now);const lastMonday=addDays(thisMonday,-7);const nextMonday=addDays(thisMonday,7);
  function bk(ds){if(!ds)return 0;const d=new Date(ds+'T00:00:00');if(d>=thisMonday&&d<nextMonday)return 2;if(d>=lastMonday&&d<thisMonday)return 1;return 0;}
  const sum={};
  function add(sid,ds,delta){if(!sid)return;sum[sid]=sum[sid]||{t:0,l:0};const b=bk(ds);if(b===2)sum[sid].t+=delta;else if(b===1)sum[sid].l+=delta;}
  (S.violations||[]).forEach(v=>add(v.studentId,v.date,v.delta||0));
  (S.homeworks||[]).forEach(h=>add(h.studentId,h.date,h.delta||0));
  (S.answers||[]).forEach(a=>add(a.studentId,a.date,a.delta||0));
  (S.examPoints||[]).forEach(p=>add(p.studentId,p.date,p.delta||0));
  const cand=Object.keys(sum).map(sid=>({id:sid,diff:sum[sid].t-sum[sid].l}));
  cand.sort((a,b)=>b.diff-a.diff);
  return cand.slice(0,k).map(c=>c.id);
}
/* 生成重点学生：满足 1/2/3 任一且今天有课；返回 [{s,n}]，n=满足的条件数（1~3） */
function homeFocusStudents(){
  const dSet=new Set(topDeclineStudentIds(5));
  const wSet=new Set(topWeeklyDiffStudentIds(5));
  const cSet=new Set(S.students.filter(s=>s.concern).map(s=>s.id));
  const todayClasses=new Set(ttForDay(jsDay()).map(t=>t.classId));
  const res=[];
  S.students.forEach((s,i)=>{
    let n=0;if(dSet.has(s.id))n++;if(wSet.has(s.id))n++;if(cSet.has(s.id))n++;
    if(n>=1&&todayClasses.has(s.classId))res.push({s,n,idx:i});
  });
  res.sort((a,b)=>b.n-a.n||a.idx-b.idx);
  return res.map(r=>({s:r.s,n:r.n}));
}

function homeToggleTodo(id,rowEl){

  else if(closed){closed.remove();}
  // 弹入动画（约 240ms）在点击位置播放后：完成则下沉+淡出并从首页列表移除；取消完成则上浮回顶部
  const isDone=x.status==='done';
  setTimeout(()=>{
    const list=document.querySelector('.home-todo-list');
    if(!list)return;
    if(madeRepeat){list.innerHTML=homeTodoListHtml();return;}
    if(!isDone){ // 取消完成：上浮回顶部（若期间被重渲染则按数据重建）
      if(rowEl&&rowEl.isConnected)list.insertBefore(rowEl,list.firstChild);
      else list.innerHTML=homeTodoListHtml();
      return;
    }
    // 完成：先下沉到底部，再淡出移除（在首页列表消失）
    if(rowEl&&rowEl.isConnected){
      list.appendChild(rowEl);
      requestAnimationFrame(()=>{
        rowEl.style.transition='transform .28s ease, opacity .28s ease';
        rowEl.style.transform='translateY(10px)';
        rowEl.style.opacity='0';
      });
      setTimeout(()=>{ if(rowEl&&rowEl.parentNode)rowEl.remove(); }, 320);
    }else{ // 兜底：期间列表被重渲染、旧节点已脱离，按数据重建（完成项不再出现）
      list.innerHTML=homeTodoListHtml();
    }
  },300);
}
// 教学待办页：单击整行就地切换完成/激活（与首页逻辑同思路——避免整页重渲染把勾选行甩到别处、动画在别处播放）
// 复选框 .task .check.done 的 htpop 弹入动画在【点击处】原地播放，使「勾选完成」看得见
// 机制：在【已存在的行元素】上原地改 class（与首页 homeTodoRow/.ht-check.done 完全一致，已验证稳定生效）；
// 仅给【刚勾选】那一行复选框加 done 类触发一次弹入；todoRow 静态渲染不写 done 类 → 列表加载/重渲染不会误触发
function taskToggleTodo(id,el){
  const x=S.todos.find(y=>y.id===id);if(!x)return;
  const wasDone=x.status==='done';
  x.status=wasDone?'active':'done';
  if(x.status==='done'){if(!x.doneDate)x.doneDate=todayISO();x.closedAt=todayISO();}else{x.doneDate='';x.closedAt='';}
  const madeRepeat=!wasDone&&x.status==='done'&&x.repeat;
  if(madeRepeat)S.todos.unshift(nextRepeat(x));
  save();
  const row=el&&el.closest?el.closest('.task'):null;
  if(!row||madeRepeat){viewReload(curView());return;} // 无行引用/含重复项 → 整页重渲染
  // 原地修改【已存在】的行：.task.done 触发标题划线 + 复选框配色；复选框自身 .check.done 触发 htpop 弹入（落点位置）
  row.classList.toggle('done',x.status==='done');
  row.classList.toggle('abandoned',x.status==='abandoned');
  const chk=row.querySelector('.check');
  if(chk){
    chk.textContent=x.status==='done'?'✓':'';
    chk.classList.toggle('done',x.status==='done'); // 复选框自身带 done → 触发 htpop 弹入（与首页 .ht-check.done 同机制）
  }
  // 弹入动画（约 240ms）播完后，再重渲染列表容器 → 完成项下沉底部 / 取消完成上浮回正确时间序位置，
  // 同时补齐 完成时间徽章 与 操作按钮 的状态切换
  setTimeout(()=>{
    const host=document.querySelector('.todo-list-host');if(!host)return;
    host.innerHTML=todoListHtml();
  },420);
}
// 关闭态（完成/放弃）距今天数：无 closedAt 的旧数据视为已归档（返回足够大的过去值）
// 主列表：活跃 + 关闭未满 ARCHIVE_DAYS 天（近期关闭仍显示）
function sortTodos(arr){
  const visible=arr.filter(t=>{
    if(t.status==='active')return true;
    if(t.status==='done'||t.status==='abandoned')return daysSinceClosed(t)<ARCHIVE_DAYS;
    return false;
  });
  const active=visible.filter(t=>t.status==='active'),recent=visible.filter(t=>t.status!=='active');
  const dls=active.filter(t=>t.type==='deadline').sort((a,b)=>{const x=daysLeft(a.due),y=daysLeft(b.due);return (x==null?1e9:x)-(y==null?1e9:y);});
  const tks=active.filter(t=>t.type==='task');
  return dls.concat(tks).concat(recent);
}
// 重复项勾掉后，自动生成下一次（按 N 日/月/年 推进；有截止日则推进截止日，否则仅重新生成）
function nextRepeat(x){
  const o={id:uid(),type:x.type,title:x.title,pri:x.pri,cat:x.cat,repeat:x.repeat,status:'active',note:x.note||''};
  if(x.repeat)o.due=advanceDate(x.due||todayISO(),x.repeat);
  return o;
}
function advanceDate(iso,rep){if(!rep)return iso;const d=new Date(iso);
  if(rep.unit==='日')d.setDate(d.getDate()+rep.n);
  else if(rep.unit==='月')d.setMonth(d.getMonth()+rep.n);
  else if(rep.unit==='年')d.setFullYear(d.getFullYear()+rep.n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

/* 按截止日判断该代办属于哪个学期（落在学期 start~end 区间内）；无截止日或区间外返回 null */
function semOfDate(iso){
  if(!iso)return null;
  for(const s of S.semesters){ if(s.start&&s.end&&iso>=s.start&&iso<=s.end) return s; }
  return null;
}

/* 教学待办：当前筛选/搜索条件下的待办列表 HTML（含按学期折叠 + 归档折叠）
   抽离出来供 viewTodos 整页渲染、也供 taskToggleTodo 仅重渲染列表容器（保留工具栏/滚动），
   使勾选完成的行按 sortTodos 下沉到底部、取消完成的行上浮回正确时间序位置 */
function todoListHtml(){
  const stdCats=['任务','教学','工作','学生','活动','生活','其他'];
  let tab=S._todoTab||'all';
  if(tab!=='all'&&tab!=='done'&&tab!=='其他'&&!stdCats.includes(tab))tab='all';
  let list;
  if(tab==='all')list=S.todos;
  else if(tab==='done')list=S.todos.filter(x=>x.status==='done');
  else if(tab==='其他')list=S.todos.filter(x=>isOtherCat(x.cat));
  else list=S.todos.filter(x=>x.cat===tab);
  // 搜索过滤（标题包含关键词，大小写不敏感）
  const q=(S._todoSearch||'').toLowerCase().trim();
  if(q)list=list.filter(t=>(t.title||'').toLowerCase().includes(q));
  const disp=sortTodos(list);
  let listHtml;
  if(!disp.length){listHtml=emptyState('📋','这里空空如也，点「待办」加一条');}
  else{
    // 按学期折叠：仅「已结束(结束日<今天)」的学期才折叠成组；
    // 当前(未结束)学期、无截止日、未来日期的任务一律保持平铺(之前的状态)
    const todayIso=todayISO();
    const pastGroups={};   // 已结束学期 id -> 任务[]
    const flat=[];         // 平铺(当前/无截止日/未来)
    disp.forEach(t=>{
      const s=semOfDate(t.due);
      if(s && s.end && s.end < todayIso){(pastGroups[s.id]=pastGroups[s.id]||[]).push(t);}
      else flat.push(t);
    });
    listHtml=flat.map(t=>todoRow(t)).join('');
    const pastKeys=Object.keys(pastGroups).sort((a,b)=>{
      const sa=S.semesters.find(s=>s.id===a),sb=S.semesters.find(s=>s.id===b);
      return (sb&&sb.end||'').localeCompare((sa&&sa.end||''));
    });
    pastKeys.forEach(k=>{
      const s=S.semesters.find(x=>x.id===k);if(!s)return;
      const id='todo_sem_'+k;
      const body=pastGroups[k].map(t=>todoRow(t)).join('');
      const title=`${iconSvg('📅',16)}${esc(s.name)} · 最后一天 ${esc(s.end||'—')} <span class="count">${pastGroups[k].length} 项</span>`;
      listHtml+=todoGroupBlock(id,title,body,false); // 已结束默认折叠
    });
    // 关闭满 ARCHIVE_DAYS 天的任务，按"已完成 / 未完成或放弃"分入两个归档折叠（默认收起）
  }
  // 归档折叠：用 list（tab/搜索过滤后的全集），独立于主列表是否为空
  {
    const archived=list.filter(t=>(t.status==='done'||t.status==='abandoned')&&daysSinceClosed(t)>=ARCHIVE_DAYS);
    if(archived.length){
      const doneArch=archived.filter(t=>t.status==='done').sort((a,b)=>(b.closedAt||'').localeCompare(a.closedAt||''));
      const abArch=archived.filter(t=>t.status==='abandoned').sort((a,b)=>(b.closedAt||'').localeCompare(a.closedAt||''));
      if(doneArch.length){
        const body=doneArch.map(t=>todoRow(t)).join('');
        const title=`✓ 已完成 <span class="count">${doneArch.length} 项 · ${ARCHIVE_DAYS}天前归档</span>`;
        listHtml+=todoGroupBlock('todo_arch_done',title,body,false);
      }
      if(abArch.length){
        const body=abArch.map(t=>todoRow(t)).join('');
        const title=`🚫 未完成或放弃 <span class="count">${abArch.length} 项 · ${ARCHIVE_DAYS}天前归档</span>`;
        listHtml+=todoGroupBlock('todo_arch_ab',title,body,false);
      }
    }
  }
  return listHtml;
}

function stuPointsColor(rank,size){
  if(!rank)return 'color:#4F6BED;background:#4F6BED1F';

  const botOrange=Math.ceil(size*0.2);
  if(rank<=topN)return 'color:#2BA24C;background:#2BA24C1F';
  if(rank>size-botRed)return 'color:#E5484D;background:#E5484D1F';

}
