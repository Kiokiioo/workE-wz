function buildStuListInner(){
  const nonArch=S.classes.filter(c=>!c.archived);
  const clsId=(S._stuCls&&(S._stuCls==='all'||nonArch.some(c=>c.id===S._stuCls)))?S._stuCls:'all';
  const q=(S._stuSearch||'').trim().toLowerCase();
  let list = q ? S.students.filter(s=>s.name.toLowerCase().includes(q))
               : S.students.filter(s=>clsId==='all'||s.classId===clsId);
  const byClass={};
  S.students.forEach(x=>{if(!byClass[x.classId])byClass[x.classId]=[];byClass[x.classId].push(x);});
  Object.values(byClass).forEach(arr=>arr.sort((a,b)=>b.points-a.points));
  Object.values(byClass).forEach(arr=>arr.forEach((x,i)=>{x._cr=i+1;x._col=stuPointsColor(i+1,arr.length);}));
  list=list.sort((a,b)=>{const ka=stuIndexKey(a.name),kb=stuIndexKey(b.name);return ka<kb?-1:ka>kb?1:(a.name<b.name?-1:a.name>b.name?1:0);});
  const groups={};
  list.forEach(s=>{const k=stuIndexKey(s.name)||'#';if(!groups[k])groups[k]=[];groups[k].push(s);});
  const keys=Object.keys(groups).sort();
  return keys.length?keys.map(k=>`<div class="stu-idx"><div class="stu-idx-h">${esc(k)}</div>${groups[k].map(s=>stuCardHtml(s)).join('')}</div>`).join(''):emptyState('👥', clsId==='all'?'还没有学生':'该班级还没有学生');
}
function stuSearch(v){S._stuSearch=v;save();
  if(stuTab==='rec'){const rb=document.getElementById('rec_body');if(rb)rb.innerHTML=buildRecTable();return;}
  const nonArch=S.classes.filter(c=>!c.archived);
  const clsId=(S._stuCls&&(S._stuCls==='all'||nonArch.some(c=>c.id===S._stuCls)))?S._stuCls:'all';
  const q=v.trim().toLowerCase();
  // 搜索框跨所有班级（不受学生-班级选择限制）；
  // 班级选择仅在无搜索词时用于条件展示学生列表
  let list = q ? S.students.filter(s=>s.name.toLowerCase().includes(q))
               : S.students.filter(s=>clsId==='all'||s.classId===clsId);
  // 班级内积分排名（按全量班级计算，不受过滤影响）
  const byClass={};
  S.students.forEach(x=>{if(!byClass[x.classId])byClass[x.classId]=[];byClass[x.classId].push(x);});
  Object.values(byClass).forEach(arr=>arr.sort((a,b)=>b.points-a.points));
  Object.values(byClass).forEach(arr=>arr.forEach((x,i)=>{x._cr=i+1;x._col=stuPointsColor(i+1,arr.length);}));
  list=list.sort((a,b)=>{const ka=stuIndexKey(a.name),kb=stuIndexKey(b.name);return ka<kb?-1:ka>kb?1:(a.name<b.name?-1:a.name>b.name?1:0);});
  const groups={};
  list.forEach(s=>{const k=stuIndexKey(s.name)||'#';if(!groups[k])groups[k]=[];groups[k].push(s);});
  const keys=Object.keys(groups).sort();
  const el=document.getElementById('stu_list');
  if(el)el.innerHTML=keys.length?keys.map(k=>`<div class="stu-idx"><div class="stu-idx-h">${esc(k)}</div>${groups[k].map(s=>stuCardHtml(s)).join('')}</div>`).join(''):emptyState('👥', clsId==='all'?'还没有学生':'该班级还没有学生');
}
function buildRecTable(){

  const tv=S._recTime||(curSem()?('sem:'+curSem().id):'all');
  const rg=tv==='custom'?{from:S._recFrom||'0000-01-01',to:S._recTo||'9999-12-31'}:rangeOf(tv);
  const recs=[
    ...S.violations.map(r=>({id:r.id,src:'viol',studentId:r.studentId,type:r.type,date:r.date,delta:r.delta})),
    ...S.homeworks.map(r=>({id:r.id,src:'hw',studentId:r.studentId,type:'作业·'+r.status,date:r.date,delta:r.delta}))
  ].filter(r=>{
    const s=stu(r.studentId);if(!s)return false;
    if(clsVal!=='all'&&s.classId!==clsVal)return false;
    const q=(S._stuSearch||'').trim().toLowerCase();
    if(q&&!s.name.toLowerCase().includes(q))return false;
    return r.date>=rg.from&&r.date<=rg.to;
  }).sort((a,b)=>b.date.localeCompare(a.date));
  const rows=recs.length?recs.map(r=>{const s=stu(r.studentId);return `

  <td class="rec-c4">${esc(r.date.slice(2))}</td>
  <td><button class="rec-del" data-action="${r.src==='viol'?'del-viol':'del-hw'}" data-id="${r.id}" aria-label="删除" title="删除">✕</button></td></tr>`;}).join(''):
  `<tr><td colspan="6">${emptyState('🗒','暂无记录')}</td></tr>`;
  return `<div class="card rec-card" style="padding:0;overflow:hidden"><table class="rec-table"><colgroup><col class="rec-c1"><col class="rec-c2"><col><col class="rec-c5"><col class="rec-c4"><col class="rec-c6"></colgroup><thead><tr><th class="rec-c1">学生</th><th class="rec-c2">班级</th><th>类型</th><th class="rec-c5">积分</th><th class="rec-c4">时间</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function recView(){
  const nonArch=S.classes.filter(c=>!c.archived);
  const cur=curSem();
  const tv=S._recTime||(cur?('sem:'+cur.id):'all');
  const customRow=tv==='custom'?`<div class="field row" style="margin-bottom:6px">
    <div class="field" style="flex:1;margin-bottom:0"><label>从</label><input type="date" value="${S._recFrom||''}" onchange="recFromSel(this.value)"></div>
    <div class="field" style="flex:1;margin-bottom:0"><label>到</label><input type="date" value="${S._recTo||''}" onchange="recToSel(this.value)"></div></div>`:'';
  return `<div class="field row stu-act" style="margin-bottom:6px">
    <div style="flex:1;min-width:0">${selHtml('rec_cls', recClsSummary(), bkOpts([{k:'all',l:'全部班级',pick:'recClsBk'},...nonArch.filter(c=>c.name!=='全部班级').map(c=>({k:c.id,l:c.name,pick:'recClsBk'}))], S._recCls||'all'))}</div>
    <div style="flex:1;min-width:0">${selHtml('rec_time', recTimeSummary(), bkOpts(recTimeItems(), S._recTime||tv))}</div>
    <button class="btn primary sm" id="rec_add_btn" data-action="edit-rec" style="flex:none;width:38px;height:38px;border-radius:50%;padding:0;display:inline-flex;align-items:center;justify-content:center" aria-label="新增">${addIconSvg()}</button></div>
  ${customRow}
  <div class="field row stu-act" style="margin-top:6px;margin-bottom:0">
    <div class="srch-box"><span class="ic">${iconSvg('搜索',16)}</span><input id="stu_search" value="${esc(S._stuSearch||'')}" oninput="stuSearch(this.value)" placeholder="搜索学生" style="border:none;background:#fff;margin:0;padding-left:34px"></div></div>
  <div id="rec_body" style="margin-top:12px">${buildRecTable()}</div>`;
}
function recClsSummary(){const v=S._recCls||'all';if(v==='all')return '全部班级';const c=S.classes.find(x=>x.id===v);return c?c.name:'全部班级';}

function rangeOf(opt){
  opt=opt||'all';
  if(opt&&opt.indexOf('sem:')===0){const sid=opt.slice(4);const s=S.semesters.find(x=>x.id===sid);if(s&&s.start&&s.end)return {from:s.start,to:s.end};}
  if(opt==='all'){
    /* r81：「全部学期」= 所有未归档学期的时间并集范围（min start ~ max end）；
     * 若无未归档学期，回落到宽范围以兼容空数据。 */
    const ar=S.semesters.filter(s=>!s.archived&&s.start&&s.end);
    if(ar.length){
      const from=ar.map(s=>s.start).sort()[0];
      const to=ar.map(s=>s.end).sort().slice(-1)[0];
      return {from,to};
    }
    return {from:'0000-01-01',to:'9999-12-31'};
  }
  if(opt==='30')return {from:shiftDays(-30),to:todayISO()};
  if(opt==='7')return {from:shiftDays(-7),to:todayISO()};
  if(opt==='custom'){const d=S._stuDetail||{};return {from:d.from||'1970-01-01',to:d.to||'2999-12-31'};}
  const c=curSem();if(c&&c.start&&c.end)return {from:c.start,to:c.end};
  if(S.settings.semStart&&S.settings.semEnd)return {from:S.settings.semStart,to:S.settings.semEnd};
  return {from:'1970-01-01',to:'2999-12-31'};
}
function studentRecords(id,range){
  const s=stu(id);if(!s)return {grades:[],viol:[],hw:[],ans:[],stats:{viol:0,ansTotal:0,hwScore:0,other:0,avgExam:null}};
  const inR=d=>!range||(d>=range.from&&d<=range.to);
  const grades=S.exams.filter(e=>e.scores[s.name]!=null).sort((a,b)=>a.date.localeCompare(b.date))
    .map((e,i,arr)=>{const prev=arr[i-1];const sc=e.scores[s.name];const d=prev?sc-prev.scores[s.name]:0;
      return {examId:e.id,name:e.name,date:e.date,score:sc,delta:d};}).filter(g=>inR(g.date));
  const viol=S.violations.filter(v=>v.studentId===id&&inR(v.date));
  const hw=S.homeworks.filter(h=>h.studentId===id&&inR(h.date));
  const ans=S.answers.filter(a=>a.studentId===id&&inR(a.date));
  const examPoints=(S.examPoints||[]).filter(p=>p.studentId===id&&inR(p.date));
  // 答题：答对+答错+不答+其他（自定义规则走的 other 也算）合并为总次数
  const ansTotal=ans.length;
  // 作业得分：所有作业记录 delta 之和
  const hwScore=hw.reduce((sum,h)=>sum+(h.delta||0),0);
  // 考试均分：当前范围内考试分数平均
  const avgExam=grades.length?Math.round(grades.reduce((sum,g)=>sum+g.score,0)/grades.length):null;
  // 处理次数：当前范围内「待办 + 沟通」条目数（含已处理）
  const procTodo=(s.todoItems||[]).filter(x=>!range||inR(x.createdAt));
  const procContact=(s.contactItems||[]).filter(x=>!range||inR(x.createdAt));
  const processCount=procTodo.length+procContact.length;
  const stats={viol:viol.length,ansTotal,hwScore,other:ans.filter(a=>a.result==='other').length,avgExam,processCount};
  return {grades,viol,hw,ans,examPoints,stats};
}

/* 学生详情「已处理」列表：已处理（长按移入）的待办/沟通，按处理时间倒序；长按任一条可补备注 */
function buildProcessedList(id){
  const s=stu(id);if(!s)return '';
  const items=[];
  (s.todoItems||[]).forEach(x=>{if(x.processed)items.push({kind:'todo',x});});
  (s.contactItems||[]).forEach(x=>{if(x.processed)items.push({kind:'contact',x});});
  items.sort((a,b)=>(b.x.processedAt||'').localeCompare(a.x.processedAt||''));
  if(!items.length)return '';
  const rows=items.map(it=>{
    const x=it.x,kind=it.kind,badge=kind==='todo'?'待办':'沟通';

    return `<div class="proc-row" data-stu="${id}" data-kind="${kind}" data-iid="${x.id}">
      <div class="proc-main" data-lp="stu-proc" data-stu="${id}" data-kind="${kind}" data-iid="${x.id}">

        <span class="proc-text">${esc(x.text)}</span>

  }).join('');
  return `<div class="section-title" style="margin-top:16px">已处理</div><div class="proc-list">${rows}</div>`;

function stuItemProcess(sid,kind,iid,el){

/* 同一周若同时有 自动复盘(auto:true) 与 手动复盘，把自动汇总字段并入手动复盘并删除自动复盘，保证每周期末只留一张卡 */
function foldAutoIntoManual(week){

function autoItems(text, kind){
  const out=[];
  const push=(label,key)=>{ if(label&&label.trim())out.push({label:label.trim(), key:(key!=null?key:label).trim()}); };
  if(kind==='tasks'){
    text.split('\n').forEach(ln=>{ ['已完成','待完成'].forEach(p=>{ if(ln.indexOf(p)===0){ const rest=ln.slice(p.length).replace(/^\s*[:：]/,'').trim();
      rest.split(/[、,，]/).forEach(x=>{x=x.trim();if(x)push(x,x);}); }}); });
  } else if(kind==='todos'||kind==='notes'){
    const i=text.indexOf('\n'); const rest=(i>=0?text.slice(i+1):'').trim();
    rest.split(/[、,，]/).forEach(x=>{x=x.trim();if(x)push(x,x);});
  } else if(kind==='progress'){
    text.split('\n').forEach(ln=>{const m=ln.match(/^(.+?)（/); if(m&&m[1].trim())push(ln.trim(), m[1].trim());});
  } else if(kind==='exams'){
    text.split('\n').forEach(ln=>{const i=ln.indexOf('：'); if(i>0)push(ln.trim(), ln.slice(0,i).trim());});
  }
  return out;
}

function reviewOverlapHtml(rv){

    if(!items.length)return;

function viewReviews(){

      if(d&&wa!==null&&wa>=0&&wa<=3)recent.push(rv);                            // 本周及之前三周（本学期）

    else flat.push(rv);
  });
  const sortDesc=arr=>arr.sort((a,b)=>{const da=reviewDate(a),db=reviewDate(b);if(!da)return 1;if(!db)return -1;return db.localeCompare(da);});

function eventNameOf(e){return e&&e.name&&e.name.indexOf('·')>-1?e.name.split('·').slice(1).join('·').trim():e.name;}
function examEvents(){
  // 学生名 → 班级（兜底：考试数据未标 classId 时从 scores 反查；同名优先取首个匹配班级）
  const stuCls=(()=>{const m={};(S.students||[]).forEach(s=>{if(s&&s.name&&s.classId&&!m[s.name])m[s.name]=s.classId;});return m;})();
  const map={};
  (S.exams||[]).forEach(e=>{if(!e||!e.scores)return;
    /* r73：分组键 = 事件标题(·后段) + 学期 + 考试时间 —
            「同标题同学期同时间」无论班级/科目都归为同一次考试；

            r66 旧版按 (标题 + 科目) 分组已被废止。 */
    const k=eventNameOf(e)+'\u241F'+(e.sem||'')+'\u241F'+(e.date||'');
    (map[k]=map[k]||[]).push(e);
  });
  return Object.keys(map).map(k=>{
    const exs=(map[k]||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
    const subs=[...new Set(exs.map(e=>e.subjectId))].filter(Boolean);
    const cls=new Set();exs.forEach(e=>{
      if(e.classId)cls.add(e.classId);
      else Object.keys(e.scores||{}).forEach(n=>{const c=stuCls[n];if(c)cls.add(c);});
    });
    const sub=subs[0];
    return {id:k,name:eventNameOf(exs[0]),date:(exs[exs.length-1]||{date:''}).date,exams:exs,subjects:subs,classIds:[...cls],subjName:sub?subjName(sub):''};

/* 成绩分析：筛选状态归一化 —— 单一来源，三处共用：

function gradeNormalizeFilters(){

  if(S._gradeClass===undefined||S._gradeClass===null)S._gradeClass=ALL_CLASS;
  const ev=gradeEventById(S._gradeEvent);const evSubs=(ev?ev.subjects:[]).slice();
  const subFirst=(S.subjects||[])[0]&&(S.subjects[0]).id;
  if(S._gradeView==='subject'){if(!S._gradeSub||!evSubs.includes(S._gradeSub))S._gradeSub=evSubs[0]||subFirst||'';}
  if(S._gradeSubCol===undefined||S._gradeSubCol===null)S._gradeSubCol=subFirst||'';
  if(S._gradeSubCol&&!S.subjects.find(s=>s.id===S._gradeSubCol))S._gradeSubCol=subFirst||'';
  if(S._cmpItems===undefined||S._cmpItems===null)S._cmpItems=[];

function multiLineSvg(series,xLabels){
  const W=640,H=200,pad=34;const flat=series.flatMap(s=>s.vals.filter(v=>v!=null)).concat([0,100]);
  const max=Math.max(...flat),min=Math.min(...flat,0);const n=Math.max(1,xLabels.length-1);
  const x=i=>pad+i*(W-2*pad)/n;const y=v=>H-pad-(v-min)/((max-min)||1)*(H-2*pad);
  let svg=`<svg viewBox="0 0 ${W} ${H}"><line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="var(--border)"/>`;
  series.forEach(s=>{const pts=[];s.vals.forEach((v,i)=>{if(v==null)return;pts.push(`${x(i).toFixed(1)},${y(v).toFixed(1)}`);});
    if(pts.length){svg+=`<polyline points="${pts.join(' ')}" fill="none" stroke="${s.color}" stroke-width="2.5"/>`;
      s.vals.forEach((v,i)=>{if(v!=null)svg+=`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3.5" fill="${s.color}"/>`;});}});
  xLabels.forEach((lb,i)=>{svg+=`<text x="${x(i).toFixed(1)}" y="${H-10}" font-size="10" fill="var(--text-2)" text-anchor="middle">${esc(lb)}</text>`;});
  svg+=`</svg>`;return svg;

function drawCandidates(){

    list=list.filter(s=>(lo===''||isNaN(lo)||s.points>=lo)&&(hi===''||isNaN(hi)||s.points<=hi));}

/* ===== r87：教学任务安排「当前范围」唯一来源 =====
   三个筛选状态（学期 / 班级 / 科目）在这里一次性规范化，供 viewSettings、planItemsHtml、
   planMove、planAddManual、currentPlanIds、archivePlan 共用，避免各写一套兜底导致
   「下拉显示全部班级、列表却按第一个活跃班级过滤」的错位（首次进入列表为空的老 bug）。
   规则：未设置 / 指向已归档或已删除的班级 → 一律按 ALL_CLASS（全部班级）。 */
function planScopeInit(){
  if(S._planClass!==ALL_CLASS&&!S.classes.some(c=>c.id===S._planClass&&!c.archived))S._planClass=ALL_CLASS;
  if(S._planSubject===undefined||S._planSubject===null)S._planSubject='';
  if(S._planSubject&&planSubjectOpts().indexOf(S._planSubject)<0)S._planSubject='';
  S._planSem=S._planSem||S._previewSem||(curSem()?curSem().id:ALL_CLASS);
  if(S._planSem&&S._planSem!==ALL_CLASS&&!S.semesters.some(s=>s.id===S._planSem))S._planSem=curSem()?curSem().id:ALL_CLASS;
}
/* 「全部班级」= 所有未归档班级的并集（与顶部班级下拉的选项列表一致，已归档班级的任务不显示） */
function planScopeItems(){planScopeInit();
  if(S._planClass!==ALL_CLASS)return classPlan(S._planClass);
  return S.plan.filter(p=>{const c=S.classes.find(x=>x.id===p.classId);return !c||!c.archived;});
}
function planVisibleItems(){
  return planScopeItems().filter(p=>(S._planSem===ALL_CLASS||p.sem===S._planSem||!p.sem)
    &&(S._planSubject===''||(p.subject||'')===S._planSubject)).sort((a,b)=>a.order-b.order);
}
function planItemsHtml(){
  const explicitAll=S._planClass===ALL_CLASS;
  const vis=planVisibleItems();
  if(!vis.length)return '<div class="sub">该筛选下暂无教学任务安排</div>';
  return vis.map((p,i)=>`<div class="rec-wrap" data-id="${p.id}">
  <div class="rec" style="align-items:center;gap:8px" draggable="true" data-id="${p.id}"><input type="checkbox" ${p.done?'checked':''} onchange="planToggle('${p.id}')" style="width:auto;flex:none">
    <span style="flex:1;min-width:0;display:block">${esc(p.title)}
    ${(S._planSubject===''||S._planSubject===undefined)?(p.subject?'<span class="tag" style="background:rgba(31,170,107,.12);color:var(--ok)">'+esc(p.subject)+'</span>':'<span class="tag" style="background:rgba(31,170,107,.12);color:var(--ok)">无科目</span>'):''}
    ${explicitAll?'<span class="tag" style="background:var(--primary-soft);color:var(--primary)">'+esc(classNameOf(p.classId))+'</span>':''}
    ${p.tag?'<span class="tag">'+esc(p.tag)+'</span>':''} ${p.done?'<span class="tag">'+esc(p.doneDate||'')+'</span>':''}
    ${p.note?'<div style="margin-top:3px;font-size:12px;color:var(--text-2);line-height:1.3">↪ 备注：'+esc(p.note)+'</div>':''}</span>
    <span class="plan-move" style="display:flex;gap:2px"><button class="btn sm" onclick="planMove('${p.id}','up')" ${i===0?'disabled':''} title="上移">↑</button>
    <button class="btn sm" onclick="planMove('${p.id}','down')" ${i===vis.length-1?'disabled':''} title="下移">↓</button></span>
    <div class="rec-acts">
      <button class="ic-btn-del" type="button" data-action="plan-del" data-id="${p.id}" title="删除" aria-label="删除">${iconSvg('x',12)}</button>
      <button class="ic-btn" type="button" data-action="plan-edit" data-id="${p.id}" title="编辑" aria-label="编辑">${iconSvg('edit',12)}</button></div>
  </div></div>`).join('');}
function planMove(id,dir){const items=planScopeItems();const i=items.findIndex(p=>p.id===id);if(i<0)return;
  const j=dir==='up'?i-1:i+1;if(j<0||j>=items.length)return;
  const a=items[i].order,b=items[j].order;items[i].order=b;items[j].order=a;save();planRender();}
function planRender(){const el=document.getElementById('planList');if(el)el.innerHTML=planItemsHtml();}
/* 拖拽排序：把 from 任务移到 to 任务之前/之后（after=false 之前 / true 之后），直接重排 S.plan 数组 */
function planReorder(from,to,after){
  const i=S.plan.findIndex(p=>p.id===from);
  if(i<0)return;
  const [moved]=S.plan.splice(i,1);
  let j=S.plan.findIndex(p=>p.id===to);
  if(j<0){S.plan.splice(i,0,moved);return;}
  if(after)j++;
  S.plan.splice(j,0,moved);
  S.plan.forEach((p,k)=>p.order=k+1);
  save();planRender();
}
/* 长按/拖拽初始化（桌面 HTML5 drag + 移动端长按 500ms 触发），一次性全局委托。
   实时让位：源行占位随指针在列表内搬移（其他行即时上下移动填补），松手按 DOM 顺序落定数据 */
(function initPlanDrag(){
  if(window.__planDragInit)return;window.__planDragInit=1;
  const body=document.body;
  let dragId=null,touch=null,timer=null,off=null,ghost=null;
  const wraps=()=>[...document.querySelectorAll('#planList .rec-wrap')];
  /* 克隆浮卡：源行加 .drag-source 变淡占位，克隆 fixed 跟随指针（白卡圆角浮起） */
  const makeGhost=(row,x,y)=>{
    ghost=row.cloneNode(true);
    ghost.classList.add('dragging');
    ghost.removeAttribute('draggable');
    const pm=ghost.querySelector('.plan-move');if(pm)pm.remove();
    const r=row.getBoundingClientRect();
    ghost.style.cssText='position:fixed;left:'+r.left+'px;top:'+r.top+'px;width:'+r.width+'px;margin:0;pointer-events:none;z-index:99;border-bottom:none';
    document.body.appendChild(ghost);
    off={x:x-r.left,y:y-r.top};
    row.closest('.rec-wrap').classList.add('drag-source');
    window.__planDragOn=true;
    /* 拖拽开始：关闭所有已滑开的功能键 */
    document.querySelectorAll('#planList .rec-wrap[data-open="1"]').forEach(w=>{const rr=w.querySelector('.rec');if(rr){rr.style.transition='';rr.style.transform='';}w.dataset.open='';});
  };
  const moveGhost=(x,y)=>{if(ghost&&off){ghost.style.left=(x-off.x)+'px';ghost.style.top=(y-off.y)+'px';}};
  /* 实时让位：源行（占位）搬到目标行前/后，其他行即时让位；目标行加底色响应 */
  const shift=(x,y)=>{
    const list=document.getElementById('planList');if(!list)return;
    const src=list.querySelector('.rec-wrap.drag-source');if(!src)return;
    wraps().forEach(w=>{const rr=w.querySelector('.rec');if(rr)rr.classList.remove('drag-before','drag-after');});
    const el=document.elementFromPoint(x,y);
    const target=el&&el.closest('#planList .rec-wrap');
    if(!target||target===src)return;
    const r=target.getBoundingClientRect();
    const after=(y-r.top)>=r.height/2;
    const rec=target.querySelector('.rec');
    if(rec)rec.classList.add(after?'drag-after':'drag-before');
    if(after){if(target.nextElementSibling!==src)list.insertBefore(src,target.nextElementSibling);}
    else{if(target!==src)list.insertBefore(src,target);}
  };
  /* 按当前 DOM 顺序落定数据（未显示的筛选外任务保持原相对顺序） */
  const commit=()=>{
    const list=document.getElementById('planList');if(!list)return;
    const idx=new Map([...list.querySelectorAll('.rec-wrap')].map((w,i)=>[w.dataset.id,i]));
    S.plan.sort((a,b)=>{
      const ia=idx.has(a.id)?idx.get(a.id):1e9,ib=idx.has(b.id)?idx.get(b.id):1e9;
      if(ia!==ib)return ia-ib;
      return S.plan.indexOf(a)-S.plan.indexOf(b);
    });
    S.plan.forEach((p,k)=>p.order=k+1);
    save();planRender();
  };
  const clearState=()=>{
    if(ghost&&ghost.parentNode)ghost.parentNode.removeChild(ghost);ghost=null;
    wraps().forEach(w=>{const rr=w.querySelector('.rec');if(rr)rr.classList.remove('drag-before','drag-after');w.classList.remove('drag-source');});
    window.__planDragOn=false;
    dragId=null;touch=null;off=null;
  };
  body.addEventListener('dragstart',e=>{
    const row=e.target.closest('#planList .rec');if(!row)return;
    dragId=row.dataset.id;
    makeGhost(row,e.clientX,e.clientY);
    e.dataTransfer.effectAllowed='move';
    try{e.dataTransfer.setData('text/plain',dragId);}catch(_){}
    try{const g=document.createElement('div');g.style.cssText='width:1px;height:1px;opacity:0';document.body.appendChild(g);e.dataTransfer.setDragImage(g,0,0);}catch(_){}
  });
  body.addEventListener('dragover',e=>{
    if(!dragId)return;e.preventDefault();e.dataTransfer.dropEffect='move';
    moveGhost(e.clientX,e.clientY);
    shift(e.clientX,e.clientY);
  });
  body.addEventListener('drop',e=>{
    if(!dragId)return;e.preventDefault();
    moveGhost(e.clientX,e.clientY);
    shift(e.clientX,e.clientY);
    commit();
    clearState();
  });
  body.addEventListener('dragend',clearState);
  body.addEventListener('touchstart',e=>{
    const row=e.target.closest('#planList .rec');if(!row||e.target.closest('input,button'))return;
    const t=e.touches[0];
    touch={id:row.dataset.id,row,active:false};
    timer=setTimeout(()=>{
      if(touch&&!touch.active){touch.active=true;makeGhost(row,t.clientX,t.clientY);}
    },500);
  },{passive:true});
  body.addEventListener('touchmove',e=>{
    if(!touch||!touch.active)return;e.preventDefault();
    const t=e.touches[0];
    moveGhost(t.clientX,t.clientY);
    shift(t.clientX,t.clientY);
  },{passive:false});
  body.addEventListener('touchend',e=>{
    clearTimeout(timer);
    if(!touch)return;
    if(touch.active)commit();
    clearState();
  });
  body.addEventListener('touchcancel',()=>{clearTimeout(timer);clearState();});
})();
const COL_OPEN={};
function toggleCollapse(id){const el=document.getElementById(id);if(!el)return;const b=el.querySelector('.collapse-body');if(!b)return;const open=b.style.display!=='none';b.style.display=open?'none':'block';COL_OPEN[id]=!open;el.classList.toggle('open',!open);const ch=el.querySelector('.chev');if(ch)ch.classList.toggle('open',!open);}
function reopenCols(){Object.keys(COL_OPEN).forEach(id=>{if(!COL_OPEN[id])return;const el=document.getElementById(id);if(!el)return;const b=el.querySelector('.collapse-body');if(b)b.style.display='block';el.classList.add('open');const ch=el.querySelector('.chev');if(ch)ch.classList.add('open');});}
function addStuNames(cid,raw){const names=(raw||'').split(/[\n,，、\s]+/).map(s=>s.trim()).filter(Boolean);
  const exist=new Set(S.students.filter(s=>s.classId===cid).map(s=>s.name));let added=0;
  names.forEach(n=>{if(!exist.has(n)){S.students.push({id:uid(),name:n,classId:cid,points:0,concern:false,todoItems:[],contactItems:[]});exist.add(n);added++;}});
  return added;}
/* 班级编辑（r53）：学生名单 chips 渲染 + 单个删除。

function clsStuChipsHtml(cid){const list=S.students.filter(s=>s.classId===cid).sort((a,b)=>(a.name||'').localeCompare(b.name||'','zh'));

function classStuDel(stuId,ev){if(ev){ev.stopPropagation();ev.preventDefault();}
  const s=S.students.find(x=>x.id===stuId);if(!s)return;
  if(!confirm('确定从名单中删除「'+s.name+'」？该学生的成绩/登记记录会一并清除。'))return;
  const stuName=s.name;
  // 成绩（按姓名清 e.scores）
  S.exams.forEach(e=>{if(e.scores&&stuName in e.scores)delete e.scores[stuName];});
  S.exams=S.exams.filter(e=>Object.keys(e.scores||{}).length>0);
  // 登记记录（按 studentId 清 violations / homeworks / answers）
  S.violations=S.violations.filter(v=>v.studentId!==stuId);
  S.homeworks=S.homeworks.filter(h=>h.studentId!==stuId);
  S.answers=S.answers.filter(a=>a.studentId!==stuId);

  const f=document.querySelector('form[data-form=class]');const cid=f?f.dataset.id:'';
  if(cid)classStuRender(cid);

/* 历史条目名称归一化：去掉名称中的「自动」字；自动备份「学期名备份/学期名自动归档」→「学期名归档」；班级归档 单班=「学期-班级归档」/多班=「学期归档」+班级列表 */
function autoBkName(a){return ((a&&a.name)||'').replace(/\s*自动\s*/g,'').replace(/备份$/,'归档');}
function classArcName(a){let n=((a&&a.name)||(a&&a.className)||'').replace(/\s*自动\s*/g,'');
  const sem=(a&&a.semName)||(n.indexOf('-班级归档')>-1?n.split('-班级归档')[0]:'');
  const cl=((a&&a.classes)||[]).map(c=>c.name).filter(Boolean).filter(x=>x!=='全部班级');
  const raw=((a&&a.classes)||[]).length;

function classArcList(a){const cl=((a&&a.classes)||[]).map(c=>c.name).filter(Boolean).filter(x=>x!=='全部班级');return cl.length>1?cl.join('、'):'';}
function clsArcName(c){let n=(c&&(c.arcName||c.name))||'';n=n.replace(/\s*自动\s*/g,'');if(n.indexOf('-班级-')>-1)n=n.split('-班级-')[0];if(!/归档$/.test(n))n+='归档';return n;}
/* 学期唯一 upsert：按 keyFn 去重，存在则整份替换、不存在则置顶新增。
   班级归档用 o=>o.sem（每学期一条）；课表/任务/成绩用 o=>o.sem+班级/科目（同班/同科目同学期唯一）。 */
function upsertArc(arr,keyFn,obj){arr=arr||[];const k=keyFn(obj);const i=arr.findIndex(x=>keyFn(x)===k);if(i>=0){arr[i]=obj;}else{arr.unshift(obj);}return arr;}

  S.semesters.forEach(s=>s.current=(s.id===id));const ns=S.semesters.find(s=>s.id===id);S.timetable=S.ttBySem[id]?S.ttBySem[id].slice():[];S._previewSem='';S._ttSem='';S._planSem='';syncSemSettings();save();viewReload('settings');toast('已切换当前学期（课表已同步刷新）');}

function toggleSemArch(id){const s=S.semesters.find(x=>x.id===id);if(!s)return;
  if(!s.archived){s.archived=true;const ad=todayISO();const entry={id:uid(),sem:id,semName:s.name,start:s.start,end:s.end,archivedAt:ad,auto:false,timetable:[],plan:[]};
    if(s.current){
      entry.timetable=S.timetable.slice();entry.plan=S.plan.slice();
      const nx=S.semesters.find(x=>!x.archived&&x.id!==id);S.ttBySem=S.ttBySem||{};S.ttBySem[id]=S.timetable.slice();
      if(nx){S.semesters.forEach(x=>x.current=(x.id===nx.id));S.timetable=S.ttBySem[nx.id]?S.ttBySem[nx.id].slice():[];}else{S.semesters.forEach(x=>x.current=false);S.timetable=[];}
      syncSemSettings();
    }
    S.semArchives=upsertArc(S.semArchives||[],o=>o.sem,entry);

  }else{const e=(S.semArchives=S.semArchives||[]).find(x=>x.sem===id);

    s.archived=false;if(!S.semesters.some(x=>x.current))s.current=true;

    save();viewReload('settings');toast('已撤销归档：学期设置、课表、教学任务已一并恢复');}}

function initTagInput(){const wrap=document.getElementById('tag_input_wrap');if(!wrap)return;const list=wrap.querySelector('.tag-list');const input=wrap.querySelector('input[type=text]');const hidden=wrap.querySelector('input[type=hidden]');
  const get=()=>(hidden.value||'').split(/[,，]/).map(s=>s.trim()).filter(Boolean);
  const set=t=>{hidden.value=t.join(',');};
  const render=()=>{const ts=get();list.innerHTML=ts.map(t=>`<span class="tag-chip" data-tag="${esc(t)}">${esc(t)}<span class="tag-x">×</span></span>`).join('');};
  const add=t=>{t=t.trim();if(!t)return;const cur=get();if(cur.includes(t))return;cur.push(t);set(cur);render();};
  const rm=t=>{set(get().filter(x=>x!==t));render();};
  if(!wrap._bound){
    list.addEventListener('click',e=>{if(e.target.classList.contains('tag-x')){const chip=e.target.closest('.tag-chip');if(chip)rm(chip.dataset.tag);}});
    input.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===','||e.key==='，'){e.preventDefault();add(input.value);input.value='';}else if(e.key==='Backspace'&&!input.value){const cur=get();if(cur.length)rm(cur[cur.length-1]);}});
    input.addEventListener('blur',()=>{if(input.value.trim()){add(input.value);input.value='';}});
    wrap._bound=true;
  }
  render();}
function isoOf(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function weekRange(){const now=new Date();const wd=(now.getDay()+6)%7;const mon=new Date(now);mon.setDate(now.getDate()-wd);const sun=new Date(mon);sun.setDate(mon.getDate()+6);return {f:isoOf(mon),t:isoOf(sun)};}
function reviewWeekSummary(){const {f,t}=weekRange();
  const taught=[...new Set(S.timetable.map(x=>esc(x.subject)+'·'+classNameOf(x.classId)))].filter(Boolean);
  const donePlan=S.plan.filter(p=>p.done&&p.doneDate>=f&&p.doneDate<=t).map(p=>p.title);
  const doneTasks=S.todos.filter(x=>x.status==='done').map(x=>x.title);
  const exams=S.exams.filter(e=>e.date>=f&&e.date<=t).map(e=>e.name);
  return `本周上课：${taught.length?taught.join('、'):'（课表为空）'}\n完成教学任务：${donePlan.length?donePlan.join('、'):'（本周无标记完成的教学任务）'}\n完成待办：${doneTasks.length?doneTasks.slice(0,20).join('、'):'（本周无已完成待办）'}\n完成考试：${exams.length?exams.join('、'):'（本周无考试）'}`;}
function weekMondayISO(){return weekRange().f;}
function weekLabel(mon){const p=mon.split('-').map(Number);const e=new Date(p[0],p[1]-1,p[2]+6);return mon+' ~ '+isoOf(e);}
/* 计算「学期内」应自动生成的周区间：仅在学期范围内生成；
   首周若学期从周中开始则左扩到学期开始日；末周若学期在周中结束则右缩到学期结束日。
   返回 {pStart,pEnd}（均为 ISO 日期），不在学期内则返回 null。 */
function semTargetWeek(cur){
  if(!cur||!cur.start||!cur.end)return null;
  const today=todayISO();
  if(today<cur.start)return null; // 学期尚未开始
  let refMon;
  if(today<=cur.end){refMon=weekMondayISO();}
  else{ // 学期已结束：仅当今天仍在「结束日所在周」内，补生成最后一周；超出则不再生成
    const e=cur.end.split('-').map(Number);const em=new Date(e[0],e[1]-1,e[2]);
    const wd=(em.getDay()+6)%7;em.setDate(em.getDate()-wd);
    const sun=new Date(em);sun.setDate(em.getDate()+6);
    if(today>isoOf(sun))return null;
    refMon=isoOf(em);
  }
  const pStart=cur.start>refMon?cur.start:refMon;
  const s=refMon.split('-').map(Number);const su=new Date(s[0],s[1]-1,s[2]+6);const sunIso=isoOf(su);
  const pEnd=cur.end<sunIso?cur.end:sunIso;
  if(pStart>pEnd)return null;
  return {pStart,pEnd};
}
function autoReviewData(){
  const plan=S.plan||[];
  const donePlan=plan.filter(p=>p.done);
  let tasks='教学任务安排共 '+plan.length+' 项，已完成 '+donePlan.length+' 项。';
  if(donePlan.length)tasks+='\n已完成：'+donePlan.map(p=>p.title).join('、');
  const upPlan=plan.filter(p=>!p.done);
  if(upPlan.length)tasks+='\n待完成：'+upPlan.map(p=>p.title).join('、');
  let progress='';
  if(S.courses&&S.courses.length)progress=S.courses.map(c=>c.name+'（'+(c.cls||'')+'）：'+courseProgress(c)+'%').join('\n');
  else progress='暂无课程进度记录。';
  const doneTodos=(S.todos||[]).filter(t=>t.status==='done');
  let todos='本周已完成代办 '+doneTodos.length+' 项。';
  if(doneTodos.length)todos+='\n'+doneTodos.map(t=>t.title).join('、');
  let notes='备课笔记共 '+(S.notes?S.notes.length:0)+' 篇。';
  if(S.notes&&S.notes.length)notes+='\n'+S.notes.map(n=>n.title).join('、');
  let exams='';
  if(S.exams&&S.exams.length){
    const bySubj={};S.exams.forEach(e=>{const s=subj(e.subjectId);const k=s?s.name:'未命名科目';(bySubj[k]=bySubj[k]||[]).push(e);});
    exams=Object.keys(bySubj).map(sn=>{const es=bySubj[sn];const latest=es[es.length-1];const vals=Object.values(latest.scores);const avg=vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):0;return sn+'：'+es.length+' 场，最新《'+latest.name+'》平均 '+avg+' 分';}).join('\n');
  } else exams='暂无考试记录。';
  return {tasks,progress,todos,notes,exams};
}
function maybeAutoReview(){
  const cur=curSem();
  if(!cur)return;
  const wk=semTargetWeek(cur);
  if(!wk)return; // 不在学期内则不自动生成
  const {pStart,pEnd}=wk;
  const label=pStart+' ~ '+pEnd.slice(5);
  const exist=S.reviews.find(r=>(r.week||'').indexOf(pStart)===0);
  const d=autoReviewData();
  if(exist){
    if(exist.autoTasks==null){exist.autoTasks=d.tasks;exist.autoProgress=d.progress;exist.autoTodos=d.todos;exist.autoNotes=d.notes;exist.autoExams=d.exams;exist.auto=true;save();}
    S._autoReviewWeek=pStart;save();return;
  }
  S.reviews.push({id:uid(),week:label,done:'（本周自动汇总见下方各模块）',stuck:'',next:'',highlight:'',autoTasks:d.tasks,autoProgress:d.progress,autoTodos:d.todos,autoNotes:d.notes,autoExams:d.exams,auto:true});
  S._autoReviewWeek=pStart;save();
}

function parsePeriodLabel(s){
  const raw=String(s||'').trim();
  let part=0;
  if(/晚上/.test(raw))part=2;
  else if(/下午/.test(raw))part=1;
  const digits=(raw.match(/\d+/g)||[]).join('');
  if(!digits)return {part:0,pnum:1,period:1};
  if(/上午|下午|晚上/.test(raw)){const pnum=Math.max(1,Math.min(5,parseInt(digits,10)||1));return {part,pnum,period:part*5+pnum};}
  /* 裸数字 1-15：当绝对 period 处理（向后兼容历史导出） */
  const per=Math.max(1,Math.min(15,parseInt(digits,10)));
  return {part:Math.floor((per-1)/5),pnum:((per-1)%5)+1,period:per};

/* 隔周上课（r53）：

function isoWeekOfYear(date){const d=date instanceof Date?new Date(date.getTime()):new Date();const t=new Date(d.getFullYear(),d.getMonth(),d.getDate());const dayNum=(t.getDay()+6)%7+1;t.setDate(t.getDate()+4-dayNum);const yearStart=new Date(t.getFullYear(),0,1);return Math.ceil((((t-yearStart)/86400000)+1)/7);}
function ttBiweeklyMatch(t,date){if(!t||!t.biweekly)return true;if(!t.biweeklyRefWeek)return true;return Math.abs(isoWeekOfYear(date)-t.biweeklyRefWeek)%2===0;}

/* ============ events ============ */
var LP_MODE=['imp-note','exp-note','grade-imp','imp-tt','exp-tt','imp-plan','exp-plan'];
var LP_FLASH=['imp-review','exp-review-all','todo-imp','do-arc-archive','do-manual-backup','do-restore-import','do-reset-scope'];
document.body.addEventListener('click',e=>{
  const t=e.target.closest('[data-action]');if(!t)return;const a=t.dataset.action,id=t.dataset.id;
  /* 短按「模式蓝」：指定的导入/导出按钮按下即实色蓝，动作一执行（弹窗/下载）约 500ms 后自动消失；点别的也消失。无淡底按压态 */
  if(LP_MODE.includes(a)){lpClearModeBlue();t.classList.add('active');setTimeout(function(){if(t)t.classList.remove('active');},500);}
  /* 短按「蓝闪」：每周复盘-导入/导出 按下即实色蓝闪一下（约 400ms，与长按触发蓝闪同款），不常驻 */

/* ============ xlsx / csv import-export ============ */
function download(name,text){const b=new Blob([String.fromCharCode(0xFEFF),text],{type:'text/csv;charset=utf-8'});
  const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);}
function doExport(filename,sheets,csvFallback){
  if(HAS_XLSX){try{const wb=XLSX.utils.book_new();
    sheets.forEach(s=>{const ws=XLSX.utils.aoa_to_sheet(s.rows);XLSX.utils.book_append_sheet(wb,ws,s.name);});
    XLSX.writeFile(wb,filename+'.xlsx');toast('已导出 xlsx');return;}catch(e){}}
  download(filename+'.csv',csvFallback);toast('已导出 CSV（联网后可导出 xlsx）');
}
function stripQuotes(s){return String(s==null?'':s).replace(/^["'\u201C\u201D]+|["'\u201C\u201D]+$/g,'');}
function parseCsv(text){return text.split(/\r?\n/).filter(l=>l.trim()!=='').map(l=>l.split(/[,，\t]/).map(c=>stripQuotes(c.trim())));}
function detectMojibake(s){return /[ï¿½å…¨éƒ¨ç�­çº§]|�/.test(s);}
function decodeBuf(buf,enc){try{return new TextDecoder(enc,{fatal:true}).decode(buf);}catch(e){return null;}}
function readTextFile(file,cb){
  const rd=new FileReader();
  rd.onload=()=>{const buf=rd.result;let txt=decodeBuf(buf,'utf-8');
    if(txt===null||detectMojibake(txt)){const g=decodeBuf(buf,'gb18030');if(g!==null&&g.length)txt=g;}
    cb(txt||'');};
  rd.readAsArrayBuffer(file);}
function readFileToSheets(file,cb){
  const nm=file.name.toLowerCase();
  const done=sheets=>{try{cb(sheets);}catch(err){console.error(err);toast('导入处理出错：'+(err&&err.message||err));}};
  if((nm.endsWith('.xlsx')||nm.endsWith('.xls'))&&HAS_XLSX){const rd=new FileReader();
    rd.onload=()=>{try{const wb=XLSX.read(rd.result,{type:'array'});
      const sheets=wb.SheetNames.map(n=>({name:n,rows:XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:''})}));done(sheets);}
      catch(e){toast('xlsx 解析失败');}};rd.readAsArrayBuffer(file);}
  else{readTextFile(file,txt=>{const rows=parseCsv(txt);done([{name:'data',rows}]);});}
}
function pickTable(cb){const inp=document.createElement('input');inp.type='file';inp.accept='.xlsx,.xls,.csv,.txt';
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;readFileToSheets(f,cb);};inp.click();}
function toCsv(rows){return rows.map(r=>r.map(c=>(c==null?'':String(c)).replace(/[",\n]/g,m=>m===','?'，':m)).join(',')).join('\n');}

/* class / student import-export */
function importClass(cid){pickTable(sheets=>{const rows=(sheets[0].rows||[]).filter(r=>r.length);if(!rows.length)return;
  const start=rows[0].join(',').includes('姓名')?1:0;let added=0;
  rows.slice(start).forEach(r=>{const nm=(r[0]||'').trim();if(!nm)return;
    S.students.push({id:uid(),name:nm,classId:cid,points:parseInt(r[1])||0,concern:false,todoItems:[],contactItems:[]});added++;});
  save();reloadCur('students');toast('导入 '+added+' 名学生');});}
/* 默认导出本班所有内容（学生/违纪/作业/答题/成绩） */
function classSheets(cid){const c=cls(cid);if(!c)return null;
  const stus=S.students.filter(s=>s.classId===cid);
  const sRows=[['姓名','班级','积分','需关注','跟进','沟通'],
    ...stus.map(s=>[s.name,c.name,s.points,s.concern?'是':'否',(s.todoItems||[]).map(x=>x.text).join('、'),(s.contactItems||[]).map(x=>x.text).join('、')])];
  const vRows=[['姓名','类型','日期','备注','积分'],
    ...S.violations.filter(v=>v.cls===cid).map(v=>[(stu(v.studentId)||{}).name||'',v.type,v.date,v.note||'',v.delta])];
  const hRows=[['姓名','作业','状态','日期','积分'],
    ...S.homeworks.filter(h=>h.cls===cid).map(h=>[(stu(h.studentId)||{}).name||'',h.title,h.status,h.date,h.delta])];
  const aRows=[['姓名','结果','日期','积分'],
    ...S.answers.filter(a=>{const st=stu(a.studentId);return st&&st.classId===cid;}).map(a=>[(stu(a.studentId)||{}).name||'',a.result==='correct'?'答对':a.result==='wrong'?'答错':'不答',a.date,a.delta])];
  const exs=S.exams.slice().sort((x,y)=>x.date.localeCompare(y.date));
  const gHeader=['学生',...exs.map(e=>e.name+'('+e.date+')'),'平均'];
  const gRows=stus.map(s=>{const scs=exs.map(e=>e.scores[s.name]);const valid=scs.filter(v=>v!=null);
    const avg=valid.length?valid.reduce((a,b)=>a+b,0)/valid.length:'';
    return [s.name,...scs.map(v=>v==null?'':v),avg];});
  const sheets=[{name:'学生',rows:sRows},{name:'违纪',rows:vRows},{name:'作业',rows:hRows},{name:'答题',rows:aRows},{name:'成绩',rows:[gHeader,...gRows]}];
  const csv=toCsv(sRows)+'\n\n'+toCsv(vRows)+'\n\n'+toCsv(hRows)+'\n\n'+toCsv(aRows)+'\n\n'+toCsv([gHeader,...gRows]);
  return {c,sheets,csv};
}
function exportClass(cid){const r=classSheets(cid);if(!r)return;doExport(r.c.name+'_全部记录',r.sheets,r.csv);}
/* 学情跟进页级导出：勾选班级导出合并文件；未勾选默认导出全部班级 */
function doExportClasses(ids){

  if(!classes.length){toast('没有可导出的班级');return;}
  if(classes.length===1){exportClass(classes[0].id);return;}
  const used=new Set();const sheets=[];let csv='';

    r.sheets.forEach(s=>{let nm=(c.name+'_'+s.name).slice(0,31);let k=nm,i=1;while(used.has(k)){k=nm.slice(0,28)+'_'+(i++);}used.add(k);sheets.push({name:k,rows:s.rows});});
    csv+='\n=== '+c.name+' ===\n'+r.csv;});

function delPendingDo(fn,label,n){_delPending={fn,label,n};confirmModal('批量删除'+label,'确定删除选中的 '+n+' 条'+label+'？此操作不可恢复。','do-del-pending','danger');}

/* ---- 各页面删除实现（单条即时删；多条弹确认；级联保留与现有删除逻辑一致） ---- */
function deleteNotes(ids){if(!ids.length){toast('没有可删除的备课笔记');return;}
  if(ids.length===1){S.notes=S.notes.filter(n=>!ids.includes(n.id));save();viewReload('notes');toast('已删除 1 条备课笔记');return;}
  delPendingDo(()=>{S.notes=S.notes.filter(n=>!ids.includes(n.id));save();viewReload('notes');},'备课笔记',ids.length);}
function deleteReviews(ids){if(!ids.length){toast('没有可删除的每周复盘');return;}
  if(ids.length===1){S.reviews=S.reviews.filter(rv=>!ids.includes(rv.id));save();viewReload('reviews');toast('已删除 1 条每周复盘');return;}
  delPendingDo(()=>{S.reviews=S.reviews.filter(rv=>!ids.includes(rv.id));save();viewReload('reviews');},'每周复盘',ids.length);}
function deleteClasses(ids){if(!ids.length){toast('没有可删除的班级');return;}
  const run=()=>{ids.forEach(id=>{S.classes=S.classes.filter(y=>y.id!==id);S.students=S.students.filter(y=>y.classId!==id);S.violations=S.violations.filter(y=>y.cls!==id);S.homeworks=S.homeworks.filter(y=>y.cls!==id);S.answers=S.answers.filter(y=>{const st=stu(y.studentId);return st&&st.classId!==id;});S.plan=S.plan.filter(y=>y.classId!==id);});};
  if(ids.length===1){run();save();viewReload('students');toast('班级及学生已删除');return;}
  delPendingDo(()=>{run();save();viewReload('students');},'班级（含学生与记录）',ids.length);}
function deleteStudents(ids){if(!ids.length){toast('没有可删除的学生');return;}
  const run=()=>{ids.forEach(id=>{S.students=S.students.filter(s=>s.id!==id);S.violations=S.violations.filter(v=>v.studentId!==id);S.homeworks=S.homeworks.filter(h=>h.studentId!==id);S.answers=S.answers.filter(a=>a.studentId!==id);});};
  if(ids.length===1){run();save();viewReload('students');toast('已删除 1 名学生');return;}
  delPendingDo(()=>{run();save();viewReload('students');},'学生',ids.length);}
function deleteTimetable(ids){if(!ids.length){toast('没有可删除的课表');return;}
  const run=()=>{S.timetable=S.timetable.filter(t=>!ids.includes(t.id));if(S.ttBySem)Object.keys(S.ttBySem).forEach(k=>{S.ttBySem[k]=S.ttBySem[k].filter(t=>!ids.includes(t.id));});};
  if(ids.length===1){run();save();viewReload('settings');toast('已删除 1 节课表');return;}
  delPendingDo(()=>{run();save();viewReload('settings');},'课表',ids.length);}
function deletePlan(ids){if(!ids.length){toast('没有可删除的教学任务');return;}
  const run=()=>{S.plan=S.plan.filter(p=>!ids.includes(p.id));S.plan.forEach((p,k)=>p.order=k+1);};
  if(ids.length===1){run();save();viewReload('settings');toast('已删除 1 条教学任务');return;}
  delPendingDo(()=>{run();save();viewReload('settings');},'教学任务',ids.length);}

/* 导入：文件窗选 JSON；与现有资料重叠时只保留一份（按 班级+课程+学期 去重并合并进度记录） */
let _courseImportInput=null;
function courseImportInput(){if(!_courseImportInput){_courseImportInput=document.createElement('input');_courseImportInput.type='file';_courseImportInput.accept='.json,application/json';_courseImportInput.style.display='none';
  _courseImportInput.addEventListener('change',()=>{const f=_courseImportInput.files&&_courseImportInput.files[0];_courseImportInput.value='';if(!f){clearCourseIeMode();return;}const rd=new FileReader();rd.onload=()=>{try{const data=JSON.parse(rd.result);applyImportCourse(data,_courseImpCid);}catch(e){toast('文件解析失败，请选择导出的教学进度 JSON');}clearCourseIeMode();};rd.readAsText(f);});
  document.body.appendChild(_courseImportInput);}return _courseImportInput;}
function courseImportPick(){courseImportInput().click();}
function applyImportCourse(data,defaultCid){
  let arr=Array.isArray(data)?data:(data&&data.courses)?data.courses:null;
  if(!arr||!arr.length){toast('文件中未找到教学进度数据');return;}
  const cur=(S.courses=S.courses||[]);
  const byKey=c=>(c.cls||'')+'§'+(c.name||'')+'§'+(c.sem||'');
  const exist=new Map();cur.forEach(c=>{if(!c.archived)exist.set(byKey(c),c);});
  let added=0,merged=0;
  arr.forEach(raw=>{
    const name=String(raw.name||'').trim();if(!name)return;
    const def=defaultCid?(course(defaultCid)||{}):{};
    const cls=String(raw.cls||'').trim()||(def.cls||'');
    const sem=String(raw.sem||'').trim()||(def.sem||'');
    const key=cls+'§'+name+'§'+sem;
    const ex=exist.get(key);
    if(ex){
      const seen=new Set((ex.progressLog||[]).map(r=>r.id||(r.date+'|'+r.progress)));
      (raw.progressLog||[]).forEach(r=>{const rid=r.id||(r.date+'|'+r.progress);if(!seen.has(rid)){seen.add(rid);ex.progressLog=ex.progressLog||[];ex.progressLog.push(r);merged++;}});
    }else{
      const nc={id:uid(),name,cls,sem,subject:raw.subject||'',color:raw.color||'#4f6bed',nextTask:raw.nextTask||'',unfinished:raw.unfinished||[],progressLog:raw.progressLog||[],archived:false};
      cur.push(nc);exist.set(key,nc);added++;
    }
  });
  save();viewReload('courses');
  toast('导入完成：新增 '+added+' 条，合并 '+merged+' 条重复进度记录');
}

let LP_TIMER=null,LP_FIRED=false,LP_HOLD_TIMER=null,LP_EL=null;
const LP_MS=500,LP_HOLD_DELAY=140;
function gradeLpAction(el){
  const t=el.getAttribute('data-lp');if(!t)return;
  if(t==='grade-del'){const b=document.getElementById('grade_del_btn');gradeIeAll('delete');if(b){b.classList.add('active');setTimeout(()=>b.classList.remove('active'),400);}}
  else if(t==='grade-arc'){const b=document.getElementById('grade_arc_btn');gradeIeAll('archive');if(b){b.classList.add('active');setTimeout(()=>b.classList.remove('active'),400);}}
  else if(t==='grade-exp'){const b=document.getElementById('grade_exp_btn');gradeIeAll('export');if(b){b.classList.add('active');setTimeout(()=>b.classList.remove('active'),400);}}
  else if(t==='grade-open-exam'){const id=el.getAttribute('data-id');if(id){clearGradeIeMode();S._gradeExam=id;S._gradeView='score';viewReload('grades');}}
  else if(t==='stu-exp'){clearStuIeMode();const b=document.getElementById('stu_exp_btn');if(b)b.classList.add('active');doExportClasses(null);if(b)setTimeout(()=>b.classList.remove('active'),400);}
  else if(t==='todo-exp'){clearTodoIeMode();const b=document.getElementById('todo_exp_btn');if(b)b.classList.add('active');exportTodos(null);if(b)setTimeout(()=>b.classList.remove('active'),400);}
  else if(t==='todo-del'){clearTodoIeMode();const b=document.getElementById('todo_del_btn');if(b)b.classList.add('active');todoDeleteAll();if(b)setTimeout(()=>b.classList.remove('active'),400);}
  else if(t==='todo-edit'){const tid=el.getAttribute('data-id');if(tid)modalTodo(tid);}
  else if(t==='tt-card-course'){const cid=el.getAttribute('data-cls');const card=el.closest('.tl-card');const subj=card&&card.querySelector('.tl-subj')?card.querySelector('.tl-subj').textContent.trim():'';const cl=cid?cls(cid):null;const cn=cl?cl.name:'';
  /* 宽松匹配：去空格与「课」字（数学课→数学），并兼容 course.cls 曾被存为班级 id 的情况；匹配不到则按 班级+科目 自动建一门课，确保长按永远进记录页 */
  const norm=s=>(s||'').replace(/[\s课]/g,'');
  let co=S.courses.find(c=>!c.archived&&norm(c.subject)===norm(subj)&&(norm(c.cls)===norm(cn)||c.cls===cid));
  if(!co){const newId=uid();co={id:newId,name:(cn||'未命名班级')+(subj||''),cls:cn,subject:subj,sem:curSemName(),color:AV[0],archived:false,nextTask:'',unfinished:[],progressLog:[]};S.courses.push(co);}
  modalProgress(co.id);}
  else if(t==='note-exp'){const b=document.getElementById('note_exp_btn');if(b)b.classList.add('active');exportNotes();if(b)setTimeout(()=>b.classList.remove('active'),400);}
  else if(t==='review-exp'){const b=document.getElementById('review_exp_btn');if(b)b.classList.add('active');exportAllReviews();if(b)setTimeout(()=>b.classList.remove('active'),400);}
  else if(t==='course-del'){const b=document.getElementById('course_del_btn');courseIeAll('delete');if(b){b.classList.add('active');setTimeout(()=>b.classList.remove('active'),400);}}
  else if(t==='course-exp'){const b=document.getElementById('course_exp_btn');courseIeAll('export');if(b){b.classList.add('active');setTimeout(()=>b.classList.remove('active'),400);}}
  else if(t==='course-imp'){clearCourseIeMode();const b=document.getElementById('course_imp_btn');if(b)b.classList.add('active');_courseImpCid=null;courseImportInput().click();if(b)setTimeout(()=>b.classList.remove('active'),400);}
  else if(t==='tt-exp'){const b=document.querySelector('[data-action="exp-tt"]');if(b)b.classList.add('active');exportTimetable();if(b)setTimeout(()=>b.classList.remove('active'),400);}
  else if(t==='plan-exp'){const b=document.querySelector('[data-action="exp-plan"]');if(b)b.classList.add('active');exportPlan();if(b)setTimeout(()=>b.classList.remove('active'),400);}
  else if(t==='note-del'){const b=document.getElementById('note_del_btn');delAll('notes');if(b){b.classList.add('active');setTimeout(()=>b.classList.remove('active'),400);}}
  else if(t==='review-del'){const b=document.getElementById('review_del_btn');delAll('reviews');if(b){b.classList.add('active');setTimeout(()=>b.classList.remove('active'),400);}}
  else if(t==='class-del'){const b=document.getElementById('class_del_btn');delAll('classes');if(b){b.classList.add('active');setTimeout(()=>b.classList.remove('active'),400);}}
  else if(t==='stu-del'){const b=document.getElementById('stu_del_btn');delAll('students');if(b){b.classList.add('active');setTimeout(()=>b.classList.remove('active'),400);}}
  else if(t==='tt-del'){const b=document.getElementById('tt_del_btn');delAll('timetable');if(b){b.classList.add('active');setTimeout(()=>b.classList.remove('active'),400);}}
  else if(t==='plan-delmode'){const b=document.getElementById('plan_del_btn');delAll('plan');if(b){b.classList.add('active');setTimeout(()=>b.classList.remove('active'),400);}}

function applyImportClass(sheets,cid){

    const rows=(stuSheet.rows||[]).filter(r=>r.length);

    const isFull=(rows[0]||[]).some(c=>String(c).includes('班级'));/* 全量导出 6 列；否则 2 列姓名+积分 */

  }
  /* 关联表按姓名回查 sid；缺则即时建生 */
  const ensureStu=nm=>{if(!nm)return '';if(stuMap[nm])return stuMap[nm];
    const sid=uid();stuMap[nm]=sid;
    S.students.push({id:sid,name:nm,classId:cid,points:0,concern:false,todoItems:[],contactItems:[]});
    cnt.stu++;return sid;};
  const link=(sheetName,mapFn)=>{const sh=find(sheetName);if(!sh)return;
    const rows=(sh.rows||[]).filter(r=>r.length);
    const start=rows.length&&rows[0].some(c=>String(c).includes('姓名'))?1:0;

  link('违纪',(sid,r)=>{S.violations.push({id:uid(),cls:cid,studentId:sid,type:r[1]||'',date:r[2]||'',note:r[3]||'',delta:parseInt(r[4])||0});cnt.vio++;});
  link('作业',(sid,r)=>{S.homeworks.push({id:uid(),cls:cid,studentId:sid,title:r[1]||'',status:r[2]||'done',date:r[3]||'',delta:parseInt(r[4])||0});cnt.hw++;});
  link('答题',(sid,r)=>{S.answers.push({id:uid(),studentId:sid,result:r[1]==='答对'?'correct':r[1]==='答错'?'wrong':'skip',date:r[2]||'',delta:parseInt(r[3])||0});cnt.ans++;});
  const sum=cnt.stu+cnt.vio+cnt.hw+cnt.ans;
  if(!sum){toast('未识别到可导入的内容');return;}
  save();reloadCur('students');

}

function archiveSheets(a){const nameOf=id2=>(a.students.find(s=>s.id===id2)||{}).name||'';
  const sRows=[['姓名','班级','积分','需关注','跟进','沟通'],...a.students.map(s=>[s.name,a.className,s.points,s.concern?'是':'否',(s.todoItems||[]).map(x=>x.text).join('、'),(s.contactItems||[]).map(x=>x.text).join('、')])];
  const vRows=[['姓名','类型','日期','备注','积分'],...(a.violations||[]).map(v=>[nameOf(v.studentId),v.type,v.date,v.note||'',v.delta])];
  const hRows=[['姓名','作业','状态','日期','积分'],...(a.homeworks||[]).map(h=>[nameOf(h.studentId),h.title,h.status,h.date,h.delta])];
  const aRows=[['姓名','结果','日期','积分'],...(a.answers||[]).map(x=>[nameOf(x.studentId),x.result,x.date,x.delta])];
  const exs=(a.exams||[]).slice().sort((x,y)=>x.date.localeCompare(y.date));
  const gHeader=['学生',...exs.map(e=>e.name+'('+e.date+')'),'平均'];
  const gRows=a.students.map(s=>{const scs=exs.map(e=>e.scores[s.name]);const valid=scs.filter(v=>v!=null);
    const avg=valid.length?valid.reduce((x,y)=>x+y,0)/valid.length:'';return [s.name,...scs.map(v=>v==null?'':v),avg];});
  const pRows=[['任务','已完成'],[...(a.plan||[]).map(p=>[p.title,p.done?'是':'否'])]];
  const sheets=[{name:'学生',rows:sRows},{name:'违纪',rows:vRows},{name:'作业',rows:hRows},{name:'答题',rows:aRows}];
  if(exs.length)sheets.push({name:'成绩',rows:[gHeader,...gRows]});
  if((a.plan||[]).length)sheets.push({name:'教学任务安排',rows:pRows});
  if((a.courses||[]).length){const prows=[['课程','日期','时间','进度','下节课任务','未完成']];(a.courses||[]).forEach(c=>(c.progressLog||[]).forEach(r=>prows.push([c.name,r.date,r.time||'',r.progress+'%',r.nextTask||'',(r.unfinished||[]).join('、')])));if(prows.length>1)sheets.push({name:'教学进度记录',rows:prows});}
  return {sheets,csv:toCsv(sRows)};}

function runArchive(){
  const cid=S._arcClass||ALL_CLASS, ct=S._arcContent||'all';
  const sem=curSem()?curSem().id:'';
  const semName=semNameOfId(sem);
  const cids=cid===ALL_CLASS?S.classes.map(c=>c.id):[cid];
  const clsNames=cids.map(id=>cls(id)?cls(id).name:id).join('、');
  const obj={id:uid(),sem,semName,name:(cids.length>1?semName+'归档':semName+'-'+clsNames+'归档'),archivedAt:todayISO(),content:ct,classes:[],students:[],violations:[],homeworks:[],answers:[],exams:[],plan:[],courses:[]};
  let total=0;
  cids.forEach(c=>{const snap=snapshotFor(c,ct);
    obj.classes.push({id:snap.classId,name:snap.className,count:snap.count});
    obj.students=obj.students.concat(snap.students);
    obj.violations=obj.violations.concat(snap.violations||[]);
    obj.homeworks=obj.homeworks.concat(snap.homeworks||[]);
    obj.answers=obj.answers.concat(snap.answers||[]);
    obj.exams=obj.exams.concat(snap.exams||[]);
    obj.plan=obj.plan.concat(snap.plan||[]);
    obj.courses=obj.courses.concat(snap.courses||[]);
    total+=snap.count;
    removeContentFor(c,ct);});
  obj.count=total;
  const before=(S.archives=S.archives||[]).length;
  S.archives=upsertArc(S.archives,o=>o.sem,obj);
  save();viewReload('settings');toast((before&&(S.archives.length===before)?'已覆盖更新':'已归档')+'班级归档（'+semName+' · '+obj.classes.length+' 个班级 · 按学期唯一）');}

/* ===== 云端同步（GitHub Contents API） ===== */
const CLOUD_KEY='tw_cloud_cfg';
const GH_API='https://api.github.com';
const enc=s=>encodeURIComponent(s);
let cloudReady=false, cloudPulling=false, cloudPushTimer=null, cloudPushing=false, cloudDirty=!!(cloudCfg().dirty);
function cloudCfg(){try{return JSON.parse(localStorage.getItem(CLOUD_KEY))||{};}catch(e){return {};}}
function cloudCfgSave(c){localStorage.setItem(CLOUD_KEY,JSON.stringify(c));}
function setCloudDirtyFlag(v){const cc=cloudCfg();cc.dirty=!!v;cloudCfgSave(cc);}
function b64enc(str){const b=new TextEncoder().encode(str);let s='';for(const x of b)s+=String.fromCharCode(x);return btoa(s);}
function b64dec(b64){const bin=atob(b64);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return new TextDecoder().decode(bytes);}
function ghHeaders(token,extra){return Object.assign({'Accept':'application/vnd.github+json','Authorization':'Bearer '+token,'Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},extra||{});}
function ghContentsPath(c){const segs=c.path.split('/').map(enc).join('/');return `/repos/${enc(c.owner)}/${enc(c.repo)}/contents/${segs}?ref=${enc(c.branch||'main')}`;}
function updateCloudStatus(state,msg){
  const el=document.getElementById('cloud_status');if(!el)return;
  el.textContent=msg||(state==='pulling'?'同步中…':state==='ok'?'已同步':state==='error'?'同步错误':'');
  el.style.color=state==='ok'?'var(--ok)':state==='error'?'var(--danger)':'var(--text-2)';
}
function readCloudForm(){
  const c=cloudCfg();const g=id=>document.getElementById(id);
  c.token=(g('cloud_token').value||'').trim();
  c.owner=(g('cloud_owner').value||'').trim();
  c.repo=(g('cloud_repo').value||'').trim();
  c.branch=(g('cloud_branch').value||'').trim()||'main';
  c.path=(g('cloud_path').value||'').trim()||'data.json';
  cloudCfgSave(c);return c;
}
function validateCloud(c){if(!c.token)return '请填写 Access Token';if(!c.owner||!c.repo)return '请填写仓库所有者和仓库名';if(!c.path)return '请填写文件路径';return '';}
function scheduleCloudPush(){
  const c=cloudCfg();
  if(!c.enabled||!cloudReady||cloudPulling)return;
  if(cloudPushTimer)clearTimeout(cloudPushTimer);
  // 基础 1.5s + 随机 0–6s 错开，避免两台设备同时保存后「锁步碰撞」反复 409
  const delay=1500+Math.random()*6000;
  cloudPushTimer=setTimeout(()=>{cloudPushTimer=null;cloudPush();},delay);
}
async function cloudGetSha(c){
  const r=await fetch(GH_API+ghContentsPath(c),{method:'GET',headers:ghHeaders(c.token)});
  if(r.status===404)return {sha:null,exists:false};
  if(r.status===401)throw new Error('HTTP 401 令牌无效或已过期');
  if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json();return {sha:j.sha,exists:true,content:j.content};
}
async function cloudPull(){
  const c=cloudCfg();
  if(!c.enabled||!c.token||!c.owner||!c.repo||!c.path)return {ok:false,reason:'未配置'};
  cloudPulling=true;updateCloudStatus('pulling','拉取中…');
  try{
    const g=await cloudGetSha(c);
    if(!g.exists)return {ok:false,reason:'empty',empty:true};
    const raw=b64dec((g.content||'').replace(/\s/g,''));
    const data=JSON.parse(raw);
    return {ok:true,data,sha:g.sha};
  }catch(e){return {ok:false,reason:e.message};}
  finally{cloudPulling=false;}
}
async function cloudPush(){
  const c=cloudCfg();
  if(!c.enabled||!c.token||!c.owner||!c.repo||!c.path)return;
  if(cloudPushing){scheduleCloudPush();return;}  // 防并发：推送在途则重新排队，避免慢网下丢写
  cloudPushing=true;
  updateCloudStatus('pulling','同步中…');
  let lastErr=null, pushed=false, mergedRemote=false;
  for(let attempt=0; attempt<6 && !pushed; attempt++){
    try{
      const g=await cloudGetSha(c);              // 每次都重新取最新 sha，规避 409
      // r93 方案 B：推送前先把远端合并进本地（按 id 并集 + 墓碑删除），绝不整体覆盖，
      // 因此「远端新增/删除」与「本地新增/删除」都不会在上传时被丢弃，双向收敛。
      if(g.exists && g.content){
        try{
          const rd=JSON.parse(b64dec((g.content||'').replace(/\s/g,'')));
          const m=mergeState(S,rd);
          if(JSON.stringify(m)!==JSON.stringify(S)){
            Object.assign(S,m);for(const k in DEFAULTS)store.set(k,S[k]);refreshSyncIds();refreshLocalTomb();mergedRemote=true;
          }
        }catch(_){/* 远端内容异常则按原样重试推送 */}
      }
      S._savedAt=Date.now();
      for(const k in DEFAULTS)store.set(k,S[k]);
      const payload=JSON.stringify(S);const b64=b64enc(payload);
      if(b64.length>1.4e6){cloudPushing=false;updateCloudStatus('error','数据超过单文件 1MB 上限，无法同步，请用「全部导出」');toast('同步失败：数据过大');return;}
      const body=JSON.stringify({message:'sync '+new Date().toISOString(),content:b64,branch:c.branch||'main',sha:g.sha||undefined});
      const r=await fetch(GH_API+ghContentsPath(c),{method:'PUT',headers:ghHeaders(c.token),body});
      if(r.status===401){lastErr='令牌无效或已过期，请在「设置-云端同步」重新填写 Access Token';break;}
      if(r.status===409){                         // 并发写入致 sha 不一致 → 退避后重试；下次再 GET 时会先合并对方的新数据
        lastErr='HTTP 409 写入冲突';
        if(attempt<5){await new Promise(res=>setTimeout(res,400+Math.random()*1200));continue;}
        break;
      }
      if(!r.ok)throw new Error('HTTP '+r.status+' '+((await r.text().catch(()=> ''))||'').slice(0,80));
      cloudDirty=false;setCloudDirtyFlag(false);
      const cfg=cloudCfg();cfg.lastSync=Date.now();cloudCfgSave(cfg);
      updateCloudStatus('ok',(mergedRemote?'已合并并同步 ':'已同步 ')+new Date().toLocaleTimeString());
      pushed=true;break;
    }catch(e){
      // 瞬时错误（网络抖动/限流 403）退避后重试，而非一次性放弃；仅 401 致命错误才中止
      lastErr=e.message;
      if(attempt<5){await new Promise(res=>setTimeout(res,500+Math.random()*1500));continue;}
      break;
    }
  }
  cloudPushing=false;
  if(!pushed){
    updateCloudStatus('error','同步失败：'+(lastErr||'未知错误'));toast('云端同步失败：'+(lastErr||'未知错误'));
    scheduleCloudPush();   // 本次彻底失败也再排一次重试，避免「不再编辑就永不重推」
  }
}
function hasLocalData(){return ['students','courses','classes','todos','notes','plan','timetable','reviews','exams','subjects'].some(k=>(S[k]||[]).length>0);}
function snapshotLocal(tag){try{store.set('_syncBackup',{tag:tag||'cloud-pull',at:Date.now(),state:JSON.parse(JSON.stringify(S))});}catch(e){}}
function cloudToggle(on){
  const c=cloudCfg();c.enabled=on;cloudCfgSave(c);
  viewReload('settings');
  if(on){cloudReady=false;cloudPulling=false;bootCloudSync();}
}
function cloudField(k,v){const c=cloudCfg();c[k]=(v||'').trim();cloudCfgSave(c);}
async function cloudTest(c){
  updateCloudStatus('pulling','测试中…');
  try{
    const r=await fetch(GH_API+`/repos/${enc(c.owner)}/${enc(c.repo)}`,{headers:ghHeaders(c.token)});
    if(r.ok){updateCloudStatus('ok','连接成功：仓库可访问');toast('连接成功');}
    else if(r.status===404)throw new Error('仓库不存在或无权限');
    else throw new Error('HTTP '+r.status);
  }catch(e){updateCloudStatus('error','连接失败：'+e.message);toast('连接失败：'+e.message);}
}
async function cloudSyncNow(c){
  const r=await cloudPull();
  if(r.ok&&r.data){
    // r93 方案 B：把远端按条目合并进本地（双方新增都保留、删除都同步），再上传合并结果保证双向收敛
    const m=mergeState(S,r.data);
    const changed=JSON.stringify(m)!==JSON.stringify(S);
    Object.assign(S,m);for(const k in DEFAULTS)store.set(k,S[k]);refreshSyncIds();refreshLocalTomb();
    updateCloudStatus('ok',(changed?'已与云端合并':'本地已是最新')+'，上传中…');router();
  }else if(!r.empty){toast('拉取失败：'+(r.reason||''));return;}
  await cloudPush();   // cloudPush 会再次合并远端后上传，保证两端一致
}
function cloudDisconnect(){localStorage.removeItem(CLOUD_KEY);cloudReady=false;cloudPulling=false;viewReload('settings');toast('已断开云端同步');}
async function bootCloudSync(){
  const c=cloudCfg();
  if(!c.enabled||!c.token||!c.owner||!c.repo||!c.path){cloudReady=true;return;}
  const r=await cloudPull();
  if(r.ok&&r.data){
    // r93 方案 B：启动即把云端按条目合并进本地（无论本地是否为空、哪边更新，都做并集+墓碑删除），
    // 再上传合并结果，保证「A 端输入→关闭 B 重开 B 即见 A 内容」以及「A 删的 B 也删」。
    const m=mergeState(S,r.data);
    const changed=JSON.stringify(m)!==JSON.stringify(S);
    Object.assign(S,m);for(const k in DEFAULTS)store.set(k,S[k]);refreshSyncIds();refreshLocalTomb();
    const cfg=cloudCfg();cfg.lastSync=Date.now();cloudCfgSave(cfg);
    updateCloudStatus('ok',changed?'已从云端合并同步':'已从云端同步');router();
    cloudReady=true;
    await cloudPush();   // 把合并结果回写云端，确保双向收敛
  }else if(r.empty){
    cloudReady=true;updateCloudStatus('pulling','初始化上传…');await cloudPush();
  }else{
    updateCloudStatus('error','云端连接失败：'+(r.reason||''));toast('云端同步未连接：'+(r.reason||''));cloudReady=true;
  }
}

function mergeArr(arr,items){items.forEach(it=>{if(!arr.some(x=>x.id===it.id))arr.push(it);});}

  mergeArr(S.students,d.students||[]);mergeArr(S.violations,d.violations||[]);mergeArr(S.homeworks,d.homeworks||[]);mergeArr(S.answers,d.answers||[]);mergeArr(S.exams,d.exams||[]);mergeArr(S.plan,d.plan||[]);mergeArr(S.courses,d.courses||[]);(d.courses||[]).forEach(c=>{c.archived=false;});
  mergeArr(S.todos,d.todos||[]);mergeArr(S.notes,d.notes||[]);mergeArr(S.reviews,d.reviews||[]);mergeArr(S.subjects,d.subjects||[]);mergeArr(S.semesters,d.semesters||[]);(d.semesters||[]).forEach(s=>{s.archived=false;});

function restoreTodoArc(id){const list=S.todoArchives=S.todoArchives||[];const t=list.find(x=>x.id===id);if(!t)return;if(!S.todos.some(x=>x.id===t.id))S.todos.push(t);S.todoArchives=S.todoArchives.filter(x=>x.id!==id);save();viewReload('settings');toast('已恢复教学待办');}

/* grade import-export */
/* r70：定位 姓名 / 分数 / 班级 三列（表头顺序任意，多余列如考号/性别/备注自动忽略）。clsIdx<0 表示文件没有班级列。 */
function findScoreColumns(h){
  const n=x=>String(x||'').replace(/\s/g,'');
  const nameIdx=h.findIndex(x=>/姓名|学生|name|student/i.test(n(x)));
  const scoreIdx=h.findIndex(x=>/分数|成绩|得分|score|mark/i.test(n(x)));
  const clsIdx=h.findIndex(x=>/^(班级|班|所在班级|班级名称|班级名|class|classname)$/i.test(n(x)));
  return {nameIdx,scoreIdx,clsIdx};}
function parseScoreRows(rows){const out=[];if(!rows.length)return out;
  let start=0;let nameIdx=0,scoreIdx=1;
  const h=rows[0].map(x=>String(x||'').trim());const fc=findScoreColumns(h);
  if(fc.nameIdx>=0&&fc.scoreIdx>=0){start=1;nameIdx=fc.nameIdx;scoreIdx=fc.scoreIdx;}
  rows.slice(start).forEach(r=>{const nm=String(r[nameIdx]||'').trim();const sc=parseFloat(String(r[scoreIdx]||'').replace(/["'\u201C\u201D]/g,''));if(nm&&!isNaN(sc))out.push([nm,sc]);});return out;}
/* r70：学生姓名 → 班级 id（供没有班级列的文件按花名册反查分班；同名取首个匹配） */
function stuClassMap(){const m={};(S.students||[]).forEach(s=>{if(s&&s.name&&s.classId&&!m[s.name])m[s.name]=s.classId;});return m;}
/* r70：文件里的班级文本 → 系统 classId。依次尝试：精确名 → 去空格/去「班」后缀 → 唯一编号 → （可选）自动新建班级。返回 {id,created} */
function gradeClassIdOf(t,autoCreate){
  const s=String(t==null?'':t).replace(/\s/g,'').trim();
  if(!s)return {id:'',created:false};
  const list=(S.classes||[]).filter(c=>c&&c.name&&c.name!=='全部班级');
  const act=list.filter(c=>!c.archived); /* 模糊/编号匹配只看未归档班，避免成绩误录进已归档班级 */
  const norm=v=>String(v||'').replace(/\s/g,'').replace(/班$/,'').toLowerCase();
  const num=v=>{const m=String(v||'').match(/[（(]?(\d+)[）)]?/);return m?m[1]:'';};
  let c=list.find(x=>x.name===s);
  if(!c){const ns=norm(s);if(ns)c=act.find(x=>norm(x.name)===ns);}
  if(!c){const ns=num(s);if(ns){const hit=act.filter(x=>num(x.name)===ns);if(hit.length===1)c=hit[0];}}
  if(c)return {id:c.id,created:false};
  if(!autoCreate)return {id:'',created:false};
  const nc={id:uid(),name:s};S.classes.push(nc);return {id:nc.id,created:true};}
/* r70：把一张表的行解析成「按班级分组」的成绩块（纯函数，便于单测）。
   rows 二维数组（可含表头，列顺序任意，多余列自动忽略）；defCls 导入弹窗选的班级（空/ALL_CLASS = 自动识别）；autoCreate 未知班级是否新建
   识别优先级：① 班级列 ② 花名册按姓名反查 ③ 导入弹窗选的班级 ④ 归入「未识别」(classId='')
   返回 {groups:{cid:{姓名:分数}}, order:[cid], mode:'col'|'roster'|'single', total, unmatched, created:[classId]} */
function gradeGroupsFromRows(rows,defCls,autoCreate){
  const res={groups:{},order:[],mode:'single',total:0,unmatched:0,created:[]};
  const src=(rows||[]).filter(r=>r&&r.length);
  if(!src.length)return res;
  const h=src[0].map(x=>String(x||'').trim());
  const fc=findScoreColumns(h);
  let start=0,nameIdx=0,scoreIdx=1,clsIdx=-1;
  if(fc.nameIdx>=0&&fc.scoreIdx>=0){start=1;nameIdx=fc.nameIdx;scoreIdx=fc.scoreIdx;clsIdx=fc.clsIdx;}
  const isAuto=!defCls||defCls===ALL_CLASS;
  const roster=clsIdx<0?stuClassMap():null;
  if(clsIdx>=0)res.mode='col';else if(roster&&Object.keys(roster).length)res.mode='roster';
  const items=[];
  src.slice(start).forEach(r=>{
    const nm=String(r[nameIdx]||'').trim();
    const sc=parseFloat(String(r[scoreIdx]||'').replace(/["'\u201C\u201D]/g,''));
    if(!nm||isNaN(sc))return;
    let cid='';
    if(clsIdx>=0){const m=gradeClassIdOf(r[clsIdx],autoCreate);cid=m.id||'';if(m.created&&res.created.indexOf(m.id)<0)res.created.push(m.id);}
    if(!cid&&roster)cid=roster[nm]||'';
    if(!cid&&!isAuto)cid=defCls;
    items.push([cid||'',nm,sc]);
  });
  items.forEach(function(it){const k=it[0];
    if(!res.groups[k]){res.groups[k]={};res.order.push(k);}
    if(res.groups[k][it[1]]==null)res.total++;
    res.groups[k][it[1]]=it[2];});
  res.unmatched=res.groups['']?Object.keys(res.groups['']).length:0;
  return res;}
/* r72：统一「归一化长表」解析（一张表 = 学生的每一场考试一行，列可含 学期/班级/考试名/科目/考试时间）。
   优先级：列值优先；缺列时回退导入弹窗的 学期/班级/科目/考试名 默认值。
   识别每个班的每一次考试 → 按 (sem|classId|examName|subjectId|date) 归组成一条 S.exams 记录。
   返回 {exams:[{subjectId,name,date,scores,classId,sem}],total,skipped,unmatched,createdClasses:[],createdSubjects:[]} */
function findUnifiedColumns(h){
  const n=x=>String(x||'').replace(/\s/g,'');
  const nameIdx=h.findIndex(x=>/姓名|学生|name|student/i.test(n(x)));
  const scoreIdx=h.findIndex(x=>/分数|成绩|得分|score|mark/i.test(n(x)));
  const clsIdx=h.findIndex(x=>/^(班级|班|所在班级|班级名称|班级名|class|classname)$/i.test(n(x)));
  const semIdx=h.findIndex(x=>/^(学期|学年|semester|sem)$/i.test(n(x)));
  const subjIdx=h.findIndex(x=>/^(科目|学科|课程|subject|course)$/i.test(n(x)));
  const examIdx=h.findIndex(x=>/^(考试名|考试名称|考试|测验名|测验|exam|test)$/i.test(n(x)));
  const dateIdx=h.findIndex(x=>/^(考试时间|考试日期|日期|时间|date)$/i.test(n(x)));
  return {nameIdx,scoreIdx,clsIdx,semIdx,subjIdx,examIdx,dateIdx};}
function gradeRecordsFromRows(allRows,subId,meta,autoCreate){
  const res={exams:[],total:0,skipped:0,unmatched:0,createdClasses:[],createdSubjects:[]};
  const src=(allRows||[]).filter(r=>r&&r.length);
  if(!src.length)return res;
  let hi=-1;
  for(let i=0;i<Math.min(src.length,12);i++){const h=src[i].map(x=>String(x||'').trim());const fc=findScoreColumns(h);if(fc.nameIdx>=0&&fc.scoreIdx>=0){hi=i;break;}}
  if(hi<0)return res;
  const h=src[hi].map(x=>String(x||'').trim());
  const fc=findScoreColumns(h);
  const uc=findUnifiedColumns(h);
  const nameIdx=fc.nameIdx,scoreIdx=fc.scoreIdx,clsIdx=fc.clsIdx;
  const semIdx=uc.semIdx,subjIdx=uc.subjIdx,examIdx=uc.examIdx,dateIdx=uc.dateIdx;
  const defName=meta.name||'',defSem=meta.sem||'';
  const defCls=(meta.classId&&meta.classId!==ALL_CLASS)?meta.classId:'';
  const isAuto=!meta.classId||meta.classId===ALL_CLASS;
  const roster=clsIdx<0?stuClassMap():null;
  const defDate=todayISO();
  const map={};
  src.slice(hi+1).forEach(r=>{
    const nm=String(r[nameIdx]||'').trim();
    const raw=String(r[scoreIdx]==null?'':r[scoreIdx]).replace(/["'\u201C\u201D]/g,'').trim();
    if(!nm||raw===''){res.skipped++;return;}
    const sc=parseFloat(raw);
    if(isNaN(sc)){res.skipped++;return;}
    let cid='';
    if(clsIdx>=0){const m=gradeClassIdOf(r[clsIdx],autoCreate);cid=m.id||'';if(m.created&&res.createdClasses.indexOf(m.id)<0)res.createdClasses.push(m.id);}
    if(!cid&&roster)cid=roster[nm]||'';
    if(!cid&&!isAuto)cid=defCls;
    if(!cid)res.unmatched++;
    let sub=subId||'';
    if(subjIdx>=0){const s=String(r[subjIdx]||'').trim();if(s){const ex=S.subjects.find(x=>x.name===s);sub=ex?ex.id:ensureSubj(s);if(!ex&&res.createdSubjects.indexOf(sub)<0)res.createdSubjects.push(sub);}}
    if(!sub)return;
    const ename=(examIdx>=0)?String(r[examIdx]||'').trim():defName;
    if(!ename)return;
    let sem=defSem;
    if(semIdx>=0){const s=gradeSemOfText(String(r[semIdx]||'').trim());if(s)sem=s;}
    const date=(dateIdx>=0)?(normDateStr(String(r[dateIdx]||''))||defDate):defDate;
    const key=sem+'|'+cid+'|'+ename+'|'+sub+'|'+date;
    if(!map[key])map[key]={subjectId:sub,name:ename,date:date,scores:{},classId:cid,sem:sem};
    map[key].scores[nm]=sc;res.total++;
  });
  Object.keys(map).forEach(k=>{if(Object.keys(map[k].scores).length)res.exams.push(map[k]);});
  return res;}

/* 日期规范化：2026-03-15 / 2026/3/15 / 2026.3.15 / 2026年3月15日 / 3月15日 / 20260315 / Excel 日期序列号 → YYYY-MM-DD；无法解析返回 '' */
function normDateStr(v){
  let s=String(v==null?'':v).replace(/["'\u201C\u201D]/g,'').trim();
  if(!s)return '';
  let m=s.match(/(\d{4})\s*[年\-\/\.]\s*(\d{1,2})\s*[月\-\/\.]\s*(\d{1,2})/);
  if(m)return m[1]+'-'+String(+m[2]).padStart(2,'0')+'-'+String(+m[3]).padStart(2,'0');
  m=s.match(/^(\d{1,2})\s*[月\-\/\.]\s*(\d{1,2})\s*日?$/);
  if(m)return String(new Date().getFullYear())+'-'+String(+m[1]).padStart(2,'0')+'-'+String(+m[2]).padStart(2,'0');
  m=s.match(/^(\d{4})(\d{2})(\d{2})$/);
  if(m)return m[1]+'-'+m[2]+'-'+m[3];
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m)return m[1]+'-'+m[2]+'-'+m[3];
  if(/^\d{5}$/.test(s)){const n=+s;
    if(n>20000&&n<60000){const d=new Date(Date.UTC(1899,11,30)+n*86400000);
      return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');}}
  return '';}
/* 学期文本 → sem 值：已是 sem:/range: 原样返回；按学期名精确/模糊匹配；匹配不到返回 ''（由调用方回退默认学期） */
function gradeSemOfText(v){
  const s=String(v==null?'':v).trim();
  if(!s)return '';
  if(s.indexOf('sem:')===0||s.indexOf('range:')===0)return s;
  const norm=x=>String(x||'').replace(/\s/g,'').toLowerCase();
  const ns=norm(s),list=S.semesters||[];
  let t=list.find(x=>x.name===s);
  if(!t&&ns)t=list.find(x=>norm(x.name)===ns);
  if(!t&&ns)t=list.find(x=>{const nx=norm(x.name);return nx&&(nx.indexOf(ns)>=0||ns.indexOf(nx)>=0);});
  return t?('sem:'+t.id):'';}
/* 判断是否「单班多次考试」宽表：元信息行(科目/学期/日期) + 「姓名」表头行，其右侧每列 = 一场考试 */
function looksLikeWideTable(rows){
  const src=(rows||[]).filter(r=>r&&r.length);
  if(src.length<2)return false;
  let hasMeta=false,headCols=0,foundHead=false;
  for(let i=0;i<Math.min(src.length,8);i++){
    const L=String(src[i][0]==null?'':src[i][0]).replace(/\s/g,'');
    if(/^(科目|学科|学期|日期|考试时间|考试日期)$/.test(L))hasMeta=true;
    if(/^(姓名|学生|学生姓名|name)$/i.test(L)){
      foundHead=true;
      headCols=(src[i]||[]).slice(1).filter(x=>String(x==null?'':x).trim()!=='').length;
      /* 表头行若带「分数/成绩」列 → 是长表（单次考试多班），不是宽表 */
      const fc=findScoreColumns(src[i].map(x=>String(x==null?'':x).trim()));
      if(fc.scoreIdx>=0)return false;
    }
  }
  if(foundHead&&hasMeta&&headCols>=1)return true;
  if(foundHead&&headCols>=2)return true;
  return false;}
/* 宽表 → 每列一场考试。模板：
     科目 | 数学 | 数学        学期 | 2026春 | 2026春        日期 | 2026-03-15 | 2026-04-20
     姓名 | 第一次月考 | 期中考试       张三 | 85 | 90
   返回 {exams:[{name,subjectId,date,sem,scores}],total,skipped,headRow} */
function gradeExamsFromWideRows(rows,defSubId,meta){
  const res={exams:[],total:0,skipped:0,headRow:-1};
  const src=(rows||[]).filter(r=>r&&r.length);
  if(src.length<2)return res;
  const lbl=i=>String(src[i][0]==null?'':src[i][0]).replace(/\s/g,'');
  let hi=-1;
  for(let i=0;i<Math.min(src.length,8);i++){if(/^(姓名|学生|学生姓名|name)$/i.test(lbl(i))){hi=i;break;}}
  if(hi<0)return res;
  res.headRow=hi;
  let subjRow=-1,semRow=-1,dateRow=-1;
  for(let i=0;i<hi;i++){
    const L=lbl(i);
    if(subjRow<0&&/^(科目|学科|subject)$/i.test(L))subjRow=i;
    else if(semRow<0&&/^(学期|semester|sem)$/i.test(L))semRow=i;
    else if(dateRow<0&&/^(日期|考试时间|考试日期|date)$/i.test(L))dateRow=i;
  }
  const head=src[hi],cols=[];
  for(let c=1;c<head.length;c++){
    const nm=String(head[c]==null?'':head[c]).trim();
    if(!nm)continue;
    const subRaw=subjRow>=0?String(src[subjRow][c]==null?'':src[subjRow][c]).trim():'';
    const semRaw=semRow>=0?String(src[semRow][c]==null?'':src[semRow][c]).trim():'';
    const dateRaw=dateRow>=0?String(src[dateRow][c]==null?'':src[dateRow][c]).trim():'';
    const subId=subRaw?ensureSubj(subRaw):(defSubId||'');
    const sem=(semRaw?gradeSemOfText(semRaw):'')||((meta&&meta.sem)||'');
    cols.push({name:nm,subjectId:subId,date:normDateStr(dateRaw)||todayISO(),sem:sem,scores:{}});
  }
  if(!cols.length)return res;
  src.slice(hi+1).forEach(r=>{
    const nm=String(r[0]==null?'':r[0]).trim();
    if(!nm)return;
    cols.forEach((col,ci)=>{
      const rawStr=String(r[ci+1]==null?'':r[ci+1]).replace(/["'\u201C\u201D]/g,'').trim();
      if(rawStr===''){res.skipped++;return;}
      const sc=parseFloat(rawStr);
      if(isNaN(sc)){res.skipped++;return;}
      col.scores[nm]=sc;res.total++;
    });
  });
  cols.forEach(c=>{if(Object.keys(c.scores).length)res.exams.push(c);});
  return res;}

/* 成绩管理导出：元信息块（考试/科目/日期/参考人数/班级平均/班级最高/班级最低）+ 数据表（姓名 + 每堂考试一列）。纯函数便于单测。被 exportGradeFiltered / exportExams 共用。 */
function buildGradeExport(exs,opts){
  if(!exs.length)return null;
  const subName=(opts&&opts.subName)||'全部科目';
  /* 参与学生（去重） */
  const nameSet=new Set();exs.forEach(e=>Object.keys(e.scores||{}).forEach(n=>nameSet.add(n)));
  const names=[...nameSet];
  /* 全部分数（汇总统计） */
  const allScores=exs.flatMap(e=>Object.values(e.scores||{}).filter(v=>v!=null&&!isNaN(v)));
  const cnt=names.length;
  const avg=allScores.length?Math.round(allScores.reduce((a,b)=>a+b,0)/allScores.length*100)/100:'';
  const max=allScores.length?Math.max.apply(null,allScores):'';
  const min=allScores.length?Math.min.apply(null,allScores):'';
  /* 元信息块 */
  const examLabel=exs.map(e=>e.name).join('-');
  const dateSet=[...new Set(exs.map(e=>e.date))];
  const dateLabel=dateSet.length===1?dateSet[0]:dateSet.join('、');
  const meta=[
    ['考试',examLabel],
    ['科目',subName],
    ['日期',dateLabel],
    ['参考人数',cnt],
    ['班级平均',avg],
    ['班级最高',max],
    ['班级最低',min],
  ];
  /* 数据表：姓名 + 每堂考试一列（多堂即多列） */
  const header=['姓名',...exs.map(e=>e.name)];
  const dataRows=names.slice().sort((a,b)=>{
    const sa=exs[0]&&exs[0].scores[a]!=null?exs[0].scores[a]:-Infinity;
    const sb=exs[0]&&exs[0].scores[b]!=null?exs[0].scores[b]:-Infinity;
    return (sb-sa)||a.localeCompare(b,'zh');
  }).map(n=>[n,...exs.map(e=>e.scores[n]==null?'':e.scores[n])]);
  const sheetRows=[...meta,[''],header,...dataRows];
  const csv=toCsv(sheetRows);
  const fname=(subName==='全部科目'?'':subName+'_')+examLabel+(cnt?'_'+cnt+'人':'')+'_成绩';
  return {sheetRows,csv,fname,meta,header,rows:dataRows};
}
function exportGradeFiltered(subId,sem,classId,examId){

load();
/* 一次性清理：旧版本会把「记录进度-未完成任务」自动写进教学待办（title 前缀【未完成·…】，src='unfinished'）。现改为不再写入，启动顺带清掉历史残留；幂等，无残留时不写盘以免触发云同步 */
if((S.todos||[]).some(t=>t.src==='unfinished')){S.todos=(S.todos||[]).filter(t=>t.src!=='unfinished');save();}
if(!S.seeded||S.seedVer!==SEED_VER){seed();}save();
applyTheme();buildNav();maybeAutoReview();cleanupPendingSubs();router();autoArchiveBySemester();
bootCloudSync();
/* r93：离开页面（切 App / 关标签页）即触发一次补推，确保本地未推送的编辑不丢（尤其 iOS 切走再回来） */
function flushOnLeave(){const c=cloudCfg();if(c.enabled&&cloudReady&&!cloudPushing)cloudPush();}
window.addEventListener('pagehide',flushOnLeave);
window.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushOnLeave();});
/* 双端同时在线的轮询拉取：每 25s 偷偷看一眼远端 _savedAt，比本地新就拉取并静默刷新（不弹 toast 避免打扰）
   用递归 setTimeout + unref，确保不阻止 Node 进程退出（否则在 jsdom 回归里会拖住退出） */
(function schedulePoll(){
  const t=setTimeout(async()=>{
    if(!(cloudPushTimer||cloudPushing||cloudPulling)){
      const c=cloudCfg();
      if(c.enabled&&c.token&&c.owner&&c.repo&&c.path&&cloudReady){
        try{
          const r=await fetch(GH_API+ghContentsPath(c),{method:'GET',headers:ghHeaders(c.token)});
          if(r.ok){
            const j=await r.json();
            const rd=(j.content?JSON.parse(b64dec((j.content||'').replace(/\s/g,''))):null);
            const remoteAt=(rd?rd._savedAt||0:0);
            const localAt=S._savedAt||0;
            // r93 方案 B：只要远端有内容就按条目合并进本地（并集+墓碑删除），不再仅以时间戳判断整体覆盖。
            // 即便本端 _savedAt 更新，远端的「增量新增/删除」也应并入，避免双端各自为政。
            if(rd && remoteAt>=0){
              const m=mergeState(S,rd);
              if(JSON.stringify(m)!==JSON.stringify(S)){
                Object.assign(S,m);for(const k in DEFAULTS)store.set(k,S[k]);refreshSyncIds();refreshLocalTomb();
                updateCloudStatus('ok','已自动从云端同步');reloadCur();          // 保持当前页
              }
            }
          }
        }catch(_){/* 网络/限流等异常一律静默，下一轮再试 */}
      }
    }
    schedulePoll();
  },25000);
  if(t&&t.unref)t.unref();
})();
window.addEventListener('hashchange',router);


</script>
