<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="DLpMhKzAmEHxzrY7Hs9Czp">
<head data-page-node-id="m5grhKPF7Q5BF0QoHjOnNV">
<meta charset="UTF-8" data-page-node-id="zOvgGNbGcnfUHcn7m9xv7W">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" data-page-node-id="1VKUQTv2YvbAyHdNcvuAcO">
<title>班主任工作台</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="班主任工作台">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta name="theme-color" content="#f5f7fb">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14161d">
<style>
:root{
  --bg:#f5f7fb; --panel:#ffffff; --panel-2:#f0f3f9; --ink:#1f2533; --ink-2:#5b6478;
  --line:#e4e8f0; --brand:#4f5bd5; --brand-soft:#eef0fb; --brand-ink:#3a45b0;
  --ok:#1f9d6b; --ok-soft:#e6f6ee; --warn:#d98a00; --warn-soft:#fdf2dc;
  --bad:#d9506b; --bad-soft:#fbe7ec; --radius:14px; --radius-s:9px;
  --shadow:0 1px 2px rgba(20,30,60,.05),0 6px 18px rgba(20,30,60,.06);
  --shadow-2:0 2px 6px rgba(20,30,60,.08),0 12px 30px rgba(20,30,60,.10);
  --sp:8px; --nav-w:240px;
}
html[data-theme="dark"]{
  --bg:#14161d; --panel:#1e2129; --panel-2:#262a34; --ink:#e8eaf0; --ink-2:#9aa3b6;
  --line:#2e333f; --brand:#7c87ec; --brand-soft:#2a2f4d; --brand-ink:#aab2f5;
  --ok:#33b884; --ok-soft:#1c2e27; --warn:#e0a93c; --warn-soft:#342b18;
  --bad:#e8738c; --bad-soft:#35212a; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.35);
  --shadow-2:0 2px 6px rgba(0,0,0,.35),0 12px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  touch-action:manipulation;/* 关闭双击缩放：iOS 上双击会整页放大 */
}
a,button,input,select,textarea,label{touch-action:manipulation}
*{-webkit-tap-highlight-color:transparent}/* 手机点按链接/按钮不再闪半透明黑块 */
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}

/* layout —— 桌面：导航条横在顶端一行；手机（≤767px）：隐藏顶栏，用底部导航 */
.app{display:flex;flex-direction:column;height:100vh;min-height:0}
.side{background:var(--panel);border-bottom:1px solid var(--line);display:flex;flex-direction:row;align-items:center;flex:none;height:54px;padding:0 14px;gap:4px}
/* 注意：Logo 用 .sb-brand，切勿写成 .brand——.brand 是 chip 的选中态变体（.chip.brand），同名会互相污染 */
.sb-brand{display:flex;align-items:center;gap:10px;padding:0 10px 0 0;font-weight:700;font-size:16px;flex:none}
.sb-brand .logo{width:30px;height:30px;border-radius:9px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:15px}
.nav{flex:1;overflow:auto;display:flex;align-items:center;gap:2px;padding:5px 8px;min-width:0;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;color:var(--ink-2);text-decoration:none;font-weight:500;white-space:nowrap;flex:none}
.nav a .ic{width:22px;text-align:center;font-size:16px;flex:none}
.nav a:hover{background:var(--panel-2)}
.nav a.active{background:var(--brand);color:var(--bg);font-weight:700;box-shadow:0 3px 10px color-mix(in srgb,var(--brand) 40%,transparent)}
.nav a.active:hover{background:var(--brand)}
.side-foot{padding:0 0 0 6px;display:flex;gap:8px;align-items:center;flex:none}
.icon-btn{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;width:34px;height:34px;display:grid;place-items:center;color:var(--ink-2);font-size:15px}
.icon-btn:hover{color:var(--ink)}

.main{min-width:0;flex:1;display:flex;flex-direction:column;min-height:0}
.topbar{height:58px;flex:none;display:flex;align-items:center;gap:12px;padding:0 22px;border-bottom:1px solid var(--line);background:var(--panel)}
.topbar h1{font-size:17px;margin:0;font-weight:700}
.topbar .sub{color:var(--ink-2);font-size:12.5px}
.topbar .spacer{flex:1}
.view{flex:1;overflow:auto;padding:22px;min-height:0}
.wrap{max-width:1240px;margin:0 auto}

/* cards & generic */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card.pad{padding:16px 12px}
/* 座位页「设置」展开区：桌面端用 display:contents 让三个子块内容完全混排（沿用原单排布局）；手机端改为纵向三排左对齐 */
.seat-cfg{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.seat-cfg>div{display:contents}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--ink-2)}
.small{font-size:12.5px}
.tiny{font-size:11.5px}
.btn{background:var(--brand);color:#fff;border:none;border-radius:10px;padding:9px 15px;font-weight:600;font-size:13.5px}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:var(--panel-2);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--line)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
/* 尺寸统一（第一轮：学生名册）：输入框/搜索框 36、导入·导出·添加 30、编辑·删除 24
   用 h36/h30/h24 三个高度类，后续其它页面统一尺寸时直接复用。 */
.fld.h36{height:36px;padding:0 11px}
.fld.h30{height:30px;padding:0 8px}
.btn.h30{height:30px;padding:0 4px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;font-size:12.5px;line-height:1}
.btn.h24{height:24px;padding:0 9px;display:inline-flex;align-items:center;justify-content:center;border-radius:7px;font-size:11.5px;line-height:1}
.btn.danger{background:var(--bad-soft);color:var(--bad);border:1px solid transparent}
.btn.danger:hover{background:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;background:var(--panel-2);color:var(--ink-2);font-size:12px;border:1px solid var(--line)}
.chip.brand{background:var(--brand-soft);color:var(--brand-ink);border-color:transparent}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
input.fld,select.fld,textarea.fld{
  width:100%;background:var(--panel);border:1px solid var(--line);border-radius:9px;
  padding:9px 11px;color:var(--ink);outline:none;
}
input.fld:focus,select.fld:focus,textarea.fld:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.field{margin-bottom:13px}
.field.row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
/* 两列表单行：子项允许收缩到内容以下（date/time/select 的固有宽度会撑破窄弹窗） */
.field.row>div{min-width:0}
input.fld[type=time],input.fld[type=date]{min-width:0}
/* 行为类型下拉（选择框+输入框）：下拉列出全部已设类别，支持手输新类型 */
.combobox{position:relative}
.combobox .fld{padding-right:30px}
.cb-arrow{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:22px;height:22px;border:none;background:transparent;color:var(--ink-2);cursor:pointer;font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;border-radius:6px}
.cb-arrow:hover{background:var(--panel-2);color:var(--ink)}
.cb-panel{position:absolute;z-index:40;left:0;right:0;top:calc(100% + 4px);max-height:240px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-2);padding:4px}
.cb-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 9px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--ink)}
.cb-item:hover{background:var(--brand-soft);color:var(--brand-ink)}
.cb-item .cb-p{font-size:11.5px;color:var(--ink-2);flex:none}
.cb-item.cb-new{color:var(--brand);font-weight:600}
.cb-item.cb-new:hover{background:var(--brand-soft)}
label.lbl{display:block;font-size:12.5px;color:var(--ink-2);margin-bottom:5px;font-weight:600}
.empty{padding:40px 20px;text-align:center;color:var(--ink-2)}
.empty .big{font-size:34px;opacity:.5;margin-bottom:8px}
.section-title{font-size:14px;font-weight:700;color:var(--ink);text-transform:none;margin:0 0 10px;letter-spacing:.01em}
/* 可折叠卡片（<details class="card collapse">，默认收起）：summary 用 flex 右对齐操作键，自绘箭头替代默认三角 */
details.collapse>summary{cursor:pointer;list-style:none;outline:none}
details.collapse>summary::-webkit-details-marker{display:none}
details.collapse>summary .chev{display:inline-block;margin-left:6px;font-size:11px;color:var(--ink-2);transition:transform .15s}
details.collapse[open]>summary .chev{transform:rotate(90deg)}

/* grid helpers */
.grid{display:grid;gap:14px}
.cols-2{grid-template-columns:repeat(2,1fr)}
.cols-3{grid-template-columns:repeat(3,1fr)}
.cols-4{grid-template-columns:repeat(4,1fr)}

/* home */
.hero{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}
/* task card (事务安排) */
.task-list{display:flex;flex-direction:column;gap:12px}
/* 事务安排页：保留边框卡片布局（首页为无边框+虚线，勿混用） */
.task-list .task-card{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:11px 14px}
.task-list .task-card + .task-card{border-top:1px solid var(--line)}
.task-list .task-card.done{background:var(--ok-soft)}
.task-card{display:flex;align-items:center;gap:14px;padding:11px 2px;background:transparent;border:none;border-radius:0;transition:background .15s}
.task-card + .task-card{border-top:1px dashed var(--line)}
.task-card:hover{background:color-mix(in srgb,var(--brand) 4%,transparent);border-radius:8px}
.task-card.done{background:var(--ok-soft);border-radius:8px}
.task-card .row1{display:flex;align-items:baseline;gap:10px;flex:1;min-width:0;line-height:1.45}
.task-card .date{font-weight:800;font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums;flex:none;min-width:46px}
.task-card .date.muted{color:var(--ink-3);font-weight:600}
.task-card .title{font-size:15px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task-card.done .title{text-decoration:line-through;color:var(--ink-2);font-weight:500}
.task-card .row2{display:flex;align-items:center;gap:10px;color:var(--ink-2);font-size:12px;margin-top:2px}
.task-card .row2 .lbl{flex:none}
.task-card .row2 .loc{flex:none}
.task-card .row2 .sep{color:var(--line)}
.task-check{width:22px;height:22px;border-radius:50%;border:2px solid #c4cbdb;flex:none;display:grid;place-items:center;background:var(--panel);transition:border-color .15s,background .15s;cursor:pointer;padding:0;color:transparent}
.task-check:hover{border-color:var(--ok)}
.task-check.done{background:var(--ok);border-color:var(--ok);color:#fff}
/* 已放弃（弃）：琥珀底 + 删除线，与已完成（绿）区分 */
.task-card.drop{background:var(--warn-soft);border-radius:8px}
.task-card.drop .title{text-decoration:line-through;color:var(--ink-2);font-weight:500}
/* 已完成/已放弃 按月份折叠 */
.fold-grp{margin-bottom:8px}
.fold-head{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:8px 11px;cursor:pointer;color:var(--ink);font-size:13px;font-weight:600}
.fold-head:hover{border-color:var(--brand)}
.fold-head .cnt{font-weight:400;color:var(--ink-2)}
html[data-theme="dark"] .task-check{border-color:#3a4252}
html[data-theme="dark"] .task-card:hover{background:color-mix(in srgb,var(--brand) 10%,transparent)}
.task-card .r-act{flex:none;opacity:.5;transition:opacity .15s}
.task-card:hover .r-act{opacity:1}
.task-card .r-act button{padding:3px 8px;border-radius:7px;border:1px solid transparent;background:transparent;color:var(--ink-2);font-size:12px;font-weight:600}
.task-card .r-act button:hover{background:var(--panel-2);color:var(--ink);border-color:var(--line)}
.task-card .r-act button.del:hover{color:var(--bad);background:var(--bad-soft);border-color:transparent}
/* compact variant inside home hero —— 无边框，条目间虚线分隔 */
.hero .today .task-card{padding:11px 14px;gap:12px;border-radius:12px;border:none;background:transparent}
.hero .today .task-card + .task-card{border-top:1px dashed var(--line)}
.hero .today .task-card .date{font-size:16px;min-width:40px}
.hero .today .task-card .title{font-size:14px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick a{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;padding:13px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);text-decoration:none;color:var(--ink);font-weight:600}
.quick a .qic{font-size:20px}
.quick a:hover{border-color:var(--brand);background:var(--brand-soft)}
.recent .r-item,.r-item{display:flex;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);align-items:flex-start}
.recent .r-item:last-child,.r-item:last-child{border-bottom:none}
.r-item:hover{background:var(--panel-2)}
.lead-row{display:flex;align-items:center;gap:8px;padding:2px 0}
.lead-row>label{width:48px;flex:none;text-align:right}
.lead-row .leader-sel{flex:1;min-width:0;padding:5px 8px;font-size:12.5px}
.r-dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 14%,transparent)}
.r-act{display:flex;gap:4px;flex:none;opacity:.55;transition:opacity .15s}
.r-item:hover .r-act,.r-act:focus-within{opacity:1}
.r-act button{padding:3px 8px;border-radius:7px;border:1px solid transparent;background:transparent;color:var(--ink-2);font-size:12px;font-weight:600}
.r-act button:hover{background:var(--panel);color:var(--ink);border-color:var(--line)}
.r-act button.del:hover{color:var(--bad);background:var(--bad-soft);border-color:transparent}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .n{font-size:24px;font-weight:800}
.stat .t{font-size:12px;color:var(--ink-2)}

/* table */
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th,table.tbl td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line)}
table.tbl th{color:var(--ink-2);font-weight:600;font-size:12.5px;position:sticky;top:0;background:var(--panel);z-index:1}
table.tbl th.mini,table.tbl td.mini{font-size:11px;font-weight:500;padding:9px 6px;white-space:nowrap}
table.tbl td.mini{font-variant-numeric:tabular-nums}
table.tbl tr:hover td{background:var(--panel-2)}
table.tbl td .act{display:inline-flex;gap:6px}
.plink{color:var(--brand-ink);text-decoration:none;border-bottom:1px dashed color-mix(in srgb,var(--brand) 55%,transparent);font-variant-numeric:tabular-nums;white-space:nowrap}
.plink:hover{border-bottom-style:solid}
/* 家长电话：号码前的 ☎ 小图标，提示可点击直接拨号 */
.plink .ic{font-size:11px;margin-right:2px;opacity:.8;border-bottom:none}
table.tbl th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
table.tbl th.sortable:hover{color:var(--brand-ink)}
table.tbl th.sortable.on{color:var(--brand-ink)}
.sort-ind{font-size:9px;margin-left:4px;opacity:.45}
table.tbl th.sortable.on .sort-ind{opacity:1}
.tbl-scroll{overflow:auto;max-height:62vh}
/* 名册表格：列间距 4px + 固定列宽，备注填充剩余 */
/* 固定列宽总和 516 + 备注最少 50 = 表格最小 566；fixed 布局下多余宽度全给 auto 的备注列 */
table.tbl.roster{table-layout:fixed;min-width:566px}
table.tbl.roster th,table.tbl.roster td{padding:9px 4px;text-align:center;vertical-align:middle}
table.tbl.roster .c-no{width:40px}
table.tbl.roster .c-name{width:50px}
table.tbl.roster .c-sex{width:50px}
table.tbl.roster .c-g{width:60px}
table.tbl.roster .c-tier{width:50px}
table.tbl.roster .c-phone{width:100px}
table.tbl.roster .c-h{width:50px}
table.tbl.roster .c-act{width:116px}
table.tbl.roster .c-note{width:auto;min-width:50px}
table.tbl.roster .c-no,table.tbl.roster .c-name,table.tbl.roster .c-sex,
table.tbl.roster .c-g,table.tbl.roster .c-tier,table.tbl.roster .c-h,
table.tbl.roster .c-act{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.tbl.roster .c-phone{white-space:normal;word-break:break-all;line-height:1.5}
table.tbl.roster .c-note{white-space:normal;word-break:break-word;line-height:1.45}
table.tbl.roster .c-tier{white-space:nowrap;text-align:center}
table.tbl.roster .c-tier .twrap{display:inline-flex;align-items:center;gap:3px;justify-content:center}
table.tbl.roster .c-tier .tiny{margin-left:1px}
table.tbl.roster .c-tier .chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;background:var(--panel-2);color:var(--ink-2);font-size:12px;font-weight:600;border:1px solid var(--line);min-width:22px;justify-content:center}
/* ABC 等级分色：A 绿 / B 琥珀 / C 红 */
table.tbl.roster .c-tier .chip.tier-a{background:var(--ok-soft);color:var(--ok);border-color:transparent}
table.tbl.roster .c-tier .chip.tier-b{background:var(--warn-soft);color:var(--warn);border-color:transparent}
table.tbl.roster .c-tier .chip.tier-c{background:var(--bad-soft);color:var(--bad);border-color:transparent}
/* 成绩表：列间距 4px + 固定列宽（姓名60 / 科目45 / 进退步45 / 排名40 / 总分50）
   width:auto → 表格收缩到列宽总和，不做整表拉伸（避免 fixed 布局按比例放大列宽） */
table.tbl.grades{width:auto}
table.tbl.grades th{white-space:nowrap}
table.tbl.grades th,table.tbl.grades td{padding:9px 4px;text-align:center}
table.tbl.grades .mini{padding:9px 4px}
table.tbl.grades .g-name{width:60px;min-width:60px;max-width:60px}
table.tbl.grades .g-sub{width:45px}
table.tbl.grades .g-mini{width:45px}
table.tbl.grades .g-rank{width:40px}
table.tbl.grades .g-total{width:50px}
table.tbl.roster th.sortable{padding:9px 4px}

/* modal */
.mask{position:fixed;inset:0;background:rgba(20,28,50,.4);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
.mask.show{display:flex}
.modal{background:var(--panel);border-radius:16px;box-shadow:var(--shadow-2);width:min(480px,100%);padding:20px;border:1px solid var(--line)}
.modal h3{margin:0 0 14px;font-size:16px}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}

/* tabs */
.tabs{display:flex;gap:4px;background:var(--panel-2);padding:4px;border-radius:11px;width:fit-content;margin-bottom:14px}
.tabs button{border:none;background:transparent;color:var(--ink-2);padding:7px 14px;border-radius:8px;font-weight:600;font-size:13px}
.tabs button.active{background:var(--panel);color:var(--brand-ink);box-shadow:var(--shadow)}

/* seating */
.seat-grid{display:grid;gap:8px;max-width:900px}
.seat-scroll{min-width:0}
.seat{aspect-ratio:1/1;min-height:48px;border:1.5px dashed var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--panel);font-size:12.5px;font-weight:600;color:var(--ink-2);user-select:none;position:relative}
.seat .no{font-size:10px;color:var(--ink-2);font-weight:500}
.seat .zn{position:absolute;top:3px;right:6px;font-size:9.5px;font-weight:800;line-height:1}
/* 等级分区色：与「学生等级」ABC 同色（A 绿 / B 琥珀 / C 红），便于视觉对应 */
.seat.zone-A{border:1.5px solid var(--ok);background:var(--ok-soft)}
.seat.zone-A .zn{color:var(--ok)}
.seat.zone-B{border:1.5px solid var(--warn);background:var(--warn-soft)}
.seat.zone-B .zn{color:var(--warn)}
.seat.zone-C{border:1.5px solid var(--bad);background:var(--bad-soft)}
.seat.zone-C .zn{color:var(--bad)}
.seat.markable{cursor:crosshair}
.seat.fixed{border-style:solid}
.seat .fx{position:absolute;top:3px;left:6px;font-size:9.5px;font-weight:800;line-height:1;color:var(--bad)}
/* 组长标识：大组长「大」/ 小组长「小」，落右下角（左上=固定、右上=等级分区） */
.seat .ld{position:absolute;bottom:3px;right:5px;font-size:9px;font-weight:800;line-height:1;padding:1px 3px;border-radius:4px;
  background:color-mix(in srgb,var(--brand) 20%,var(--panel));color:var(--brand-ink)}
.brush{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--line);background:var(--panel);font-size:12px;font-weight:700;color:var(--ink-2);cursor:pointer;flex:none;display:inline-flex;align-items:center;justify-content:center;line-height:1}
.brush:hover{border-color:var(--brand)}
.brush.on{border-color:var(--brand)}
/* 学习组合并 pill：紧凑、圆角 12，合并状态用浅品牌底 */
.study-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:11px;font-weight:600;color:var(--ink-2);cursor:pointer;flex:none}
.study-pill:hover{border-color:var(--brand);color:var(--ink)}
.study-pill.selected{background:var(--brand);border-color:var(--brand);color:#fff}
.study-pill.merged{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-ink);cursor:default}
.study-pill.merged:hover{background:var(--brand-soft)}
.study-pill .link-btn{padding:0 4px;border:0;background:transparent;color:var(--brand-ink);font-size:11px;cursor:pointer;font-weight:700}
.study-pill .link-btn:hover{color:var(--bad)}
.study-pill.r0{font-weight:500;font-size:11px;padding:2px 8px;border-radius:10px}
.study-pill.r0.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-ink)}
.study-pill input{margin:0;cursor:pointer;width:12px;height:12px;accent-color:var(--brand)}
.seat.filled{border-style:solid;border-color:var(--brand);background:var(--brand-soft);color:var(--brand-ink);cursor:grab}
/* 已入座且带等级分区：颜色固定为 A/B/C 分区色，不随入座变蓝（分区色优先于通用入座蓝） */
.seat.zone-A.filled{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.seat.zone-B.filled{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.seat.zone-C.filled{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.seat.filled:active{cursor:grabbing}
.seat.dragover{border-color:var(--ok);background:var(--ok-soft)}

/* 大组列分隔：每隔 bigGroup 列插入 1 根 8px 宽的虚线分隔条 */
.seat-col-sep{background:repeating-linear-gradient(to bottom,var(--line) 0 4px,transparent 4px 8px);width:8px;justify-self:center;border-radius:1px}
.seat-grid.grouped-cols{column-gap:6px}
/* 大组标签（横排） */
.group-label-row{display:grid;gap:8px;margin-bottom:6px;max-width:900px}
.group-label-row .g-lbl{font-size:11.5px;color:var(--ink-2);text-align:center;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.group-label-row .g-lbl.big{color:var(--brand-ink);border-bottom:1px dashed var(--line);padding-bottom:6px;margin-bottom:4px}
/* 学习组名侧栏：每个大组最左一条轨道，竖排显示「一A组」，纵向覆盖该学习组所有行 */
/* 关键：writing-mode 只加在内层 .st-txt 上，容器保持横排。
   若把 vertical-rl 放在 .st-tag 上，grid 的「行」会沿 block 轴 = 水平方向铺开，组名与按钮变成左右并排。 */
.st-tag{display:grid;grid-template-rows:auto auto;place-items:center;align-content:center;gap:6px;letter-spacing:2px;font-size:11.5px;font-weight:700;
  color:var(--brand-ink);background:var(--panel-2);border-radius:8px;border:1px dashed var(--line);min-height:48px;position:relative;cursor:default}
.st-txt{writing-mode:vertical-rl;letter-spacing:2px;justify-self:center;align-self:center}
.st-tag.r0{color:var(--ink-2);font-weight:600;letter-spacing:1px}
.st-tag.merged{color:var(--brand-ink);background:color-mix(in srgb,var(--brand) 12%,var(--panel-2));border-color:color-mix(in srgb,var(--brand) 35%,var(--line))}
/* 合模式下：标签可点、显示指针；选中态高亮；拆按钮浮现 */
.st-tag[onclick]{cursor:pointer}
.st-tag[draggable="true"]{cursor:grab}
.st-tag.dragging{opacity:.45}
.st-tag.dragover{border-color:var(--brand);box-shadow:0 0 0 2px color-mix(in srgb,var(--brand) 40%,transparent)}
.st-tag.sel{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 0 0 2px color-mix(in srgb,var(--brand) 30%,transparent)}
.st-tag.merged.sel{background:var(--brand);color:#fff}
/* 名 / 拆：整体落在组名下方（grid 第 2 行），两键上下排列——标签轨道仅 40px，横排会溢出到座位区 */
.st-btns{display:grid;grid-template-rows:auto auto;gap:3px;justify-self:center;align-self:end}
.st-split{letter-spacing:0;font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:999px;background:rgba(255,255,255,.55);color:var(--brand-ink);border:1px solid color-mix(in srgb,var(--brand) 35%,var(--line))}
.st-tag.merged:not(.sel) .st-split{background:rgba(255,255,255,.7)}
.st-tag.sel .st-split{background:rgba(255,255,255,.25);color:#fff;border-color:rgba(255,255,255,.5)}
/* 学习组：组内行间距 */
.seat-row-sep{height:14px;background:repeating-linear-gradient(to right,var(--line) 0 5px,transparent 5px 9px);justify-self:stretch;align-self:center;border-radius:1px}

/* points */
.pt-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line)}
.pt-row:last-child{border-bottom:none}
.pt-rank{width:26px;height:26px;border-radius:8px;background:var(--panel-2);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.pt-rank.top{background:var(--brand);color:#fff}
.pt-name{flex:1;font-weight:600}
.pt-score{font-weight:800;font-size:16px;min-width:54px;text-align:right}
.pt-btns{display:flex;gap:5px}
/* 可点开的链接态：个人姓名 / 学习组名 */
.pt-link{cursor:pointer;border-radius:6px;padding:0 2px;transition:color .12s,background .12s}
.pt-link:hover{color:var(--brand-ink);background:color-mix(in srgb,var(--brand) 10%,transparent)}
.grp-scores{display:flex;flex-direction:column;align-items:flex-end;gap:2px;margin-left:auto;flex:none}
.grp-scores .gs{font-size:11.5px;font-weight:500}
.grp-scores .gs b{font-size:14.5px;font-weight:800;font-variant-numeric:tabular-nums}
.grp-box{display:flex;align-items:center;gap:10px;padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
.grp-score{font-weight:800;font-size:18px;margin-left:auto}
.member-pill{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line)}
/* redeem（积分兑换） */
.rd-cat-h{font-size:13px;font-weight:700;margin:14px 0 8px;display:flex;align-items:center;gap:8px}
.rd-cat-h:first-child{margin-top:0}
.rd-cat-tag{font-size:11px;font-weight:600;color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:2px 9px;background:var(--panel-2)}
.rd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.rd-item{border:1px solid var(--line);border-radius:11px;background:var(--panel);padding:12px;display:flex;flex-direction:column;gap:7px}
.rd-item .rd-name{font-weight:700;font-size:13.5px;line-height:1.3}
.rd-item .rd-cost{color:var(--brand-ink);font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.rd-item .rd-cost small{font-size:11px;font-weight:600;color:var(--ink-2)}
.rd-item .rd-foot{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:2px}
.rd-item .rd-stock{font-size:11px;color:var(--ink-2)}
.rd-item .rd-stock.out{color:var(--bad);font-weight:700}
.rd-mgr-cat{display:flex;align-items:center;gap:6px;padding:5px 0}
.rd-mgr-cat input.fld{flex:1}
.rd-mgr-item{border:1px solid var(--line);border-radius:10px;padding:9px;margin-bottom:8px;background:var(--panel-2)}
.rd-mgr-item .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rd-mgr-item .row .fld{flex:1;min-width:0}
/* 个人积分榜：可兑换积分（积分榜副行） */
.pt-rdm{display:block;font-size:11px;font-weight:700;color:var(--brand-ink);margin-top:2px;font-variant-numeric:tabular-nums}
/* 消除扣分：每条扣分记录行 */
.el-pen{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:8px}
.el-pen.done{opacity:.6}
.el-pen .el-name{font-weight:700;font-size:13px}

/* lottery */
.lottery-stage{height:230px;border-radius:18px;background:rad(--panel-2);border:1px solid var(--line);display:grid;place-items:center;font-size:46px;font-weight:800;letter-spacing:.04em;color:var(--brand-ink);position:relative;overflow:hidden}
.lottery-stage.roll{background:var(--brand-soft)}
.lottery-stage .lbl{position:absolute;top:14px;left:18px;font-size:13px;font-weight:600;color:var(--ink-2);letter-spacing:.04em}
.drawn-list .d{display:inline-flex;align-items:center;padding:5px 11px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);margin:4px;font-size:12.5px}
/* 惩罚抽取：舞台比抽人矮，字号小（惩罚文字较长），允许换行 */
.lottery-stage.pun{height:150px;font-size:30px;line-height:1.35;padding:30px 20px 0;text-align:center;word-break:break-word}
.pun-log{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:6px}
.pun-log .no{flex:none;min-width:20px;font-size:12px;font-weight:700;color:var(--ink-2);text-align:right}
.pun-log .chk{flex:none;display:flex;align-items:center;cursor:pointer}
.pun-log .chk input{width:16px;height:16px;margin:0;cursor:pointer;accent-color:var(--ok)}
.pun-log.done{opacity:.6}
.pun-log.done .txt{text-decoration:line-through}

/* schedule */
.sched-scroll{overflow-x:auto}
.sched{display:grid;grid-template-columns:max-content repeat(5,minmax(0,1fr));gap:6px}
.sched-head,.sched-row{display:contents}
.sched .p{display:grid;place-items:center;align-content:center;gap:1px;font-size:12px;color:var(--ink-2);font-weight:600;min-width:0;text-align:center;padding:0 2px;position:sticky;left:0;z-index:2;background:var(--panel)}
.sched .p>span{white-space:nowrap}
.sched .p .p-t{font-size:10px;color:var(--ink-3);font-weight:500;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:0;white-space:nowrap}
.sched .p.today{color:var(--brand-ink);background:color-mix(in srgb,var(--brand) 8%,var(--panel));border-radius:8px}
.sched .cell{position:relative;min-height:46px;border:1px solid var(--line);border-left:3px solid var(--line);border-radius:9px;background:var(--panel);padding:6px 8px;font-size:12px;display:flex;flex-direction:column;justify-content:center;gap:2px;overflow:hidden}
.sched .cell.today{background:var(--brand-soft)}
.sched .cell .sub{font-weight:700;font-size:12.5px;white-space:nowrap;align-self:center}
.sched .cell .tch{color:var(--ink-2);font-size:11px;white-space:nowrap;align-self:center}
.sched .cell .wtag{font-style:normal;font-weight:700;font-size:9px;line-height:1;padding:2px 4px;border-radius:5px;background:var(--brand-soft);color:var(--brand-ink);margin-right:3px;vertical-align:1px}
.sched .cell .btns{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:3px;width:fit-content;align-self:center}
.cell-phone{flex:none;width:22px;height:20px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--brand-ink);font-size:12px;line-height:1;display:inline-grid;place-items:center;cursor:pointer;opacity:.7;transition:opacity .12s,border-color .12s,color .12s;text-decoration:none}
.cell-phone:hover{opacity:1;border-color:var(--brand);color:var(--brand)}
.cell-add{flex:none;width:22px;height:20px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink-3);font-size:12px;line-height:1;display:inline-grid;place-items:center;cursor:pointer;opacity:.55;transition:opacity .12s,border-color .12s,color .12s}
.sched .cell:hover .cell-add,.cell-add:hover{opacity:1;border-color:var(--brand);color:var(--brand-ink)}

/* work arrange */
.work-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--line);border-radius:11px;background:var(--panel);margin-bottom:8px}
.work-row .cd{display:flex;flex-direction:column;align-items:center;min-width:46px}
.work-row .cd .d{font-size:20px;font-weight:800;line-height:1}
.work-row .cd .u{font-size:11px;color:var(--ink-2)}

/* mobile bottom nav */
.bottom{display:none}
.more-drawer{position:fixed;inset:0;background:rgba(20,28,50,.4);z-index:60;display:none}
.more-drawer.show{display:block}
.more-sheet{position:absolute;left:0;right:0;bottom:0;background:var(--panel);border-radius:18px 18px 0 0;padding:14px;box-shadow:var(--shadow-2);max-height:70vh;overflow:auto}
.more-sheet a{display:flex;align-items:center;gap:11px;padding:12px 10px;border-radius:10px;text-decoration:none;color:var(--ink);font-weight:600}
.more-sheet a:hover{background:var(--panel-2)}
.more-sheet a .ic{font-size:16px}
.more-sheet .ttl{padding:8px 10px;color:var(--ink-2);font-size:12px;font-weight:700}

@media(max-width:1199px){
  /* 中等宽度桌面：顶栏导航只留图标 */
  .sb-brand .txt,.nav a .tx,.side-foot .tx{display:none}
}
@media(max-width:767px){
  /* iOS 防自动放大：输入框字号必须 ≥16px，否则 Safari 会在聚焦瞬间把整页放大 */
  input,select,textarea,input.fld,select.fld,textarea.fld{font-size:16px}
  .app{height:auto;min-height:100vh;overflow-x:hidden}
  .side{display:none}
  .main{height:auto;padding-bottom:64px;min-width:0}
  .topbar{position:sticky;top:0;z-index:20;padding:0 14px;gap:8px;min-width:0;background:var(--bg);border-bottom:none}
  .topbar h1{font-size:16px;min-width:0}
  .topbar .sub{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;max-width:100%}
  .topbar > div{min-width:0;flex:1}
  .view{padding:14px}
  /* 手机端底部导航：展示全部模块，横向可滑动；隐藏滚动条，切换页面时自动把当前项滚到可视区 */
  .bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);z-index:40;padding:6px 4px;justify-content:flex-start;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .bottom::-webkit-scrollbar{display:none}
  /* 从主屏幕图标打开（无地址栏/全屏）时，避开 iPhone 底部横条 */
  .bottom{padding-bottom:calc(6px + env(safe-area-inset-bottom))}
  .main{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
  .bottom a{flex:0 0 auto;min-width:64px;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--ink-2);font-size:11px;font-weight:600;padding:4px 2px;white-space:nowrap}
  .bottom a .ic{font-size:18px}
  .bottom a.active{color:var(--brand-ink);background:var(--brand-soft);border-radius:11px;font-weight:700;padding:4px 8px}
  .hero{grid-template-columns:1fr;min-width:0}
  .hero > *{min-width:0}
  .hero .today .between.row{flex-wrap:wrap;gap:6px}
  .hero .today .between.row > .chip{margin-left:auto}
  .quick{grid-template-columns:1fr 1fr;min-width:0}
  .quick a{min-width:0}
  .cols-2,.cols-4{grid-template-columns:1fr}
  .cols-3{grid-template-columns:repeat(3,1fr);gap:8px}
  /* 首页统计卡（学生数/考试场次/今日完成）：手机端 3 列均分，数字略压避免最小屏拥挤 */
  .grid.cols-3 .stat .n{font-size:21px}
  .grid.cols-3 .stat .t{font-size:11.5px}
  .grid.cols-3 .card.pad{padding:12px 12px}
  .wrap{max-width:100%}
  .modal{width:100%}
  /* 手机端兜底：任何残余超宽内容不再把整页撑出横向滚动；
     超宽表格已在 .tbl-scroll、课表已在 .sched-scroll 内各自横向滚动 */
  .view{overflow-x:hidden;padding:12px 16px}
  .card.pad{padding:12px 12px}
  /* 手机端：座位设置展开区改为纵向三排、左对齐 */
  .seat-cfg{flex-direction:column;align-items:flex-start;gap:10px}
  .seat-cfg>div{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0;max-width:none}
  /* 手机端：座位图横向滚动，保证每格至少 52px 可读；
     大组标签与座位通过 subgrid 共用父 grid 的列轨道，避免两独立 grid 因内容宽度不同而错位 */
  .seat-scroll{display:grid;width:100%;max-width:100%;box-sizing:border-box;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px;gap:6px}
  .seat-scroll .group-label-row,
  .seat-scroll .seat-grid{display:grid;grid-template-columns:subgrid;grid-column:1 / -1;min-width:0;max-width:none;margin-bottom:0;gap:6px}
  .seat{min-width:52px;min-height:52px;font-size:11px}
  .seat .no{font-size:9px}
  .seat .zn{font-size:8px;top:2px;right:4px}
  .seat .fx{font-size:8px;top:2px;left:4px}
  .seat .ld{font-size:8px;bottom:2px;right:3px}
  .seat-col-sep{width:6px}
  .st-tag{min-height:52px;font-size:10px}
  .tbl-scroll{max-height:none;-webkit-overflow-scrolling:touch}
  .sched-scroll{-webkit-overflow-scrolling:touch}
  /* 手机端：周一~周五列等宽且给定最小宽度，内容多时仍可在 .sched-scroll 内横滑 */
  .sched{grid-template-columns:max-content repeat(5,minmax(88px,1fr))}
  /* 手机端隐藏所有滚动条（内容仍可滚动） */
  *{scrollbar-width:none}
  *::-webkit-scrollbar{display:none}
}

const BEH_TYPE_COLOR_MAP={

function typeColor(k){
  const t=String(k||"").trim();
  if(BEH_TYPE_COLOR_MAP[t])return BEH_TYPE_COLOR_MAP[t];
  let h=0;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))>>>0;
  return BEH_TYPE_PALETTE[h%BEH_TYPE_PALETTE.length];

function typeSoft(k){return `color-mix(in srgb, ${typeColor(k)} 12%, var(--panel))`;}
const uid=()=>Math.random().toString(36).slice(2,9);
function def(){

    /* 抽签：drawn = 本轮已抽学生；puns = 自定义惩罚项；punLogs = 惩罚抽取记录（只抽惩罚，不关涉学生） */
    lottery:{drawn:[],allowRepeat:false,puns:DEFAULT_PUNS(),punLogs:[]},
    redeem:DEFAULT_REDEEM(),
    /* 课表：cells 键 "周几-节次"（节次为数字 1..12；早自习=m，晚自习=e）
       times[p]={s,e} 每节次上课时间（含 m / e 早、晚自习）；早/晚自习行「有课时」才显示，位置在首/尾 */
    schedule:{cells:{},times:{}},
    tierCfg:{gw:50,pw:30,hw:20,gradeRange:"all",pointRange:"all",subjW:{}},theme:"light",
    /* 学期：{id,name,start,end,archived} —— 归档的学期不出现在积分页时间选项中 */
    terms:[],
    /* 班级工作：职务 + 周期自动加分。{id,name,cycle:'day'|'week',pts,studentIds:[]} */
    classJobs:[],

    teachers:[],

    tenureHistory:[],

       {id,name,time,cfg:seatCfg快照,seating:[],seatZones:[],seatFixed:[]} */
    seatHistory:[],
    /* 课表记录：点「记录」保存当前课表快照，可随时恢复。
       {id,name,time,schedule:{cells:{},times:{}}} */
    schedHistory:[],

       {id,name,time,students:[],groups:[]} */
    rosterHistory:[],

    pointView:{mode:"week",custom:{s:"",e:""}},

    behView:{mode:"week",custom:{s:"",e:""}}};

function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d){const base=Object.assign(def(),d);
  if(Array.isArray(d.work)&&!d._migrated){(d.work).forEach(w=>{base.todos.push({id:w.id||uid(),text:w.text||"",done:!!w.done,type:"事件",date:w.date||"",cat:w.cat||"",list:"以后",priority:"",due:""});});base._migrated=true;}
  delete base.work;
  /* 抽签：旧数据无 allowRepeat 字段 → 保持原有「不重复」行为 */
  if(!base.lottery||typeof base.lottery!=="object")base.lottery={drawn:[],allowRepeat:false,puns:DEFAULT_PUNS(),punLogs:[]};
  if(!Array.isArray(base.lottery.drawn))base.lottery.drawn=[];
  if(base.lottery.allowRepeat===undefined)base.lottery.allowRepeat=false;
  /* 惩罚抽取：旧数据补上自定义惩罚列表与记录 */
  if(!Array.isArray(base.lottery.puns))base.lottery.puns=DEFAULT_PUNS();
  if(!Array.isArray(base.lottery.punLogs))base.lottery.punLogs=[];
  /* 旧版单值 bigGroup(等分) → bigGroups(数组，按列均分首版) */
  if(base.seatCfg&&base.seatCfg.bigGroup!==undefined&&!Array.isArray(base.seatCfg.bigGroups)){
    const bg=Math.max(1,Math.min(base.seatCfg.cols,base.seatCfg.bigGroup|0||3));
    const cnt=Math.max(1,Math.ceil(base.seatCfg.cols/bg));
    base.seatCfg.bigGroups=Array(cnt).fill(bg);
    delete base.seatCfg.bigGroup;
  }
  if(base.seatCfg&&!Array.isArray(base.seatCfg.bigGroups)){
    base.seatCfg.bigGroups=[Math.min(3,base.seatCfg.cols)];
  }
  if(base.seatCfg&&Array.isArray(base.seatCfg.bigGroups)){
    const used=base.seatCfg.bigGroups.reduce((a,b)=>a+b,0);
    if(used>base.seatCfg.cols){
      let acc=0;base.seatCfg.bigGroups=base.seatCfg.bigGroups.map(x=>{const remain=base.seatCfg.cols-acc;const v=Math.min(x,Math.max(0,remain));acc+=v;return v;}).filter(x=>x>0);
      if(!base.seatCfg.bigGroups.length)base.seatCfg.bigGroups=[base.seatCfg.cols];
    }
  }
  /* 课表：补 cells / times（老数据没有这些字段）。早/晚自习不再用独立开关，
     改为把 m / e 直接放进「节次」下拉，有课才显示对应行 */
  if(base.schedule&&typeof base.schedule==="object"){
    if(!base.schedule.cells)base.schedule.cells={};
    if(!base.schedule.times||typeof base.schedule.times!=="object")base.schedule.times={};
  }
  /* 老数据兼容：mergedStudy(旧 [gi,s,e]) → studyMerges(新 [{tags:[组名,..]}])，可跨大组 */
  const _ABCm="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  const _bigIdxOf=(c,bg,cols)=>{let acc=0;for(let gi=0;gi<bg.length;gi++){acc+=bg[gi];if(c<acc)return gi;}return bg.length-1;};
  const _bigNames=bg=>bg.map((_,i)=>["零","一","二","三","四","五","六","七","八","九","十"][i+1]||String(i+1));
  if(base.seatCfg&&Array.isArray(base.seatCfg.mergedStudy)&&base.seatCfg.mergedStudy.length&&!base.seatCfg.studyMerges){
    const bigN=_bigNames(base.seatCfg.bigGroups);
    base.seatCfg.studyMerges=base.seatCfg.mergedStudy.map(m=>{
      const tags=[];
      for(let s=m[1];s<=m[2];s++) tags.push(bigN[m[0]]+_ABCm[s]+"组");
      return {id:'m'+Math.random().toString(36).slice(2,7),tags};
    });
    delete base.seatCfg.mergedStudy;
  }
  if(base.seatCfg&&!Array.isArray(base.seatCfg.studyMerges))base.seatCfg.studyMerges=[];
  if(base.seatCfg&&(typeof base.seatCfg.row0Merge!=="object"||base.seatCfg.row0Merge===null))base.seatCfg.row0Merge={};
  if(base.seatCfg&&(typeof base.seatCfg.leaders!=="object"||base.seatCfg.leaders===null))base.seatCfg.leaders={};
  if(!Array.isArray(base.terms))base.terms=[];
  if(!Array.isArray(base.classJobs))base.classJobs=[];
  if(!Array.isArray(base.teachers))base.teachers=[];
  if(!Array.isArray(base.tenureHistory))base.tenureHistory=[];
  if(!Array.isArray(base.seatHistory))base.seatHistory=[];
  if(!Array.isArray(base.schedHistory))base.schedHistory=[];
  if(!base.pointView||typeof base.pointView!=="object")base.pointView={mode:"week",custom:{s:"",e:""}};
  if(!base.pointView.custom||typeof base.pointView.custom!=="object")base.pointView.custom={s:"",e:""};
  if(!base.behView||typeof base.behView!=="object")base.behView={mode:"week",custom:{s:"",e:""}};
  if(!base.behView.custom||typeof base.behView.custom!=="object")base.behView.custom={s:"",e:""};
  /* 积分兑换：老数据无 redeem 字段 → 给默认分类与项目 */
  if(!base.redeem||typeof base.redeem!=="object")base.redeem=DEFAULT_REDEEM();
  if(!Array.isArray(base.redeem.cats))base.redeem.cats=[];
  if(!Array.isArray(base.redeem.items))base.redeem.items=[];
  if(!Array.isArray(base.redeem.logs))base.redeem.logs=[];
  /* 老数据迁移：旧的 repeat 字符串（每天/每周/每月）→ repN + repU 两个字段 */
  if(Array.isArray(base.todos))base.todos.forEach(t=>{
    if(t&&t.repN===undefined){const r=String(t.repeat||"");
      t.repN=/每[天周月]/.test(r)?1:0;
      t.repU=/周/.test(r)?"周":(/月/.test(r)?"月":"天");}
    if(t&&!t.repU)t.repU="天";
    if(t)delete t.repeat;
  });
  return base;}return def();}catch(e){return def();}}

function termByDate(ds){
  const d=ds?new Date(ds+"T00:00:00"):new Date();
  const y=d.getFullYear(),m=d.getMonth()+1;
  if(m>=9)return {name:`${y}-${y+1}学年第一学期`,start:`${y}-09-01`,end:`${y+1}-01-31`};
  if(m<=1)return {name:`${y-1}-${y}学年第一学期`,start:`${y-1}-09-01`,end:`${y}-01-31`};
  return {name:`${y-1}-${y}学年第二学期`,start:`${y}-02-01`,end:`${y}-08-31`};
}

/* ---- 学生等级：有效等级 = 手动(s.tier) 凌驾 计算(s.tierCalc) ---- */
const DEFAULT_SUBJ_W={"语文":20,"数学":20,"英语":20,"物理":20,"生物":10,"地理":10,"政治":0,"历史":0,"化学":0};
function subjW(sub){const o=S.tierCfg&&S.tierCfg.subjW;if(o&&sub in o)return o[sub];return DEFAULT_SUBJ_W[sub]!==undefined?DEFAULT_SUBJ_W[sub]:0;}
function tierOf(s){return (s.tier||s.tierCalc||"");}
function pointsInRange(s,range){
  if(range==="7"||range==="30"){
    const days=+range;const d=new Date();d.setDate(d.getDate()-days);
    const cut=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    return S.points.logs.filter(l=>l.studentId===s.id&&(l.time||"").slice(0,10)>=cut).reduce((a,l)=>a+(+l.delta||0),0);
  }
  return +(S.points.scores[s.id]||0);
}
function computeTiers(){
  const cfg=S.tierCfg;
  const exams=[...S.exams].sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const selExams=cfg.gradeRange==="all"?exams:exams.slice(0,+cfg.gradeRange||1);
  const ex=exams[0]||null;
  const pv=S.students.map(s=>pointsInRange(s,cfg.pointRange));
  const hv=S.students.map(s=>+(s.height||0));
  const pmin=pv.length?Math.min(...pv):0,pmax=pv.length?Math.max(...pv):0;
  const hmin=hv.length?Math.min(...hv):0,hmax=hv.length?Math.max(...hv):0;
  const norm=(v,min,max)=>max>min?(v-min)/(max-min)*100:50;
  const rows=S.students.map(s=>{
    const gs=[];
    selExams.forEach(e=>{
      const sc=e.scores[s.id]||{};
      if(cfg.gradeRange==="all"){
        /* 全部考试：每次考试取各科原始分的平均分，再对平均分求平均（科目占比不参与，量纲与单/数次一致，避免总分飙到几百） */
        let sum=0,cnt=0;
        e.subjects.forEach(sub=>{const v=parseFloat(sc[sub]);if(v!==undefined&&!isNaN(v)){sum+=v;cnt++;}});
        if(cnt>0)gs.push(sum/cnt);
      }else{
        /* 最近1/2/3次：按科目占比加权平均 */
        let ws=0,wscore=0;
        e.subjects.forEach(sub=>{const w=subjW(sub);const v=parseFloat(sc[sub]);if(w>0&&v!==undefined&&!isNaN(v)){wscore+=v*w;ws+=w;}});
        if(ws>0)gs.push(wscore/ws);
      }
    });
    const grade=gs.length?gs.reduce((a,b)=>a+b,0)/gs.length:0;
    const p=norm(pointsInRange(s,cfg.pointRange),pmin,pmax);
    const h=s.height?norm(+s.height,hmin,hmax):50;
    const total=grade*cfg.gw/100+p*cfg.pw/100-h*cfg.hw/100;
    return {s,grade:Math.round(grade*10)/10,p:Math.round(p*10)/10,h:Math.round(h*10)/10,total:Math.round(total*10)/10,noGrade:gs.length===0};
  });
  rows.sort((a,b)=>b.total-a.total);
  const n=rows.length,aEnd=Math.round(n/3),cStart=n-aEnd;
  rows.forEach((r,i)=>{r.rank=i+1;r.calc=i<aEnd?"A":i>=cStart?"C":"B";r.s.tierCalc=r.calc;});
  return {exams:selExams,rows};
}
function todayStr(){const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1).toString().padStart(2,"0")+"-"+d.getDate().toString().padStart(2,"0");}
function ddLeft(date){if(!date)return 99;const a=new Date(todayStr());const b=new Date(date);return Math.round((b-a)/86400000);}

function route(){
  const h=(location.hash||"#home").replace("#","");
  const fn=routes[h]||viewHome;
  const meta=NAV.find(n=>n.r===h)||NAV[0];
  document.getElementById("pageTitle").textContent=meta.t;
  document.getElementById("pageSub").textContent=SUB[h]||"";
  document.getElementById("view").innerHTML="";
  fn(document.getElementById("view"));
  document.querySelectorAll(".nav a,.bottom a").forEach(a=>a.classList.toggle("active",a.dataset.r===h));
  /* 手机端底部导航：把当前模块横向滚到可视区中部，避免深层模块藏在滚动区外 */
  const _bt=document.getElementById("bottom"),_ba=_bt&&_bt.querySelector("a.active");
  if(_bt&&_ba&&_bt.scrollWidth>_bt.clientWidth){
    const br=_bt.getBoundingClientRect(),ar=_ba.getBoundingClientRect();
    _bt.scrollLeft+=(ar.left-br.left)-(br.width-ar.width)/2;
  }
  $("#moreDrawer").classList.remove("show");

}

function buildRecent(){
  const list=[];
  S.behaviors.forEach(b=>{
    const col=typeColor(b.type);
    const soft=typeSoft(b.type);
    const d=b.delta||0;
    const dBadge=d?`<b style="color:${d>0?'var(--ok)':'var(--bad)'};font-weight:700">${d>0?'+'+d:d}</b>`:'';
    const tag=`<span class="chip" style="background:${soft};color:${col};border-color:transparent">${esc(b.type)}</span>`;
    const reason=b.reason?` · ${esc(b.reason)}`:'';
    list.push({t:b.time,dot:col,txt:`${esc(studentName(b.studentId))} ${tag}${dBadge?` ${dBadge}`:''}${reason}`});
  });
  S.points.logs.forEach(p=>{
    const c=p.delta>=0?"var(--ok)":"var(--bad)";
    const sign=p.delta>0?"+":"";
    const reason=p.reason?` · ${esc(p.reason)}`:'';
    list.push({t:p.time,dot:c,txt:`${esc(studentName(p.studentId))} <b style="color:${c};font-weight:700">${sign}${p.delta}</b>${reason}`});
  });
  list.sort((a,b)=>(b.t||"").localeCompare(a.t||""));
  return list;
}
function taskLine(t){
  const isEvent=(t.type==="事件");
  const doneClass=t.done?"done":(t.dropped?"drop":"");
  const _rn=taskRepN(t);
  const repHtml=_rn?`<span class="chip warn" style="padding:1px 7px;font-size:11.5px" title="${t.repeatEnd?"重复至 "+esc(t.repeatEnd):"无截止日，一直重复"}">每${_rn}${esc(taskRepU(t))}${t.repeatEnd?" · 至"+esc(t.repeatEnd.slice(5)):""}</span>`:"";
  const dropHtml=t.dropped?`<span class="chip bad" style="padding:1px 7px;font-size:11.5px">已放弃</span>`:"";
  // 第一行：日期 + 标题
  let dateStr="";
  if(isEvent&&t.date){dateStr=t.date.slice(5);}     // MM-DD
  else if(!isEvent&&t.due){dateStr=t.due.slice(5);} // 日常截止
  const dateHtml=dateStr?`<span class="date">${esc(dateStr)}</span>`
                        :`<span class="date muted">—</span>`;
  // 第二行：相对时间 + 位置
  let left="";
  if(isEvent){
    if(t.date){const l=ddLeft(t.date);left=l===0?"今天":l>0?l+"天后":Math.abs(l)+"天前";}
    else left="未定日期";
  }else{
    if(t.list==="今天")left="今天";
    else if(t.list==="本周")left="本周";
    else left="以后";
    if(t.due){const l=ddLeft(t.due);left+=" · "+(l===0?"今天截止":l>0?l+"天后":Math.abs(l)+"天前");}
  }
  const locHtml=(isEvent&&t.cat)?`<span class="sep">·</span><span class="loc">${esc(t.cat)}</span>`:"";
  return `<div class="task-card ${doneClass}">
    <button class="task-check ${doneClass}" onclick="W.toggleTask('${t.id}')" aria-label="完成">${t.done?"✓":""}</button>
    <div style="flex:1;min-width:0">
      <div class="row1">${dateHtml}<span class="title">${esc(t.text)}</span>${repHtml}${dropHtml}</div>
      <div class="row2"><span class="lbl">${esc(left)}</span>${locHtml}</div>
    </div>
    <span class="r-act"><button onclick="W.dropTask('${t.id}')" title="${t.dropped?"取消放弃，恢复为待办":"放弃该事务（移到下方已放弃，可再点一次恢复）"}">弃</button><button onclick="W.editTask('${t.id}')">改</button><button class="del" onclick="W.delTask('${t.id}')">删</button></span>
  </div>`;
}

let rosterKw="";
let rosterSort={k:"",dir:1}; /* k: name/sex/g/tier/phone/height；dir: 1 升 / -1 降；k 为空=录入顺序 */
/* 列顺序：学号 → 姓名 → 等级 → 家长电话 → 备注 → 学习组 → 性别 → 身高 → 操作
   k 为空 = 不可排序；导出 CSV 沿用同一顺序 */
const ROSTER_COLS=[
  {k:"",      t:"学号",     c:"c-no"},
  {k:"name",  t:"姓名",     c:"c-name"},
  {k:"tier",  t:"等级",     c:"c-tier"},
  {k:"",      t:"家长电话", c:"c-phone"},
  {k:"",      t:"备注",     c:"c-note"},
  {k:"g",     t:"学习组",   c:"c-g"},
  {k:"sex",   t:"性别",     c:"c-sex"},
  {k:"height",t:"身高",     c:"c-h"},
  {k:"",      t:"操作",     c:"c-act"}
];
const ROSTER_LABELS=ROSTER_COLS.map(c=>c.t);
function sortTh(key,label,cls){
  const on=rosterSort.k===key;
  const arrow=on?(rosterSort.dir===1?"▲":"▼"):"↕";
  return `<th class="sortable ${cls||""} ${on?"on":""}" onclick="W.sortRoster('${key}')" title="点击排序">${label}<span class="sort-ind">${arrow}</span></th>`;
}
/* 列是否显示：姓名/操作恒显示；其余列在所有学生都没填该项时默认隐藏 */
function rosterColOn(c){
  if(c.c==="c-name"||c.c==="c-act")return true;
  if(!S.students.length)return true;
  const H={
    "c-no":()=>S.students.some(s=>String(s.no||"").trim()!==""),
    "c-tier":()=>S.students.some(s=>tierOf(s)),
    "c-phone":()=>S.students.some(s=>phoneList(s.phone).length>0),
    "c-note":()=>S.students.some(s=>String(s.note||"").trim()!==""),
    "c-g":()=>S.students.some(s=>String(s.g||"").trim()!==""),
    "c-sex":()=>S.students.some(s=>String(s.sex||"").trim()!==""),
    "c-h":()=>S.students.some(s=>+s.height>0)
  };
  return H[c.c]?H[c.c]():true;
}

    students:JSON.parse(JSON.stringify(S.students)),groups:JSON.parse(JSON.stringify(S.groups||[]))});

W.restoreRosterHist=id=>{
  const r=(S.rosterHistory||[]).find(x=>x.id===id);

  S.students=JSON.parse(JSON.stringify(r.students||[]));
  S.groups=JSON.parse(JSON.stringify(r.groups||[]));
  save();refresh();toast("已恢复「"+(r.name||"名册")+"」");
};
W.delRosterHist=id=>{
  const r=(S.rosterHistory||[]).find(x=>x.id===id);
  if(!r)return;
  if(!confirm("删除历史名册「"+(r.name||"名册")+"」？"))return;
  S.rosterHistory=S.rosterHistory.filter(x=>x.id!==id);

W.clearRoster=()=>{

/* 家长电话：点击直接拨号（手机端 tel: 唤起拨号，桌面端可交给已关联的拨号应用） */
function phoneHref(p){return "tel:"+String(p||"").replace(/[^\d+*#]/g,"");}
/* 家长电话支持多个：逗号 / 分号 / 顿号 / 斜杠 / 空格 分隔 */
function phoneList(p){
  return String(p||"").split(/[,，;；、\/|\s]+/).map(x=>x.trim()).filter(Boolean);
}
function phoneLink(p){
  const arr=phoneList(p);
  if(!arr.length)return "—";
  return arr.map(t=>`<a class="plink" href="${esc(phoneHref(t))}" title="点击拨打 ${esc(t)}"><span class="ic">☎</span>${esc(t)}</a>`).join("<br>");
}
function rosterList(){
  let list=S.students.slice();
  if(rosterKw){const k=rosterKw.toLowerCase();list=list.filter(s=>(s.name+s.no+s.g).toLowerCase().includes(k));}
  const k=rosterSort.k;
  if(k){
    const TIER={A:1,B:2,C:3},dir=rosterSort.dir;

      if(typeof x==="number")return (x-y)*dir;
      return String(x).localeCompare(String(y),"zh")*dir;
    });
  }
  return list;
}

      <div class="row">

      <tbody>${rows.map(s=>{

        const subjCells=ex.subjects.map(sub=>{

          const pe=subPrev[sub];const pv=pe?((pe.scores[s.id]||{})[sub]):undefined;

            ?`<input class="fld" style="width:37px;padding:4px 2px;text-align:center" value="${sc[sub]!==undefined?esc(sc[sub]):""}" onchange="W.setScore('${ex.id}','${s.id}','${esc(sub)}',this.value)">`
            :(cur!==null?`<b style="cursor:pointer" title="查看历次${esc(sub)}成绩" onclick="W.subHist('${s.id}','${esc(sub)}')">${cur}</b>`:`<span class="muted" style="cursor:pointer" onclick="W.subHist('${s.id}','${esc(sub)}')">—</span>`)}</td>`

        }).join("");
        const psum=prev?(()=>{let t=0,n=0;ex.subjects.forEach(sub=>{const v2=prev.scores[s.id]&&prev.scores[s.id][sub];if(v2!==undefined&&v2!==""){t+=+v2;n++;}});return n?t:null;})():null;

      }).join("")}</tbody></table>
    </div>
  </div>
  ${gradeDistHtml(ex)}
  <div class="card pad" style="margin-top:12px">
    <div class="section-title" style="margin-bottom:6px">考试记录（${S.exams.length}）</div>
    ${[...S.exams].sort((a,b)=>(b.date||"").localeCompare(a.date||"")).map(e=>{
      const n=S.students.filter(s=>{const sc=e.scores[s.id]||{};return e.subjects.some(sub=>sc[sub]!==undefined&&sc[sub]!=="");}).length;
      return `<div class="r-item" style="padding:7px 0">
      <div style="flex:1;min-width:0"><b>${esc(e.name)}</b><div class="tiny muted">${esc(e.date||"")} · ${e.subjects.length} 科 · ${n} 人${e.note?" · "+esc(e.note):""}</div></div>
      <span class="r-act">
        <button onclick="W.editGAdd('${e.id}')" title="改备注">改</button>
        <button class="del" onclick="W.delGAdd('${e.id}')" title="删除这场考试及成绩">删</button>
      </span></div>`;}).join("")}
  </div>`;
}
function gradeRanks(ex){
  const arr=S.students.map(s=>{const sc=ex.scores[s.id]||{};let sum=0,n=0;ex.subjects.forEach(sub=>{const v2=sc[sub];if(v2!==undefined&&v2!==""){sum+=+v2;n++;}});return {id:s.id,sum,n};}).filter(x=>x.n).sort((a,b)=>b.sum-a.sum);
  const map={};arr.forEach((x,i)=>map[x.id]=i+1);return map;
}
function prevExam(ex){
  const sorted=[...S.exams].sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  const i=sorted.findIndex(e=>e.id===ex.id);
  return i>0?sorted[i-1]:null;
}
/* 默认选中的考试：按日期取最近一场（同日期取后录入的） */
function latestExamId(){
  const sorted=[...S.exams].reverse().sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  return sorted[0].id;
}
/* 点某学生某科成绩：弹窗列出他所有考试该科目的成绩 */
W.subHist=(sid,sub)=>{
  const st=el(sid,S.students);if(!st)return;
  const list=[...S.exams].sort((a,b)=>(a.date||"").localeCompare(b.date||"")).filter(e=>e.subjects.includes(sub));
  const rows=list.map(e=>{
    const v=(e.scores[sid]||{})[sub];
    const has=v!==undefined&&v!=="";
    const rk=has?subjRankMap(e,sub)[sid]:null;
    return `<div class="r-item" style="padding:7px 0">
      <div style="flex:1;min-width:0"><b>${esc(e.name)}</b><div class="tiny muted">${esc(e.date||"")}</div></div>
      <span class="row" style="gap:10px;flex:none">${has?`<b>${esc(v)}</b><span class="tiny ${rk&&rk<=3?"":"muted"}" style="${rk&&rk<=3?"color:var(--warn)":""}">第${rk}名</span>`:`<span class="tiny muted">未录入</span>`}</span></div>`;
  }).join("");
  openModal(`<h3>${esc(st.name)} · ${esc(sub)}</h3>
  ${rows||`<div class="empty">暂无该科目的考试</div>`}
  <div class="foot"><button class="btn ghost" onclick="closeModal()">关闭</button></div>`);
};
/* 各科进退步的对比考试：上一场「有该科目」的考试（日期早于本场，逐科往前找） */
function prevExamForSub(ex,sub){
  const sorted=[...S.exams].sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  for(let i=sorted.findIndex(e=>e.id===ex.id)-1;i>=0;i--){if(sorted[i].subjects.includes(sub))return sorted[i];}
  return null;
}
function subjRankMap(ex,sub){
  const arr=S.students.map(s=>{const sc=ex.scores[s.id]||{};const v2=sc[sub];return {id:s.id,v:(v2===undefined||v2==="")?null:+v2};}).filter(x=>x.v!==null).sort((a,b)=>b.v-a.v);
  const map={};arr.forEach((x,i)=>map[x.id]=i+1);return map;
}
function deltaCell(cur,old){
  if(cur===null||old===null)return `<td class="mini g-delta"><span class="muted">—</span></td>`;
  const d=cur-old;
  if(!d)return `<td class="mini g-delta"><span class="muted">0</span></td>`;
  return `<td class="mini g-delta"><b style="color:${d>0?"var(--ok)":"var(--bad)"}">${d>0?"+"+d:d}</b></td>`;
}
/* ---- 成绩曲线：各科每次考试的班级平均分折线（纯 SVG） ---- */
let trendSub=null;/* 图例点选聚焦的科目；null=全部显示（仅会话内，刷新复位） */
let trendMark=null;/* 曲线数据点标注：{sub,i}，点按在曲线上显示该点均分，再点取消（仅会话内） */
function gradeTrendHtml(){
  const exams=[...S.exams].sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  if(!exams.length)return "";
  const subs=[];exams.forEach(e=>e.subjects.forEach(s=>{if(!subs.includes(s))subs.push(s);}));
  if(!subs.length)return "";
  /* 每科固定一种颜色：常见科目走 SUBJ_COLOR_MAP（色相分散，物理/生物等互不相近），未列入的按名散列兜底 */
  const colOf={};subs.forEach(s=>colOf[s]=subjColor(s));
  const show=(trendSub&&subs.includes(trendSub))?[trendSub]:subs;
  const series=show.map(sub=>({sub,pts:exams.map(e=>{
    let t=0,n=0;S.students.forEach(s=>{const v=(e.scores[s.id]||{})[sub];if(v!==undefined&&v!==""){t+=+v;n++;}});
    return n?t/n:null;})}));
  let maxV=0;series.forEach(se=>se.pts.forEach(v=>{if(v!==null&&v>maxV)maxV=v;}));
  if(!maxV)return "";
  const top=Math.max(100,Math.ceil(maxV/10)*10);
  const W2=560,H=210,L=30,R=8,T=10,B=22,iw=W2-L-R,ih=H-T-B;
  const X=i=>exams.length===1?L+iw/2:L+iw*i/(exams.length-1);
  const Y=v=>T+ih*(1-v/top);
  let g="";
  for(let k=0;k<=4;k++){const v=Math.round(top*k/4),yy=+Y(v).toFixed(1);
    g+=`<line x1="${L}" y1="${yy}" x2="${W2-R}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${L-4}" y="${yy+3}" text-anchor="end" font-size="9" fill="var(--ink-2)">${v}</text>`;}
  exams.forEach((e,i)=>{g+=`<text x="${X(i).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="9" fill="var(--ink-2)">${esc(e.name.length>4?e.name.slice(0,4):e.name)}</text>`;});
  let paths="",dots="";
  series.forEach(se=>{
    const c=colOf[se.sub];
    const seg=se.pts.map((v,i)=>v===null?null:[X(i),Y(v)]);
    let d="",open=false;
    seg.forEach(p=>{if(p){d+=(open?" L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1);open=true;}else open=false;});
    if(d)paths+=`<path d="${d}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round"/>`;
    seg.forEach((p,i)=>{
      if(!p)return;
      const val=se.pts[i],isMark=trendMark&&trendMark.sub===se.sub&&trendMark.i===i;
      dots+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="${c}" style="cursor:pointer" onclick="W.trendPoint('${exams[i].id}','${esc(se.sub)}')"><title>${esc(se.sub)} · ${esc(exams[i].name)}：均分 ${val!=null?Math.round(val*10)/10:"—"}，点按在曲线上标注均分</title></circle>`;
      if(isMark){
        dots+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="6.5" fill="none" stroke="${c}" stroke-width="1.5"/>`;
        dots+=`<text x="${(p[0]+7).toFixed(1)}" y="${(p[1]-8).toFixed(1)}" font-size="11" font-weight="700" fill="${c}" style="paint-order:stroke;stroke:var(--bg);stroke-width:3px">${val!=null?Math.round(val*10)/10:"—"}</text>`;
      }
    });
  });
  const legend=subs.map(s=>{
    const act=trendSub===s,dim=trendSub&&!act;
    return `<span style="display:inline-flex;align-items:center;gap:4px;font-size:12px;cursor:pointer;user-select:none;${act?"font-weight:700":""}${dim?";opacity:.35":""}" onclick="W.trendFocus('${esc(s)}')" title="${act?"点按显示全部科目":"点按只看该科目"}"><i style="width:8px;height:8px;border-radius:50%;background:${colOf[s]}"></i>${esc(s)}</span>`;
  }).join("");
  return `<div class="card pad" style="margin-top:12px">
    <div class="between row wrap" style="margin-bottom:6px"><span class="section-title" style="margin:0">成绩曲线</span><span class="tiny muted">${trendSub?"只看："+esc(trendSub):"各科每次考试 · 班级平均分"}</span></div>
    <div class="row wrap" style="gap:10px;margin-bottom:4px">${legend}</div>
    <svg viewBox="0 0 ${W2} ${H}" style="width:100%;height:auto;display:block">${g}${paths}${dots}</svg>
  </div>`;
}
/* 图例点选：聚焦单科 / 再点恢复全部 */
W.trendFocus=sub=>{trendSub=trendSub===sub?null:sub;viewGrades(document.getElementById("view"));};
/* 点曲线数据点：在曲线上标注该点均分（班级平均分），再点同一位置取消；点其他科目则切到该科可见 */
W.trendPoint=(eid,sub)=>{
  const sorted=[...S.exams].sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  const i=sorted.findIndex(e=>e.id===eid);
  if(i<0)return;
  if(trendSub&&trendSub!==sub)trendSub=sub;/* 让被标注的科目可见 */
  if(trendMark&&trendMark.sub===sub&&trendMark.i===i)trendMark=null;else trendMark={sub,i};
  viewGrades(document.getElementById("view"));
};
/* ---- 分数段分布：当前考试各科分数段人数 ---- */
function gradeDistHtml(ex){

    <tbody>${bands.map(b=>`<tr><td class="c-no">${lbl(b)}</td>${ex.subjects.map(sub=>{const n=cnt(sub,b);return `<td class="mini"><span class="${n?"":"muted"}" style="${n?"font-weight:600":""}">${n||"·"}</span></td>`;}).join("")}</tr>`).join("")}</tbody></table></div>

/* ---- 成绩规则：读取 / 兜底 ---- */
function gradeRules(){
  const d=DEFAULT_GRADE_RULES();
  if(!S.gradeRules||typeof S.gradeRules!=="object")S.gradeRules=d;
  GRADE_RULE_LABELS.forEach(([k])=>{
    const v=parseInt(S.gradeRules[k],10);
    S.gradeRules[k]=isFinite(v)?Math.max(-99,Math.min(99,v)):d[k];
  });
  /* 开关：成绩积分是否计入总积分（老数据无此键，默认开） */
  if(S.gradeRules.gradeOn===undefined)S.gradeRules.gradeOn=true;
  return S.gradeRules;
}
/* 开关读取：默认开 */
function gradeOn(){return gradeRules().gradeOn!==false;}
/* 保证「成绩」类别存在（老数据没有，按需补上） */
function ensureGradeType(){
  const arr=Array.isArray(S.behTypes)&&S.behTypes.length?S.behTypes:(S.behTypes=DEFAULT_BEH_TYPES());
  if(!arr.some(t=>t.k===GRADE_TYPE))arr.push({k:GRADE_TYPE,c:"brand",pts:0});
  return arr;
}
/* 名次分档（四档互斥，其余名次不加不减）。rr = 倒数名次 = 有成绩人数 − 正名次 + 1 */
function gradeRankBucket(r,m){
  const rr=m-r+1;
  if(r<=10)return "top10";
  if(r<=20)return "top20";
  if(rr<=10)return "bot10";
  if(rr<=20)return "bot20";
  return "";
}
/* 按规则为该考试生成自动记录。幂等：先撤销这场考试上次生成的自动记录（含积分与日志），再重建。
   返回值 = 生成的记录条数。每人每科生成 1 条记录，事由里写清 具体考试 + 具体科目 + 名次/退步明细。 */
function applyGradeRules(ex){
  ensureGradeType();
  const R=gradeRules();
  const on=gradeOn();/* 开关：关 → 只生成行为记录留痕，不写积分 */
  /* 1) 撤销旧记录：先扣回积分（开关关时积分本就不在账上，不扣），再删行为与积分日志 */
  S.behaviors.filter(b=>b.auto===GRADE_TYPE&&b.examId===ex.id).forEach(b=>{
    const d=b.delta||0;
    if(d&&on)S.points.scores[b.studentId]=(S.points.scores[b.studentId]||0)-d;
  });
  S.behaviors=S.behaviors.filter(b=>!(b.auto===GRADE_TYPE&&b.examId===ex.id));
  S.points.logs=S.points.logs.filter(l=>!(l.auto===GRADE_TYPE&&l.examId===ex.id));
  /* 2) 逐科算名次档位与进退步，按 学生×科目 聚合 */
  const prev=prevExam(ex);
  const det={};/* sid -> sub -> {rk,bk,drop,up} */
  const add=(sid,sub,rk,bk,dropAmt,upAmt)=>{
    if(!det[sid])det[sid]={};
    const o=det[sid][sub]||(det[sid][sub]={});
    if(rk!==undefined)o.rk=rk;
    if(bk)o.bk=bk;
    if(dropAmt!==undefined)o.drop=dropAmt;
    if(upAmt!==undefined)o.up=upAmt;
  };
  ex.subjects.forEach(sub=>{
    const rm=subjRankMap(ex,sub);
    const ids=Object.keys(rm),m=ids.length;
    if(!m)return;
    ids.forEach(id=>{
      const rk=rm[id];
      const bk=gradeRankBucket(rk,m);
      if(bk)add(id,sub,rk,bk);
      if(prev){
        const cu=+((ex.scores[id]||{})[sub]);
        const ol=+((prev.scores[id]||{})[sub]);
        if(isFinite(cu)&&isFinite(ol)){
          if((ol-cu)>=5)add(id,sub,undefined,undefined,(ol-cu));
          else if((cu-ol)>=5)add(id,sub,undefined,undefined,undefined,(cu-ol));
        }
      }
    });
  });
  /* 3) 生成记录：每人每科一条，事由 = 具体考试 + 具体科目 + 名次/进退步明细（分值全 0 不生成） */
  /* 记录时间 = 考试日期（而非录入时刻），与行为/积分页时间范围过滤兼容 */
  const time=ex.date||nowStr();
  let n=0;
  Object.keys(det).forEach(id=>{
    Object.keys(det[id]).forEach(sub=>{
      const o=det[id][sub];
      let reason="",sum=0;
      if(o.bk&&R[o.bk]){
        const pts=R[o.bk];
        reason+=sub+"第"+o.rk;
        sum+=pts;
      }
      if(o.drop&&R.drop){
        reason+=(reason?"；":"")+sub+"退步"+o.drop+"分";
        sum+=R.drop;
      }
      if(o.up&&R.up){
        reason+=(reason?"；":"")+sub+"进步"+o.up+"分";
        sum+=R.up;
      }
      if(!sum)return;
      const full=ex.name+" "+reason;
      const b={id:uid(),studentId:id,type:GRADE_TYPE,reason:full,time,delta:sum,auto:GRADE_TYPE,examId:ex.id};
      S.behaviors.push(b);
      if(on){
        S.points.scores[id]=(S.points.scores[id]||0)+sum;
        S.points.logs.push({id:uid(),studentId:id,delta:sum,reason:"行为·"+GRADE_TYPE+"："+full,time,behId:b.id,auto:GRADE_TYPE,examId:ex.id});
      }
      n++;
    });
  });
  return n;
}
/* 开关切换后同步既有成绩自动记录的积分：关 → 扣回积分并删日志（行为记录留痕）；开 → 按行为记录补回积分与日志 */
function syncGradePoints(){
  const on=gradeOn();
  const bs=S.behaviors.filter(b=>b.auto===GRADE_TYPE);
  if(!on){
    bs.forEach(b=>{const d=b.delta||0;if(d)S.points.scores[b.studentId]=(S.points.scores[b.studentId]||0)-d;});
    S.points.logs=S.points.logs.filter(l=>l.auto!==GRADE_TYPE);
  }else{
    bs.forEach(b=>{
      const d=b.delta||0;if(!d)return;
      S.points.scores[b.studentId]=(S.points.scores[b.studentId]||0)+d;
      if(!S.points.logs.some(l=>l.behId===b.id))S.points.logs.push({id:uid(),studentId:b.studentId,delta:d,reason:"行为·"+GRADE_TYPE+"："+(b.reason||""),time:b.time,behId:b.id,auto:GRADE_TYPE,examId:b.examId});
    });
  }
}
W.toggleGradeOn=()=>{
  const R=gradeRules();
  R.gradeOn=!(R.gradeOn!==false);
  syncGradePoints();
  save();W.renderBehTypes();
  toast(R.gradeOn?"成绩积分已计入总积分":"成绩积分已不计入总积分（行为记录保留）");
};
W.setGradeRule=(k,val)=>{
  if(!GRADE_RULE_LABELS.some(([kk])=>kk===k))return;

  save();W.renderBehTypes();
};

function toCNum(n){const c=["零","一","二","三","四","五","六","七","八","九","十"];if(n<=10)return c[n];if(n<20)return "十"+c[n-10];if(n<100){const t=Math.floor(n/10),o=n%10;return c[t===1?"":t-0===1?"":t]+"十"+(o?c[o]:"");}return String(n);}
function viewSeating(v){
  const cfg=S.seatCfg;
  const _nTotal=(cfg.rows+(cfg.row0?1:0))*cfg.cols;/* 第0排开启时多一行 */
  if(!S.seating||S.seating.length!==_nTotal){S.seating=new Array(_nTotal).fill(null);}

  if(!Array.isArray(cfg.bigGroups)||!cfg.bigGroups.length)cfg.bigGroups=[Math.min(3,cfg.cols)];
  const bigGroups=cfg.bigGroups.slice();
  /* 计算每个座位列对应的 grid 轨道号 + 每条大组分隔的轨道号（处理大组宽度不均 [3,2,4] 等）。
     必须显式指定，否则座位 auto-placement 会跳过显式 sep 占用的轨道，导致
     "第 N 个座位" 不等于 "第 N 个轨道"，分隔条与座位错位（视觉 3-2-4 变成真 3-1-5）。 */
  const tagSide="left";/* 学习组名竖排标签固定显示在每大组最左（已移除左右切换按钮） */
  const seatColTrack=new Array(cfg.cols+1); // 1-indexed
  const sepTracks=[];
  const sepTrackOf={};/* 大组末列座位轨道 → 其后的竖虚线轨道号 */
  const sepGiOf={};/* 竖虚线轨道号 → 其左侧大组索引 gi（分隔 gi 与 gi+1） */
  const tagTracks=[];/* 每个大组的「学习组名」轨道号 */
  {let _acc=0;for(let gi=0;gi<bigGroups.length;gi++){

/* ============ POINTS ============ */
let ptTab="person";
/* 积分兑换：当前筛选的分类，"all" = 全部分类 */
let redeemCatFilter="all";
/* 积分页时间范围：
   week = 本周一 ~ 今天（按周，不是 7 天）；month = 本月 1 日 ~ 今天（按自然月，不是 30 天）；
   all  = 所有时间（不筛选，显示全部记录）；t:<id> = 指定未归档学期；custom = 自定义起止。
   返回 {s,e}（YYYY-MM-DD，含端点）；null = 不限（全部记录）。 */
/* 传 pvOverride 可按别的时间范围状态计算（行为记录页用 S.behView）；不传则用积分页 S.pointView */
function ptRangeBounds(pvOverride){
  const pv=pvOverride||S.pointView||{mode:"week",custom:{s:"",e:""}};
  const t=todayStr();
  const fmt=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  if(pv.mode==="week"){
    const d=new Date(t+"T00:00:00"),wd=(d.getDay()+6)%7;/* 0=周一 */
    const s=new Date(d);s.setDate(d.getDate()-wd);
    return {s:fmt(s),e:t};
  }
  if(pv.mode==="month")return {s:t.slice(0,8)+"01",e:t};
  if(pv.mode==="all")return null; /* 所有时间：不筛选，显示全部记录 */
  if(pv.mode==="custom"){const c=pv.custom||{};return {s:c.s||"0000-01-01",e:c.e||"9999-12-31"};}
  if(String(pv.mode).indexOf("t:")===0){
    const tr=el(String(pv.mode).slice(2),S.terms||[]);
    return tr&&tr.start?{s:tr.start,e:tr.end||t}:null;
  }
  return {s:t,e:t};
}
const ptModeName=m=>{
  if(m==="week")return "最近一周";
  if(m==="month")return "最近一月";
  if(m==="all")return "所有时间";
  if(m==="custom")return "自定义";
  const tr=el(String(m).slice(2),S.terms||[]);
  return tr?tr.name:"最近一周";
};
function ptRangeLabel(pvOverride){
  const _pv=pvOverride||S.pointView||{mode:"week",custom:{s:"",e:""}};
  const b=ptRangeBounds(_pv),m=ptModeName(_pv.mode);
  if(!b)return m;
  const s=b.s==="0000-01-01"?"起":b.s,e=b.e==="9999-12-31"?"今":b.e;
  return `${m}（${s} ~ ${e}）`;
}
/* 范围内积分：不限 → 累计 scores；否则按 logs 明细汇总 */
function pointsIn(sid,bounds){
  if(!bounds)return +(S.points.scores[sid]||0);
  return (S.points.logs||[]).filter(l=>{const ds=(l.time||"").slice(0,10);return l.studentId===sid&&ds&&ds>=bounds.s&&ds<=bounds.e;}).reduce((a,l)=>a+(+l.delta||0),0);
}
const ptLogIn=(l,b)=>{if(!b)return true;const ds=(l.time||"").slice(0,10);return ds&&ds>=b.s&&ds<=b.e;};
/* 学习组榜：按学生 s.g（座位学习组名）实时聚合，永远与座位表一致（含合并/自定义组名）。
   返回 [{name, members:[学生], sum, avg}]，已按指定字段降序。 */
let ptGrpSort="sum";/* sum = 组内总分；avg = 组内平均分 */
function studyGroupRank(bounds){
  const map={};
  S.students.forEach(s=>{const g=String(s.g||"").trim();if(!g)return;(map[g]=map[g]||{name:g,members:[]}).members.push(s);});
  const list=Object.keys(map).map(k=>{
    const members=map[k].members;
    const sum=members.reduce((a,m)=>a+pointsIn(m.id,bounds),0);
    return {name:k,members,sum,avg:members.length?sum/members.length:0};
  });
  list.sort((a,b)=>{
    if(ptGrpSort==="avg"){if(b.avg!==a.avg)return b.avg-a.avg;return b.sum-a.sum;}
    return b.sum-a.sum;
  });
  return list;
}
const fmtAvg=n=>{const r=Math.round(n*10)/10;return (Number.isInteger(r)?r:r.toFixed(1));};
/* 明细弹窗：个人 / 学习组的全部积分记录 */
let ptDetail=null;/* {t:'p'|'g', id} */
let ptDetailAll=false;/* true = 忽略时间范围，显示全部 */
function logsOfIds(ids){
  const b=ptDetailAll?null:ptRangeBounds();
  return (S.points.logs||[]).filter(l=>ids.indexOf(l.studentId)>=0&&(ptLogIn(l,b)));
}
function logListHtml(ls,showName){
  if(!ls.length)return `<div class="empty">没有记录</div>`;

      <div style="flex:1"><div>${showName?esc(studentName(l.studentId))+" ":""}<b style="color:${c}">${l.delta>0?"+":""}${l.delta}</b> ${esc(l.reason?"· "+l.reason:"")}</div><div class="tiny muted">${esc(l.time)}</div></div></div>`;}).join("");
}

  ${detailHead()}
  <div class="drawn-list" style="margin:2px 0 8px">${members.map(x=>`<span class="d" onclick="W.showPersonLogs('${x.m.id}')" style="cursor:pointer" title="查看 ${esc(x.m.name)} 的明细">${esc(x.m.name)} <b style="color:${x.sc<0?'var(--bad)':'var(--ok)'}">${x.sc}</b></span>`).join("")}</div>

    </div>

    ${(()=>{const ls=(S.points.logs||[]).filter(l=>ptLogIn(l,_b)).slice().reverse().slice(0,12);return ls.length?ls.map(l=>{const c=l.delta>=0?'var(--ok)':'var(--bad)';return `<div class="r-item"><span class="r-dot" style="background:${c};color:${c}"></span>
      <div style="flex:1"><div>${esc(studentName(l.studentId))} <b style="color:${c}">${l.delta>0?"+":""}${l.delta}</b> ${esc(l.reason?"· "+l.reason:"")}</div><div class="tiny muted">${esc(l.time)}</div></div></div>`;}).join(""):`<div class="empty">该时间范围内没有记录</div>`;})()}
  </div>`}`;
}

/* ============ REDEEM（积分兑换） ============ */
function ensureRedeem(){
  if(!S.redeem||typeof S.redeem!=="object")S.redeem=DEFAULT_REDEEM();
  if(!Array.isArray(S.redeem.cats))S.redeem.cats=[];
  if(!Array.isArray(S.redeem.items))S.redeem.items=[];
  if(!Array.isArray(S.redeem.logs))S.redeem.logs=[];
  return S.redeem;
}
/* 库存：null/空 = 不限量 */
function rdmStock(it){const s=it&&it.stock;return (s===null||s===undefined||s==="")?null:+s;}
function rdmCatName(catId){const c=el(catId,ensureRedeem().cats);return c?c.name:"未分类";}
function rdmItem(id){return el(id,ensureRedeem().items);}
/* 可兑换积分 = 累计积分（S.points.scores，含奖惩，永久不变）
                − 奖励兑换已消耗（cost*qty，只减「可兑换积分」，不改「积分」）
                + 消除扣分已恢复（qty*cost，清除待消除扣分、抬升「可兑换积分」，不改「积分」） */
function rdmRewardSpent(sid){
  const R=ensureRedeem();
  return (R.logs||[]).reduce((a,l)=>{
    if(l.studentId!==sid||l.type==='eliminate')return a;
    return a+(+l.cost||0)*(+l.qty||1);
  },0);
}
function rdmForgiven(sid){
  const R=ensureRedeem();
  return (R.logs||[]).reduce((a,l)=>{
    if(l.studentId!==sid||l.type!=='eliminate')return a;
    const c=(+l.qty||0)?(+l.cost||0)*(+l.qty||1):(+l.cost||0);
    return a+c;
  },0);
}
function rdmBalance(sid){return (+(S.points.scores&&S.points.scores[sid]||0)) - rdmRewardSpent(sid) + rdmForgiven(sid);}
/* 按分类分组；筛选为 all 时列出全部分类 + 「未分类」兜底 */
function redeemGroups(){
  const R=ensureRedeem();
  const groups=[];
  (R.cats||[]).forEach(c=>{
    if(redeemCatFilter!=="all"&&redeemCatFilter!==c.id)return;
    groups.push({id:c.id,name:c.name,items:R.items.filter(i=>i.catId===c.id)});
  });
  if(redeemCatFilter==="all"){
    const orphans=R.items.filter(i=>!(R.cats||[]).some(c=>c.id===i.catId));
    if(orphans.length)groups.push({id:"",name:"未分类",items:orphans});
  }
  return groups;
}
function redeemSectionHtml(){
  const R=ensureRedeem();
  const groups=redeemGroups();
  const filterSel=`<select class="fld h30" style="width:auto" onchange="W.setRdmFilter(this.value)" title="按分类筛选">
      <option value="all" ${redeemCatFilter==="all"?"selected":""}>全部分类</option>
      ${R.cats.map(c=>`<option value="${esc(c.id)}" ${redeemCatFilter===c.id?"selected":""}>${esc(c.name)}</option>`).join("")}
    </select>`;
  const body=groups.map(g=>`
    <div class="rd-cat-h">${esc(g.name)}<span class="rd-cat-tag">${g.items.length}</span></div>
    ${g.items.length?`<div class="rd-grid">${g.items.map(it=>{
      const st=rdmStock(it),out=st!==null&&st<=0;
      return `<div class="rd-item">
        <div class="rd-name">${esc(it.name)}</div>
        <div class="rd-cost">${+it.cost||0} <small>分</small></div>
        <div class="rd-foot">
          <span class="rd-stock ${out?'out':''}">${st===null?"不限量":(out?"已兑完":"剩 "+st)}</span>
          <button class="btn ghost sm h24" ${out?"disabled":""} onclick="W.redeemItem('${it.id}')" title="用积分兑换">兑换</button>
        </div></div>`;}).join("")}</div>`:`<div class="tiny muted">该分类下暂无项目</div>`}
  `).join("")||(R.items.length?"":`<div class="empty">还没有兑换项目，点「管理」添加分类与奖励</div>`);
  const all=(R.logs||[]).slice().sort((a,b)=>(b.time||"").localeCompare(a.time||"")).slice(0,15);
  const logHtml=all.length?all.map(l=>{
    if(l.type==='eliminate'){
      const n=(+l.eliminated||(+l.cost||0)*(+l.qty||1)), m=n;
      const it=l.itemName?` <b>${esc(l.itemName)}</b>${l.qty>1?` ×${l.qty}`:""}`:"";
      return `<div class="r-item"><span class="r-dot" style="background:var(--bad);color:var(--bad)"></span>
        <div style="flex:1"><div>${esc(studentName(l.studentId))} 消除扣分${it} <b>${n}</b> 分<span class="tiny muted">（恢复 ${m} 可兑换积分，不改动原积分）</span></div><div class="tiny muted">${esc(l.time)}</div></div></div>`;
    }
    const c=(+l.cost||0)*(+l.qty||1);
    return `<div class="r-item"><span class="r-dot" style="background:var(--warn);color:var(--warn)"></span>
      <div style="flex:1"><div>${esc(studentName(l.studentId))} 兑换 <b>${esc(l.itemName)}</b>${l.qty>1?` ×${l.qty}`:""} <b>−${c}</b> 分${l.catName?` <span class="tiny muted">· ${esc(l.catName)}</span>`:""}</div><div class="tiny muted">${esc(l.time)}</div></div></div>`;
  }).join(""):`<div class="empty">还没有兑换记录</div>`;
  return `
  <div class="card pad">
    <div class="between row" style="margin-bottom:10px">
      <span class="section-title" style="margin:0">积分兑换</span>
      <span class="row" style="gap:6px">${filterSel}<button class="btn ghost sm h30" onclick="W.eliminateStart()" title="用可兑换积分消除已扣的分（不改动原积分）">消除扣分</button><button class="btn ghost sm h30" onclick="W.manageRedeem()">管理</button></span>
    </div>
    ${body}
  </div>
  <div class="card pad" style="margin-top:14px">
    <div class="between row wrap" style="margin-bottom:10px"><span class="section-title" style="margin:0">兑换记录</span>${all.length?`<span class="tiny muted">最近 ${all.length} 条</span>`:""}</div>
    ${logHtml}
  </div>`;
}
W.setRdmFilter=val=>{redeemCatFilter=val||"all";viewPoints(document.getElementById("view"));};
/* ---- 兑换弹窗 ---- */
W.redeemItem=id=>{

  openModal(`<h3>兑换：${esc(it.name)}</h3>
    <div class="field"><label class="lbl">学生</label>${(()=>{const ps=S.students.filter(s=>rdmBalance(s.id)>0);return ps.length?`<select class="fld" id="m_rs">${ps.map(s=>`<option value="${s.id}">${esc(s.name)}（可兑换 ${rdmBalance(s.id)} 分）</option>`).join("")}</select>`:`<div class="tiny muted">暂无「可兑换积分为正」的学生（需先有可兑换积分才能兑换奖励）</div>`;})()}</div>
    <div class="field row"><div style="flex:1"><label class="lbl">数量</label><input class="fld" id="m_rq" type="number" min="1" value="1" oninput="W.rdmTot()"></div>
      <div style="flex:1"><label class="lbl">单价（分）</label><input class="fld" id="m_rc" type="number" min="0" value="${+it.cost||0}" oninput="W.rdmTot()"></div></div>

W.rdmTot=()=>{
  const q=parseInt(document.getElementById("m_rq").value,10)||0;
  const c=parseInt(document.getElementById("m_rc").value,10)||0;
  const t=document.getElementById("m_rtot");if(t)t.textContent=String(q*c);
};
W.doRedeem=id=>{
  const R=ensureRedeem();const it=rdmItem(id);if(!it)return;
  const ss=document.getElementById("m_rs");const sid=ss?ss.value:"";
  if(!sid){toast("请先添加学生");return;}
  const qty=Math.max(1,parseInt(document.getElementById("m_rq").value,10)||1);
  const cost=Math.max(0,parseInt(document.getElementById("m_rc").value,10)||0);
  const st=rdmStock(it);
  if(st!==null&&st<qty){toast(st<=0?"库存已兑完":"库存不足，仅剩 "+st);return;}
  const total=cost*qty,bal=rdmBalance(sid);
  if(bal<total){toast(studentName(sid)+" 可兑换积分不足（当前 "+bal+" 分，需 "+total+" 分）");return;}
  const time=nowStr();
  /* 只记兑换消耗（进入 S.redeem.logs，用于算「可兑换积分」），绝不改动 S.points.scores / S.points.logs（积分不变） */
  R.logs.push({id:uid(),type:"reward",studentId:sid,itemId:id,itemName:it.name,catName:rdmCatName(it.catId),cost:cost,qty:qty,time:time});
  if(st!==null)it.stock=Math.max(0,st-qty);
  save();closeModal();refresh();
  toast("已兑换 "+it.name+(qty>1?" ×"+qty:"")+"，消耗 "+total+" 可兑换积分");
};
/* ---- 消除扣分：用可兑换积分抵消扣分（不改动原积分） ---- */
/* 消除分默认 = 兑换分 × 0.5（如笔芯兑换 10 分 → 消除 5 分）；弹窗内可手改 */
const ELIM_RATE=0.5;
function elimDefault(cost){return Math.round((+cost||0)*ELIM_RATE*100)/100;}
W.eliminateStart=()=>{
  if(!S.students.length){toast("请先添加学生");return;}
  const R=ensureRedeem();

      <div style="flex:1;min-width:0"><label class="lbl">数量</label><input class="fld h30" id="m_eli_q" type="number" min="1" value="1" style="width:100%" oninput="W.elimTot()"></div></div>
    <div class="tiny muted" style="margin:2px 0 10px">合计消除 <b id="m_eli_tot" style="color:var(--brand-ink)">0</b> 分（将恢复等额可兑换积分，不超过待消除扣分）</div>
    <div class="foot"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn" onclick="W.eliminateDo()">确认消除</button></div>`);

/* 选/输物品后，按兑换页同名项目的「兑换分 × 0.5」自动填「对应消除几分」 */
W.elimItem=()=>{
  const inp=document.getElementById("m_eli_item"),c=document.getElementById("m_eli_c");
  if(!inp||!c)return;
  const name=(inp.value||"").trim();
  const it=(ensureRedeem().items||[]).find(x=>x.name===name);
  if(it)c.value=String(elimDefault(it.cost));
  W.elimTot();
};
W.elimTot=()=>{
  const q=parseFloat((document.getElementById("m_eli_q")||{}).value)||0;
  const c=parseFloat((document.getElementById("m_eli_c")||{}).value)||0;
  const t=document.getElementById("m_eli_tot");if(t)t.textContent=String(Math.round(q*c*100)/100);
};
W.eliminateDo=()=>{
  const ss=document.getElementById("m_eli_s");const sid=ss?ss.value:"";
  if(!sid){toast("请选择学生");return;}
  const name=(document.getElementById("m_eli_item").value||"").trim();
  if(!name){toast("请填写物品");return;}
  const cost=Math.max(0,parseFloat(document.getElementById("m_eli_c").value)||0);
  const qty=Math.max(1,parseFloat(document.getElementById("m_eli_q").value)||1);
  const total=Math.round(cost*qty*100)/100,bal=rdmBalance(sid);
  if(bal>=0){toast(studentName(sid)+" 当前没有待消除扣分（可兑换积分非负）");return;}
  const debt=-bal;
  if(total>debt){toast(studentName(sid)+" 消除超过待消除扣分（最多可消除 "+debt+" 分）");return;}
  const time=nowStr();
  /* 只记一条「消除扣分」记录：恢复 total(=cost*qty) 可兑换积分（清除待消除扣分），S.points 原积分不动 */
  ensureRedeem().logs.push({id:uid(),type:"eliminate",studentId:sid,itemName:name,cost:cost,qty:qty,eliminated:total,time:time});
  save();closeModal();refresh();
  toast("已消除「"+name+(qty>1?" ×"+qty:"")+"」 "+total+" 分扣分，恢复 "+total+" 可兑换积分");
};

/* ============ LOTTERY ============ */
let rollTimer=null,punRollTimer=null;
/* 抽签：候选池随「允许重复」开关变化；不重复=未抽过的人，重复=全部学生 */
function lotPool(){
  const cfg=S.lottery||(S.lottery={drawn:[],allowRepeat:false});
  return cfg.allowRepeat?S.students.slice():S.students.filter(s=>!cfg.drawn.includes(s.id));
}
function lotRemain(){const c=lotPool().length;return c;}
function lotListsHtml(){
  const cfg=S.lottery;const rep=!!cfg.allowRepeat;
  const title=rep?"抽取记录":"已抽出";
  return `<div class="section-title">${title}（${cfg.drawn.length}）</div>
    <div class="drawn-list">${cfg.drawn.length?cfg.drawn.map((id,i)=>`<span class="d">${rep?`<span class="tiny muted" style="margin-right:4px">${i+1}</span>`:""}${esc(studentName(id))}</span>`).join(""):`<span class="tiny muted">本轮还没抽过</span>`}</div>`;
}
